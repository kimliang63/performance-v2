<style>
:root{--pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;--em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;--ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;--c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;--sf:#FFF;--bg:#FAFAF9;--dv:#F4F4F5;--shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);--header-h:52px;--r1:6px;--r2:8px;--r3:10px;--f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;--m:'JetBrains Mono','SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}button,input,textarea,select{font-family:inherit}button{cursor:pointer}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

.inp{border:1px solid var(--c2);border-radius:var(--r1);padding:7px 10px;font:400 13px/1.4 var(--f);color:var(--c9);background:var(--sf);outline:none;transition:border-color .15s,box-shadow .15s;width:100%;min-height:34px}.inp:focus{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr100)}.inp::placeholder{color:var(--c4)}textarea.inp{resize:vertical}select.inp{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}label{font:500 13px/1 var(--f);color:var(--c6);display:block;margin-bottom:7px}.req{color:var(--ro);margin-right:3px}.filter-bar{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}.filter-bar .form-g{flex:none}.form-g{min-width:0}.badge{display:inline-flex;align-items:center;font:600 11px/1 var(--f);padding:4px 8px;border-radius:var(--r1)}.badge-ok{color:var(--em700);background:var(--em50)}.badge-off{color:var(--c5);background:var(--c1)}.formula-cell{font:400 12px/1.4 var(--m);color:var(--c7);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi .2s ease forwards}
.edit-page{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);overflow:hidden;min-height:720px}.edit-title{height:52px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--dv);font:600 16px/1 var(--f);color:var(--c9)}.fold{border-bottom:1px solid var(--dv)}.fold-hd{width:100%;height:48px;padding:0 18px;border:0;background:#F8FAFC;display:flex;align-items:center;gap:10px;color:var(--c8);font:500 13px/1 var(--f);text-align:left}.fold-hd:hover{background:#F5F7FA}.fold-hd svg{width:14px;height:14px;color:var(--c5);transition:transform .18s}.fold-hd[aria-expanded="false"] svg{transform:rotate(-90deg)}.fold-hd[aria-expanded="false"]+.fold-bd{display:none}.basic-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr) minmax(180px,.7fr);gap:18px 28px;padding:20px 76px 24px}.span-2{grid-column:span 2}.radio-line{min-height:34px;display:flex;align-items:center;gap:20px}.radio{display:inline-flex;align-items:center;gap:7px;margin:0;color:var(--c7);cursor:pointer}.radio input{width:15px;height:15px;accent-color:var(--pr)}
.formula-layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:390px;padding:16px 22px 24px;gap:12px}.fe-side{border:1px solid var(--c2);border-radius:var(--r1);overflow:hidden;display:flex;flex-direction:column;min-height:390px}.fe-tabs{display:flex;height:38px;border-bottom:1px solid var(--c2);background:var(--c0)}.fe-tab{position:relative;padding:0 18px;border:0;background:transparent;color:var(--c6);font:500 13px/1 var(--f)}.fe-tab.active{color:var(--pr);background:var(--sf)}.fe-tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--pr)}.fe-search{padding:9px;border-bottom:1px solid var(--dv);position:relative}.fe-search svg{position:absolute;right:19px;top:19px;width:13px;height:13px;color:var(--c4)}.fe-search .inp{padding-right:30px;height:32px;min-height:32px}.fe-panel{flex:1;padding:8px;overflow:auto}.hidden{display:none!important}.tree-row{width:100%;display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:4px;padding:8px 7px;color:var(--c7);font:500 13px/1 var(--f);text-align:left}.tree-row:hover{background:var(--pr50);color:var(--pr)}.tree-row svg{width:12px;height:12px;transition:transform .15s}.tree-row.closed svg{transform:rotate(-90deg)}.tree-items{padding-left:20px}.tree-items.closed{display:none}.tree-item,.fn-item{display:block;width:100%;padding:7px 9px;border:0;background:transparent;border-radius:4px;color:var(--c6);font:400 12px/1.25 var(--f);text-align:left}.tree-item:hover,.fn-item:hover{background:var(--pr50);color:var(--pr)}.fn-cat{padding:9px 9px 4px;color:var(--c4);font:600 11px/1 var(--f);letter-spacing:.2px}
.fe-editor-wrap{border:1px solid var(--c2);border-radius:var(--r1);overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:390px}.fe-editor-label{height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 14px;border-bottom:1px solid var(--c2);background:var(--c0);font:500 13px/1 var(--f);color:var(--c7)}.fe-editor-label-ops{display:flex;align-items:center;gap:2px}.fe-label-btn{height:26px;padding:0 8px;border:0;background:transparent;color:var(--pr);font:500 12px/1 var(--f);border-radius:4px;display:inline-flex;align-items:center;gap:4px}.fe-label-btn:hover{background:var(--pr50)}.fe-label-btn svg{width:13px;height:13px}.op-bar{min-height:38px;display:flex;align-items:center;gap:1px;padding:5px 10px;border-bottom:1px solid var(--c2);background:#F8FAFC;flex-wrap:wrap}.op-btn{min-width:28px;height:27px;padding:0 7px;border:0;background:transparent;border-radius:4px;color:var(--pr);font:500 12px/1 var(--m)}.op-btn:hover{background:var(--pr50)}.op-sep{width:1px;height:18px;background:var(--c2);margin:0 5px}.code-area{display:grid;grid-template-columns:38px minmax(0,1fr);flex:1;min-height:235px;background:var(--sf)}.line-no{padding:12px 10px;background:var(--c0);border-right:1px solid var(--dv);text-align:right;color:var(--c4);font:400 12px/1.6 var(--m);user-select:none}.fe-editor{width:100%;height:100%;min-height:235px;border:0;outline:0;resize:none;padding:12px 14px;color:var(--c9);font:400 13px/1.6 var(--m);background:var(--sf)}.fe-editor::placeholder{color:var(--c4)}.editor-actions{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border-top:1px solid var(--c2);background:#F8FAFC}.editor-actions-l{display:flex;align-items:center;gap:8px}.check-result{font:500 12px/1.4 var(--f)}.check-result.ok{color:var(--em700)}.check-result.err{color:var(--ro)}
.trial-box{display:none;border-top:1px solid var(--c2);background:#FBFDFF;padding:16px}.trial-box.on{display:block;animation:fi .18s ease}.trial-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}.trial-title{font:600 13px/1.2 var(--f);color:var(--c8)}.trial-sub{font:400 11px/1.4 var(--f);color:var(--c5);margin-top:3px}.trial-params{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:12px}.trial-param label{font-size:12px;margin-bottom:5px}.trial-empty{grid-column:1/-1;padding:10px 12px;border:1px dashed var(--c3);border-radius:var(--r1);color:var(--c5);font:400 12px/1.4 var(--f)}.trial-calc{display:flex;justify-content:flex-end;margin-top:12px}.trial-result{display:none;margin-top:14px;padding:14px 16px;border:1px solid var(--em100);background:var(--em50);border-radius:var(--r1)}.trial-result.on{display:flex;align-items:center;justify-content:space-between;gap:16px}.trial-result.err{border-color:var(--ro100);background:var(--ro50)}.result-label{font:500 12px/1 var(--f);color:var(--c6);margin-bottom:5px}.result-value{font:700 24px/1 var(--m);color:var(--em700)}.trial-result.err .result-value{font:600 13px/1.4 var(--f);color:var(--ro)}.result-note{font:400 11px/1.4 var(--f);color:var(--c5);text-align:right}.edit-footer{height:68px;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--dv);background:var(--sf)}
@media(max-width:1100px){.basic-grid{padding:20px 28px;grid-template-columns:1fr 1fr}.formula-layout{grid-template-columns:220px minmax(0,1fr)}.trial-params{grid-template-columns:repeat(2,minmax(130px,1fr))}}@media(max-width:760px){.sec-hd,.sec-bd{padding:16px}.basic-grid{grid-template-columns:1fr;padding:18px}.span-2{grid-column:auto}.formula-layout{grid-template-columns:1fr;padding:12px}.fe-side{min-height:220px}.trial-params{grid-template-columns:1fr}.editor-actions{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script src="navigation.js"></script>
<script>
const I={settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.18V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 7.1 19.7l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.1 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.3 7.1l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 10 3.1V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 2.9 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.9 10h.1a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>',copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',paste:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>'};
let CALC_RULES=[{id:1,name:'绩效得分加权计算',code:'PERF_SCORE_WEIGHTED',dept:'中国区',down:true,formula:'SUM(评分*权重)/SUM(权重)',desc:'按节点权重加权计算绩效得分',enabled:true},{id:2,name:'目标完成率计算',code:'GOAL_COMPLETION_RATE',dept:'中国区',down:false,formula:'完成目标数/总目标数*100',desc:'计算目标完成百分比',enabled:true},{id:3,name:'360度综合评分',code:'MULTI_360_SCORE',dept:'华东大区',down:true,formula:'上级评分*40%+同事评分*30%+下级评分*20%+自评分数*10%',desc:'360度评价加权综合得分',enabled:true},{id:4,name:'OKR得分计算',code:'OKR_SCORE',dept:'中国区',down:false,formula:'AVG(关键结果得分)*信心指数',desc:'OKR关键结果平均分乘以信心指数',enabled:false}];
let nextId=5,searchText='',filterDept='',viewMode='list',editingId=null,formulaClipboard='';
const FIELD_GROUPS=[{name:'组织人事',items:['工作天数','出勤率','职级系数']},{name:'绩效',items:['完成值','目标值','挑战值','保底值','完成目标数','总目标数','评分','权重','绩效自评分','上级评分','同事评分','下级评分','自评分数','关键结果得分','信心指数','KPI得分','OKR得分']}];
const FUNCTION_GROUPS=[{name:'逻辑函数',items:[{name:'IF',sig:'IF(条件, 真值, 假值)'},{name:'AND',sig:'AND(条件1, 条件2)'},{name:'OR',sig:'OR(条件1, 条件2)'}]},{name:'数学函数',items:[{name:'SUM',sig:'SUM(数值1, 数值2)'},{name:'AVG',sig:'AVG(数值1, 数值2)'},{name:'MAX',sig:'MAX(数值1, 数值2)'},{name:'MIN',sig:'MIN(数值1, 数值2)'},{name:'ROUND',sig:'ROUND(数值, 小数位)'},{name:'ABS',sig:'ABS(数值)'}]}];
const FORMULA_FUNCTIONS=['SUM','AVG','MAX','MIN','ROUND','ABS','IF','AND','OR'];
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function render(){viewMode==='list'?renderList():renderEditor();}
function renderList(){const rows=CALC_RULES.filter(r=>(!searchText||r.name.includes(searchText)||r.code.includes(searchText))&&(!filterDept||r.dept===filterDept)).map((r,i)=>`<tr><td>${i+1}</td><td style="font-weight:500;color:var(--c8)">${esc(r.name)}</td><td style="font:500 12px/1 var(--m)">${esc(r.code)}</td><td>${esc(r.dept)}</td><td>${r.down?'是':'否'}</td><td class="formula-cell" title="${esc(r.formula)}">${esc(r.formula)}</td><td>${r.enabled?'<span class="badge badge-ok">启用</span>':'<span class="badge badge-off">停用</span>'}</td><td><button class="btn btn-s btn-sm btn-edit" data-id="${r.id}">${I.edit} 编辑</button> <button class="btn btn-d btn-sm btn-del" aria-label="删除${esc(r.name)}" data-id="${r.id}">${I.trash}</button></td></tr>`).join('');document.getElementById('app').innerHTML=`<div class="sec fi"><div class="sec-hd"><div class="sec-hd-l"><div class="sec-hd-ic">${I.settings}</div><div><div class="sec-hd-t">计算规则</div><div class="sec-hd-s">Calculation Rules · 管理绩效评分的计算公式</div></div></div><button class="btn btn-p" id="btnAdd">${I.plus} 新增规则</button></div><div class="sec-bd"><div class="filter-bar"><div class="form-g" style="width:220px"><label for="searchInp">名称或编码</label><input class="inp" id="searchInp" placeholder="请输入" value="${esc(searchText)}"></div><div class="form-g" style="width:160px"><label for="filterDept">部门</label><select class="inp" id="filterDept"><option value="">全部</option><option ${filterDept==='中国区'?'selected':''}>中国区</option><option ${filterDept==='华东大区'?'selected':''}>华东大区</option></select></div><button class="btn btn-s" id="btnSearch">${I.search} 查询</button><button class="btn btn-s" id="btnReset">${I.refresh} 重置</button></div><div class="tbl-wrap"><table><thead><tr><th>序号</th><th>名称</th><th>编码</th><th>部门</th><th>向下公开</th><th>公式</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;document.getElementById('btnAdd').onclick=()=>openEditor(-1);document.getElementById('btnSearch').onclick=()=>{searchText=document.getElementById('searchInp').value.trim();filterDept=document.getElementById('filterDept').value;renderList()};document.getElementById('btnReset').onclick=()=>{searchText='';filterDept='';renderList()};document.getElementById('searchInp').onkeydown=e=>{if(e.key==='Enter')document.getElementById('btnSearch').click()};document.querySelectorAll('.btn-edit').forEach(b=>b.onclick=()=>openEditor(Number(b.dataset.id)));document.querySelectorAll('.btn-del').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id),r=CALC_RULES.find(x=>x.id===id);if(confirm(`确定删除“${r.name}”吗？`)){CALC_RULES=CALC_RULES.filter(x=>x.id!==id);renderList()}})}
function openEditor(id){editingId=id;viewMode='editor';renderEditor()}
function renderEditor(){const isNew=editingId<0,r=isNew?{name:'',code:`PERSC${String(nextId).padStart(3,'0')}`,dept:'',down:false,formula:'',desc:'',enabled:true}:CALC_RULES.find(x=>x.id===editingId);const fields=FIELD_GROUPS.map((g,gi)=>`<div class="tree-group"><button class="tree-row" type="button" aria-expanded="true" data-tree="fields-${gi}">${I.chevron}${g.name}</button><div class="tree-items" id="fields-${gi}">${g.items.map(x=>`<button type="button" class="tree-item" data-insert="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`).join('');const funcs=FUNCTION_GROUPS.map(g=>`<div class="fn-cat">${g.name}</div>${g.items.map(x=>`<button type="button" class="fn-item" data-insert="${esc(x.name+'()')}" title="${esc(x.sig)}">${esc(x.name)} <span style="color:var(--c4);font-weight:400">${esc(x.sig.slice(x.name.length))}</span></button>`).join('')}`).join('');const ops=['if','then','else','and','or','|','+','-','*','/','=','!=','>','<','>=','<=','|','//','()','""'].map(x=>x==='|'?'<span class="op-sep"></span>':`<button type="button" class="op-btn" data-op="${esc(x)}">${esc(x)}</button>`).join('');document.getElementById('app').innerHTML=`<div class="edit-page fi"><div class="edit-title">${isNew?'新增计算规则':'编辑计算规则'}</div><section class="fold"><button type="button" class="fold-hd" aria-expanded="true">${I.chevron}<span>基本信息</span></button><div class="fold-bd"><div class="basic-grid"><div class="form-g"><label for="mName"><span class="req">*</span>名称</label><input class="inp" id="mName" maxlength="200" placeholder="请输入" value="${esc(r.name)}"></div><div class="form-g"><label for="mDept"><span class="req">*</span>部门</label><select class="inp" id="mDept"><option value="">请选择</option><option ${r.dept==='中国区'?'selected':''}>中国区</option><option ${r.dept==='华东大区'?'selected':''}>华东大区</option><option ${r.dept==='华南大区'?'selected':''}>华南大区</option></select></div><div class="form-g"><label><span class="req">*</span>向下公开</label><div class="radio-line"><label class="radio"><input type="radio" name="mDown" value="1" ${r.down?'checked':''}>是</label><label class="radio"><input type="radio" name="mDown" value="0" ${!r.down?'checked':''}>否</label></div></div><div class="form-g"><label><span class="req">*</span>是否启用</label><div class="radio-line"><label class="radio"><input type="radio" name="mEnabled" value="1" ${r.enabled?'checked':''}>启用</label><label class="radio"><input type="radio" name="mEnabled" value="0" ${!r.enabled?'checked':''}>停用</label></div></div><div class="form-g span-2"><label for="mDesc">规则描述</label><textarea class="inp" id="mDesc" maxlength="500" rows="2" placeholder="请输入">${esc(r.desc)}</textarea></div></div></div></section><section class="fold"><button type="button" class="fold-hd" aria-expanded="true">${I.chevron}<span>公式设置</span></button><div class="fold-bd"><div class="formula-layout"><aside class="fe-side"><div class="fe-tabs" role="tablist"><button type="button" class="fe-tab active" role="tab" aria-selected="true" data-panel="fieldPanel">字段</button><button type="button" class="fe-tab" role="tab" aria-selected="false" data-panel="funcPanel">函数</button></div><div class="fe-search">${I.search}<input class="inp" id="feSearch" aria-label="搜索字段或函数" placeholder="搜索"></div><div class="fe-panel" id="fieldPanel">${fields}</div><div class="fe-panel hidden" id="funcPanel">${funcs}</div></aside><div class="fe-editor-wrap"><div class="fe-editor-label"><span>公式</span><div class="fe-editor-label-ops"><button type="button" class="fe-label-btn" id="btnCopyFormula">${I.copy} 复制</button><button type="button" class="fe-label-btn" id="btnPasteFormula">${I.paste} 粘贴</button></div></div><div class="op-bar">${ops}</div><div class="code-area"><div class="line-no">1</div><textarea class="fe-editor" id="mFormula" spellcheck="false" placeholder="请输入公式，如：完成值 / 目标值 * 100">${esc(r.formula)}</textarea></div><div class="editor-actions"><div class="editor-actions-l"><button type="button" class="btn btn-s btn-sm" id="btnClear">清空</button><button type="button" class="btn btn-o btn-sm" id="btnCheck">检查</button><button type="button" class="btn btn-o btn-sm" id="btnTrial">${I.calc} 试算</button></div><div class="check-result" id="checkResult" role="status"></div></div><div class="trial-box" id="trialBox"><div class="trial-hd"><div><div class="trial-title">试算参数</div><div class="trial-sub">根据当前公式引用的字段生成，请输入本次试算值</div></div><button type="button" class="btn btn-s btn-sm" id="btnCloseTrial">收起</button></div><div class="trial-params" id="trialParams"></div><div class="trial-calc"><button type="button" class="btn btn-p" id="btnCalculate">${I.calc} 计算</button></div><div class="trial-result" id="trialResult" role="status"></div></div></div></div></div></section><div class="edit-footer"><button type="button" class="btn btn-s" id="btnBack">${I.back} 返回</button><button type="button" class="btn btn-p" id="btnSave">${I.save} 保存</button></div></div>`;bindEditorEvents(r,isNew)}
function bindEditorEvents(r,isNew){document.querySelectorAll('.fold-hd').forEach(btn=>btn.onclick=()=>btn.setAttribute('aria-expanded',btn.getAttribute('aria-expanded')==='true'?'false':'true'));document.querySelectorAll('.fe-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.fe-tab').forEach(t=>{t.classList.remove('active');t.setAttribute('aria-selected','false')});tab.classList.add('active');tab.setAttribute('aria-selected','true');document.querySelectorAll('.fe-panel').forEach(p=>p.classList.add('hidden'));document.getElementById(tab.dataset.panel).classList.remove('hidden');filterFormulaItems()});document.querySelectorAll('.tree-row').forEach(btn=>btn.onclick=()=>{const panel=document.getElementById(btn.dataset.tree),closed=panel.classList.toggle('closed');btn.classList.toggle('closed',closed);btn.setAttribute('aria-expanded',String(!closed))});document.querySelectorAll('[data-insert]').forEach(btn=>btn.onclick=()=>insertAtCursor(btn.dataset.insert));document.querySelectorAll('.op-btn').forEach(btn=>btn.onclick=()=>insertAtCursor(btn.dataset.op==='if'?'IF(条件, 真值, 假值)':` ${btn.dataset.op} `));document.getElementById('feSearch').oninput=filterFormulaItems;document.getElementById('mFormula').oninput=resetFormulaFeedback;document.getElementById('btnCopyFormula').onclick=copyFormula;document.getElementById('btnPasteFormula').onclick=pasteFormula;document.getElementById('btnClear').onclick=()=>{document.getElementById('mFormula').value='';resetFormulaFeedback();document.getElementById('mFormula').focus()};document.getElementById('btnCheck').onclick=()=>checkFormula(true);document.getElementById('btnTrial').onclick=openTrial;document.getElementById('btnCloseTrial').onclick=closeTrial;document.getElementById('btnCalculate').onclick=calculateTrial;document.getElementById('btnBack').onclick=()=>{viewMode='list';editingId=null;renderList()};document.getElementById('btnSave').onclick=()=>saveRule(r,isNew)}
function filterFormulaItems(){const q=document.getElementById('feSearch').value.trim().toLowerCase();document.querySelectorAll('.fe-panel:not(.hidden) .tree-item,.fe-panel:not(.hidden) .fn-item').forEach(el=>el.classList.toggle('hidden',!!q&&!el.textContent.toLowerCase().includes(q)))}
function resetFormulaFeedback(){const result=document.getElementById('checkResult');result.textContent='';result.className='check-result';closeTrial()}
function insertAtCursor(text){const area=document.getElementById('mFormula'),start=area.selectionStart,end=area.selectionEnd;area.value=area.value.slice(0,start)+text+area.value.slice(end);area.focus();const cursor=text.endsWith('()')?start+text.length-1:start+text.length;area.selectionStart=area.selectionEnd=cursor;resetFormulaFeedback()}
function copyFormula(){const text=document.getElementById('mFormula').value;if(!text.trim()){GHR_NAV.showToast('当前没有可复制的公式');return}formulaClipboard=text;const done=()=>GHR_NAV.showToast('公式已复制');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>{copyFormulaFallback(text);done()})}else{copyFormulaFallback(text);done()}}
function copyFormulaFallback(text){const area=document.getElementById('mFormula'),start=area.selectionStart,end=area.selectionEnd;area.focus();area.value=text;area.select();try{document.execCommand('copy')}catch(e){}area.setSelectionRange(start,end)}
function pasteFormula(){const apply=text=>{if(!String(text||'').length){GHR_NAV.showToast('没有可粘贴的公式');return}const area=document.getElementById('mFormula');area.value=text;area.focus();area.selectionStart=area.selectionEnd=text.length;resetFormulaFeedback();GHR_NAV.showToast('公式已粘贴')};if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(t=>apply((t&&t.length)?t:formulaClipboard)).catch(()=>apply(formulaClipboard))}else apply(formulaClipboard)}
function checkFormula(showSuccess){const formula=document.getElementById('mFormula').value.trim(),out=document.getElementById('checkResult');let msg='';if(!formula)msg='公式不能为空';else{let count=0;for(const ch of formula){if(ch==='(')count++;if(ch===')')count--;if(count<0)break}if(count!==0)msg='括号不匹配，请检查公式';else if(/[A-Z]+\(\s*\)/.test(formula))msg='函数参数不能为空';else msg=validateFormulaSyntax(formula)}out.className=`check-result ${msg?'err':'ok'}`;out.textContent=msg||(showSuccess?'公式检查通过':'');return !msg}
function extractTrialFields(formula){const names=FIELD_GROUPS.flatMap(g=>g.items).sort((a,b)=>b.length-a.length),hits=[];names.forEach(name=>{let from=0,pos;while((pos=formula.indexOf(name,from))>-1){hits.push({name,pos,end:pos+name.length});from=pos+name.length}});hits.sort((a,b)=>a.pos-b.pos||b.name.length-a.name.length);const chosen=[];hits.forEach(h=>{if(!chosen.some(c=>h.pos<c.end&&h.end>c.pos))chosen.push(h)});return[...new Set(chosen.sort((a,b)=>a.pos-b.pos).map(h=>h.name))]}
function prepareFormula(formula,values){let expr=formula;Object.keys(values).sort((a,b)=>b.length-a.length).forEach(k=>{expr=expr.split(k).join(String(values[k]))});expr=expr.replace(/，/g,',').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)').replace(/(?<![<>=!])=(?!=)/g,'==');if(!/^[\d\s+\-*/%().,<>=!A-Z_]+$/.test(expr))throw new Error('公式包含未赋值字段或不支持的内容');const unknown=(expr.match(/[A-Z_]+/g)||[]).find(name=>!FORMULA_FUNCTIONS.includes(name));if(unknown)throw new Error(`不支持函数 ${unknown}`);return expr}
function validateFormulaSyntax(formula){try{const values=Object.fromEntries(extractTrialFields(formula).map(name=>[name,1])),expr=prepareFormula(formula,values);Function(...FORMULA_FUNCTIONS,`"use strict";return (${expr})`);return''}catch(err){return err instanceof SyntaxError?'公式格式无效，请检查表达式':(err.message||'公式格式无效，请检查表达式')}}
function openTrial(){if(!checkFormula(false))return;const formula=document.getElementById('mFormula').value.trim(),params=extractTrialFields(formula);document.getElementById('trialParams').innerHTML=params.length?params.map((name,i)=>`<div class="trial-param"><label for="trial-${i}">${esc(name)}</label><input class="inp trial-input" id="trial-${i}" data-field="${esc(name)}" type="number" step="any" placeholder="请输入"></div>`).join(''):'<div class="trial-empty">当前公式不含字段，无需输入参数</div>';document.getElementById('trialResult').className='trial-result';document.getElementById('trialResult').innerHTML='';document.getElementById('trialBox').classList.add('on');document.getElementById('btnTrial').innerHTML=I.calc+' 试算中';document.querySelector('.trial-input')?.focus()}
function closeTrial(){const box=document.getElementById('trialBox');if(box)box.classList.remove('on');const btn=document.getElementById('btnTrial');if(btn)btn.innerHTML=I.calc+' 试算'}
function calculateTrial(){const inputs=[...document.querySelectorAll('.trial-input')],result=document.getElementById('trialResult'),missing=inputs.find(x=>x.value==='');if(missing){result.className='trial-result on err';result.innerHTML='<div><div class="result-label">试算结果</div><div class="result-value">请完整输入试算参数</div></div>';missing.focus();return}const values=Object.fromEntries(inputs.map(x=>[x.dataset.field,Number(x.value)]));try{const value=evaluateFormula(document.getElementById('mFormula').value.trim(),values);if(!Number.isFinite(value))throw new Error('计算结果无效，请检查除数是否为 0');const shown=Number.isInteger(value)?String(value):String(Number(value.toFixed(4)));result.className='trial-result on';result.innerHTML=`<div><div class="result-label">试算结果</div><div class="result-value">${esc(shown)}</div></div><div class="result-note">已使用 ${inputs.length} 个参数完成计算<br>结果仅用于验证当前公式，不会保存</div>`}catch(err){result.className='trial-result on err';result.innerHTML=`<div><div class="result-label">试算结果</div><div class="result-value">${esc(err.message||'公式暂时无法计算，请检查表达式')}</div></div>`}}
function evaluateFormula(formula,values){const expr=prepareFormula(formula,values),SUM=(...xs)=>xs.reduce((a,b)=>a+b,0),AVG=(...xs)=>SUM(...xs)/xs.length,MAX=Math.max,MIN=Math.min,ROUND=(x,n=0)=>Number(Number(x).toFixed(Number(n))),ABS=Math.abs,IF=(c,a,b)=>c?a:b,AND=(...xs)=>xs.every(Boolean),OR=(...xs)=>xs.some(Boolean);try{return Function(...FORMULA_FUNCTIONS,`"use strict";return (${expr})`)(SUM,AVG,MAX,MIN,ROUND,ABS,IF,AND,OR)}catch(err){throw new Error('公式格式无效，请检查表达式')}}
function saveRule(r,isNew){const name=document.getElementById('mName').value.trim(),dept=document.getElementById('mDept').value;if(!name){GHR_NAV.showToast('请输入名称');document.getElementById('mName').focus();return}if(!dept){GHR_NAV.showToast('请选择部门');document.getElementById('mDept').focus();return}if(!checkFormula(false)){document.getElementById('mFormula').focus();return}const data={name,code:r.code,dept,down:document.querySelector('input[name="mDown"]:checked').value==='1',formula:document.getElementById('mFormula').value.trim(),desc:document.getElementById('mDesc').value.trim(),enabled:document.querySelector('input[name="mEnabled"]:checked').value==='1'};if(isNew){data.id=nextId++;CALC_RULES.push(data)}else Object.assign(r,data);viewMode='list';editingId=null;renderList();GHR_NAV.showToast(isNew?'计算规则已保存':'计算规则已更新')}
GHR_NAV.init('perf','计算规则');render();
</script>
