const LEAVE_TYPES=['年假','病假','事假','婚假','产假','陪产假','育儿假','工伤假','无薪假'];

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clampAutoRemoveDays(v){
  var n=parseInt(v,10);
  if(isNaN(n)) return 7;
  if(n<1) return 1;
  if(n>365) return 365;
  return n;
}
function filterLeaveTypes(list){
  if(!Array.isArray(list)) return [];
  return LEAVE_TYPES.filter(function(t){return list.indexOf(t)>=0;});
}
function normalizeAutoRemove(ar){
  if(!ar||typeof ar!=='object') ar={enabled:false};
  var hasStructured=!!(ar.resignation||ar.leaveStart||ar.leaveEnd);
  return {
    enabled:!!ar.enabled,
    resignation:{
      enabled:hasStructured?!!(ar.resignation&&ar.resignation.enabled):!!(ar.conditions&&ar.conditions.indexOf('resignation')>=0),
      days:clampAutoRemoveDays(ar.resignation&&ar.resignation.days)
    },
    leaveStart:{
      enabled:!!(ar.leaveStart&&ar.leaveStart.enabled),
      leaveTypes:filterLeaveTypes(ar.leaveStart&&ar.leaveStart.leaveTypes),
      days:clampAutoRemoveDays(ar.leaveStart&&ar.leaveStart.days)
    },
    leaveEnd:{
      enabled:!!(ar.leaveEnd&&ar.leaveEnd.enabled),
      leaveTypes:filterLeaveTypes(ar.leaveEnd&&ar.leaveEnd.leaveTypes),
      days:clampAutoRemoveDays(ar.leaveEnd&&ar.leaveEnd.days)
    }
  };
}
function formatLeaveTypes(types){
  return types&&types.length?types.map(escHtml).join('、'):'未选择假种';
}
function formatScopeRules(rules){
  if(!rules) return '未配置';
  if(typeof rules==='string') return escHtml(rules);
  if(!rules.length) return '未配置';
  return rules.map(function(rule,ri){
    var conds=(rule.conditions||[rule]).map(function(c){
      return escHtml(c.field||'')+' '+escHtml(c.op||'')+' '+escHtml(c.val||'');
    }).join(' <span style="color:var(--c5)">且</span> ');
    return '<div style="font:400 12px/1.6 var(--f);color:var(--c7)">'+conds+'</div>'+
      (ri<rules.length-1?'<div style="font:500 12px/1.6 var(--f);color:var(--c5);margin:2px 0">或</div>':'');
  }).join('');
}
function renderAutoRemoveSummary(raw){
  var ar=normalizeAutoRemove(raw);
  if(!ar.enabled) return '';
  var items=[];
  if(ar.resignation.enabled) items.push('员工离职：周期开始后 '+escHtml(ar.resignation.days)+' 天内有效');
  if(ar.leaveStart.enabled) items.push('开始休假：假种 '+formatLeaveTypes(ar.leaveStart.leaveTypes)+'；周期开始后 '+escHtml(ar.leaveStart.days)+' 天内有效');
  if(ar.leaveEnd.enabled) items.push('结束休假：假种 '+formatLeaveTypes(ar.leaveEnd.leaveTypes)+'；周期结束前 '+escHtml(ar.leaveEnd.days)+' 天内有效');
  var body=items.length
    ? items.map(function(t){return '<div style="font:400 12px/1.5 var(--f);color:var(--c7)">'+t+'</div>';}).join('')
    : '<div style="font:400 12px/1 var(--f);color:var(--c5)">未配置</div>';
  return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--dv)">'+
    '<div style="font:600 12px/1 var(--f);color:var(--c6);margin-bottom:6px">移除人员规则</div>'+body+'</div>';
}

var REMIND_TZ_OPTIONS=['GMT-8','GMT-5','GMT-3','GMT+0','GMT+1','GMT+2','GMT+3','GMT+8','GMT+9'];
var REMIND_END_DEFAULT=['09:00','11:00','13:00','15:00','17:00','19:00','21:00'];
function normRemindClock(val,fallback){
  var m=String(val||'').match(/^(\d{2}:\d{2})/);
  return m?m[1]:fallback;
}
function normRemindTz(val){
  var raw=String(val||'').replace(/\s+/g,'').toUpperCase();
  var m=raw.match(/^GMT([+-])0*(\d{1,2})(?::?(\d{2}))?$/);
  if(!m) return 'GMT+8';
  var label='GMT'+m[1]+String(parseInt(m[2],10));
  return REMIND_TZ_OPTIONS.indexOf(label)>=0?label:'GMT+8';
}
function normalizeRemindClocks(list){
  var seen={};
  var out=[];
  (list||[]).forEach(function(t){
    var c=normRemindClock(t,'');
    if(!c||seen[c]) return;
    seen[c]=1;
    out.push(c);
  });
  out.sort();
  return out;
}
function normalizeRemindDayTimes(saved){
  if(saved&&Array.isArray(saved.times)) return normalizeRemindClocks(saved.times);
  if(saved&&saved.time){
    var c=normRemindClock(saved.time,'');
    return c?[c]:['09:00'];
  }
  return ['09:00'];
}
function normalizeRemindEndTimes(saved){
  if(saved&&Array.isArray(saved.endTimes)) return normalizeRemindClocks(saved.endTimes);
  return REMIND_END_DEFAULT.slice();
}
function syncSchemeRemind(){
  try{
    var raw=localStorage.getItem('hrone-perf-scheme-autoRemind');
    if(!raw){
      SCHEME.autoRemind.tz=normRemindTz(SCHEME.autoRemind.tz);
      SCHEME.autoRemind.times=normalizeRemindDayTimes(SCHEME.autoRemind);
      SCHEME.autoRemind.endTimes=normalizeRemindEndTimes(SCHEME.autoRemind);
      if(typeof SCHEME.autoRemind.dayOn!=='boolean') SCHEME.autoRemind.dayOn=SCHEME.autoRemind.times.length>0;
      if(typeof SCHEME.autoRemind.endOn!=='boolean') SCHEME.autoRemind.endOn=SCHEME.autoRemind.endTimes.length>0;
      delete SCHEME.autoRemind.time;
      return;
    }
    var saved=JSON.parse(raw);
    if(!saved||typeof saved!=='object') return;
    var times=normalizeRemindDayTimes(saved);
    var ends=normalizeRemindEndTimes(saved);
    SCHEME.autoRemind={
      enabled:!!saved.enabled,
      tz:normRemindTz(saved.tz),
      dayOn:typeof saved.dayOn==='boolean'?saved.dayOn:times.length>0,
      times:times,
      endOn:typeof saved.endOn==='boolean'?saved.endOn:ends.length>0,
      endTimes:ends
    };
  }catch(e){}
}
function formatAutoRemind(ar){
  if(!ar||!ar.enabled) return {active:false,text:'未开启'};
  var days=ar.dayOn?normalizeRemindClocks(ar.times):[];
  var ends=ar.endOn?normalizeRemindClocks(ar.endTimes):[];
  if(!days.length&&!ends.length) return {active:false,text:'未开启'};
  var parts=[];
  if(days.length) parts.push('每天 '+days.map(escHtml).join('、'));
  if(ends.length) parts.push('结束当天 '+ends.map(escHtml).join('、'));
  return {active:true,text:escHtml(normRemindTz(ar.tz))+' · '+parts.join('；')};
}
function cycleTimePad(n){return String(n).padStart(2,'0');}
function getDemoCycleRange(){
  var ct=SCHEME.cycleType||'月度';
  var now=new Date();
  var y=now.getFullYear(), m=now.getMonth();
  if(ct==='月度') return {start:new Date(y,m,1), end:new Date(y,m+1,0)};
  if(ct==='季度'){
    var q=Math.floor(m/3)*3;
    return {start:new Date(y,q,1), end:new Date(y,q+3,0)};
  }
  if(ct==='半年度'){
    var h=m<6?0:6;
    return {start:new Date(y,h,1), end:new Date(y,h+6,0)};
  }
  return {start:new Date(y,0,1), end:new Date(y,11,31)};
}
function isCycleTime(v){
  return !!(v&&typeof v==='object'&&!Array.isArray(v)&&(v.rule||v.anchor||v.dir||v.time||typeof v.n==='number'));
}
function normalizeCycleTime(v){
  var t=isCycleTime(v)?{rule:v.rule,anchor:v.anchor,dir:v.dir,n:v.n,time:v.time}:{rule:'offset',anchor:'cycleStart',dir:'after',n:1,time:'09:00'};
  t.rule=t.rule==='fixedDay'?'fixedDay':'offset';
  t.anchor=t.anchor==='cycleEnd'?'cycleEnd':'cycleStart';
  t.dir=(t.dir==='after'||t.dir==='后')?'after':'before';
  var n=parseInt(t.n,10);
  if(!n||n<1) n=1;
  if(t.rule==='fixedDay'&&n>28) n=28;
  t.n=n;
  t.time=String(t.time||'09:00').slice(0,5);
  return t;
}
function resolveCycleTime(t){
  t=normalizeCycleTime(t);
  var range=getDemoCycleRange();
  var parts=(t.time||'09:00').split(':');
  var hh=parseInt(parts[0],10)||0, mm=parseInt(parts[1],10)||0;
  var d;
  if(t.rule==='fixedDay'){
    if(t.dir==='before') d=new Date(range.start.getFullYear(), range.start.getMonth()-1, t.n, hh, mm, 0);
    else d=new Date(range.end.getFullYear(), range.end.getMonth()+1, t.n, hh, mm, 0);
  }else{
    var base=t.anchor==='cycleEnd'?range.end:range.start;
    var sign=t.dir==='after'?1:-1;
    d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+sign*t.n, hh, mm, 0);
  }
  return d;
}
function formatCycleTimeRule(t){
  t=normalizeCycleTime(t);
  if(t.rule==='fixedDay') return '固定日期 · 周期'+(t.dir==='before'?'前':'后')+'的 '+t.n+' 号 '+t.time;
  return '相对天数 · '+(t.anchor==='cycleEnd'?'周期结束':'周期开始')+(t.dir==='before'?'前':'后')+' '+t.n+' 天 '+t.time;
}
function formatCycleTimeNext(t){
  var d=resolveCycleTime(t);
  return '最近 '+d.getFullYear()+'/'+cycleTimePad(d.getMonth()+1)+'/'+cycleTimePad(d.getDate())+' '+cycleTimePad(d.getHours())+':'+cycleTimePad(d.getMinutes());
}
function formatCycleTimeLine(t){
  if(!t) return '—';
  return formatCycleTimeRule(t)+'　'+formatCycleTimeNext(t);
}
function formatAutoCreateRule(s){
  var ac=s.autoCreate||{};
  var period=s.cycleType==='季度'?'下季考核活动':s.cycleType==='半年度'?'下半年度考核活动':s.cycleType==='年度'?'下年度考核活动':'下月考核活动';
  if(ac.rule==='fixedDay') return '固定日期 · 周期开始前的 '+(ac.fixedDay||28)+' 号，自动创建'+period;
  var cfg=s.cycleType==='季度'?ac.quarterly:s.cycleType==='半年度'?ac.semiannual:s.cycleType==='年度'?ac.annual:ac.monthly;
  var dir=(cfg&&cfg.direction)||'前';
  var days=(cfg&&cfg.days)||7;
  return '相对天数 · 周期开始'+dir+' '+days+' 天，自动创建'+period;
}
function isSchemeAutoCreateOn(){
  return !!(SCHEME.autoCreate&&SCHEME.autoCreate.enabled);
}
function migrateLegacyAutoCreate(s){
  if(!s.autoCreate) s.autoCreate={enabled:false};
  if(s.autoCreate.model==='scheme') return;
  var configs=[];
  (s.stages||[]).forEach(function(stage){
    if(!stage||stage.enabled===false) return;
    if(stage.configMode==='byGroup'){
      Object.keys(stage.groupConfigs||{}).forEach(function(id){
        var cfg=stage.groupConfigs[id];
        if(cfg) configs.push(cfg);
      });
    }else configs.push(stage);
  });
  s.autoCreate.enabled=configs.length>0&&configs.every(function(cfg){
    return cfg.autoStart&&cfg.autoStart.enabled&&cfg.autoEnd&&cfg.autoEnd.enabled;
  });
  s.autoCreate.model='scheme';
}
function stageAllowsNodeTime(stage){
  var id=stage&&stage.id;
  if(id==='assess') id='eval';
  return id==='goal'||id==='eval'||id==='interview';
}
function formatNodeTimes(st, cfg){
  cfg=cfg||st;
  var mark=isSchemeAutoCreateOn()?'自动':'手动';
  var line=function(label,t){
    return '<div class="time-read">'+escHtml(label)+' '+escHtml(formatCycleTimeLine(t))+'</div>';
  };
  var useNode=stageAllowsNodeTime(st)&&cfg.timeGrain!=='stage';
  if(!useNode){
    var w=cfg.stageWindow||{};
    if(!w.start&&cfg.nodes&&cfg.nodes.length){
      w={start:cfg.nodes[0].start, end:cfg.nodes[cfg.nodes.length-1].end};
    }
    return '<div style="margin-top:8px"><div style="font:400 12px/1.4 var(--f);color:var(--c5);margin-bottom:4px">按环节 · '+mark+'</div>'+line('开始',w.start)+line('结束',w.end)+'</div>';
  }
  var nodes=cfg.nodes||[];
  if(!nodes.length) return '';
  return '<div style="margin-top:8px">'+
    '<div style="font:400 12px/1.4 var(--f);color:var(--c5);margin-bottom:4px">按节点 · '+mark+'</div>'+
    nodes.map(function(n){
    return '<div style="margin-top:6px"><div style="font:500 12px/1.3 var(--f);color:var(--c8);margin-bottom:2px">'+escHtml(n.name)+'</div>'+line('开始',n.start)+line('结束',n.end)+'</div>';
  }).join('')+'</div>';
}

function formatEvalScoreCalculation(c){
  if(!c||!c.enabled) return '关闭';
  if(c.mode==='totalScore') return '仅计算考核总分';
  if(c.mode==='totalScoreAndGrade') return '计算总分与初评等级';
  return '已开启，未选择计算范围';
}
function getDetailStageConfig(st){
  if(st.configMode!=='byGroup') return st;
  var groups=SCHEME.groups||[];
  if(!groups.some(function(g){return g.id===st.activeGroupId;})) st.activeGroupId=groups[0]?groups[0].id:'';
  return st.groupConfigs&&st.groupConfigs[st.activeGroupId]||st;
}
function selectDetailStageGroup(stageId,groupId){
  var st=SCHEME.stages.find(function(item){return item.id===stageId;});
  if(!st||(SCHEME.groups||[]).every(function(group){return group.id!==groupId;})) return;
  st.activeGroupId=groupId;
  render();
}
function formatForceEnd(forceEnd){
  var fe=forceEnd||{mode:'next'};
  if(fe.mode==='skip') return '结束流程，跳过后续所有环节';
  if(fe.mode==='grade') return '跳过后续环节，默认结果等级 '+(fe.grade||fe.perfGrade||'—');
  if(fe.mode==='adjust') return '跳过后续环节，采用当前调整等级';
  return '结束流程，进入下一环节';
}
function renderDetailGroupTabs(st){
  if(st.configMode!=='byGroup') return '';
  return '<div class="detail-group-tabs" role="tablist" aria-label="'+escHtml(st.name)+'考核组">'+
    (SCHEME.groups||[]).map(function(group){
      return '<button type="button" class="detail-group-tab '+(st.activeGroupId===group.id?'on':'')+'" onclick="selectDetailStageGroup(\''+st.id+'\',\''+group.id+'\')">'+escHtml(group.name)+(Number.isFinite(group.peopleCount)?'<small>'+group.peopleCount+'人</small>':'')+'</button>';
    }).join('')+'</div>';
}
function renderStageSummary(st){
  var cfg=getDetailStageConfig(st);
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'+
    '<div><span style="font:500 13px/1 var(--f);color:var(--c9)">'+escHtml(st.name)+'</span><span style="font:400 12px/1 var(--f);color:var(--c5);margin-left:8px">'+escHtml(st.desc)+'</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end"><span class="detail-mode '+(st.configMode==='byGroup'?'by-group':'')+'">'+(st.configMode==='byGroup'?'按考核组配置':'统一配置')+'</span><span style="font:400 11px/1 var(--f);color:var(--c5);font-family:var(--m)">'+escHtml(cfg.flow||'未绑定流程')+'</span><span style="font:500 11px/1 var(--f);padding:2px 8px;border-radius:3px;background:'+(st.enabled?'var(--em50)':'var(--c1)')+';color:'+(st.enabled?'var(--em700)':'var(--c5)')+'">'+(st.enabled?'已启用':'已关闭')+'</span></div>'+
  '</div>'+renderDetailGroupTabs(st)+
  '<div style="margin-top:8px;font:400 12px/1.7 var(--f);color:var(--c7)">流程：'+escHtml(cfg.flow||'—')+'</div>'+
  formatNodeTimes(st,cfg)+
  (st.name==='绩效考核'?'<div style="margin-top:4px;font:400 12px/1.7 var(--f);color:var(--c7)">系统计算：'+formatEvalScoreCalculation(cfg.scoreCalculation)+'</div>':'')+
  (st.name==='结果审定'?'<div style="margin-top:4px;font:400 12px/1.7 var(--f);color:var(--c7)">提交方式：'+escHtml(cfg.ratifySubmitMode||SCHEME.ratifySubmitMode||'—')+'</div>':'')+
  (st.name==='结果确认'?'':'<div style="margin-top:4px;font:400 12px/1.7 var(--f);color:var(--c7)">强制结束：'+escHtml(formatForceEnd(cfg.forceEnd))+'</div>');
}

function render(){
  migrateLegacyAutoCreate(SCHEME);
  syncSchemeRemind();
  const s=SCHEME;
  const ct=document.getElementById('ct')||document.getElementById('app');
  if(!ct) return;
  ct.innerHTML=`<div style="width:100%" class="fi">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font:400 13px/1 var(--f);color:var(--c6)">
      <a href="perf-scheme-list.html" style="color:var(--pr);text-decoration:none;cursor:pointer">← 返回方案列表</a>
      <span style="color:var(--c4)">/</span><span>${s.name}</span>
    </div>

    <!-- 基本信息 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--pr)"></span><span class="card-title">基本信息</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <div><lbl>方案名称</lbl><val>${s.name}</val></div>
        <div><lbl>方案版本</lbl><val>${s.version}</val></div>
        <div><lbl>周期类型</lbl><val>${s.cycleType}</val></div>
        <div><lbl>等级规则</lbl><val>${s.gradeRule}</val></div>
        <div><lbl>向下公开</lbl><val>${s.downward?'开启':'关闭'}</val></div>
        <div><lbl>强制分布</lbl><val>${s.forcedDist.name}</val></div>
        <div><lbl>活动管理员</lbl><val>${(s.admins||[]).map(function(id){var a=ADMIN_LIST.find(function(x){return x.id===id;});return a?a.name:id;}).join('、')||'—'}</val></div>
        <div style="grid-column:1/-1"><lbl>方案描述</lbl><val>${s.desc}</val></div>
        ${s.autoCreate?`
        <div><lbl>自动创建活动与环节</lbl><val style="color:var(--em)">${s.autoCreate.enabled?'已开启':'已关闭'}</val></div>
        ${s.autoCreate.enabled?`<div style="grid-column:span 2"><lbl>创建规则</lbl><val>${formatAutoCreateRule(s)}</val></div>`:''}
        `:''}
        ${s.autoRemind?`
        <div style="grid-column:span 2;min-width:0"><lbl>自动催办</lbl><val style="overflow-wrap:anywhere">${formatAutoRemind(s.autoRemind).text}</val></div>
        `:''}
      </div>
    </div>

    <!-- 绩效等级 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--ro)"></span><span class="card-title">绩效等级 · ${s.gradeRule}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${s.grades.map(g=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r1);font:500 13px/1 var(--f);background:${g.bg};color:${g.color}">${g.name}</span>`).join('')}
      </div>
    </div>

    <!-- 考核组 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--vi)"></span><span class="card-title">考核组</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${s.groups.map(g=>`<div style="padding:12px 16px;border:1px solid var(--dv);border-radius:var(--r1)">
          <div style="display:flex;align-items:center;gap:8px"><span style="font:600 13px/1 var(--f);color:var(--c9)">${g.name}</span>${g.isDefault?'<span style="font:500 10px/1 var(--f);padding:1px 6px;border-radius:3px;background:var(--pr50);color:var(--pr)">默认</span>':''}</div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--dv)">
            <div style="font:600 12px/1 var(--f);color:var(--c6);margin-bottom:6px">添加人员规则</div>
            <div>${formatScopeRules(g.rules)}</div>
            <div style="font:400 12px/1 var(--f);color:var(--c5);margin-top:2px">评价规则：${g.evalRule}</div>
          </div>
          ${renderAutoRemoveSummary(g.autoRemove)}
        </div>`).join('')}
      </div>
    </div>

    <!-- 考核环节 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--ac)"></span><span class="card-title">考核环节</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${s.stages.map(st=>`<div style="padding:10px 14px;border:1px solid var(--dv);border-radius:var(--r1)">${renderStageSummary(st)}</div>`).join('')}
      </div>
    </div>

    <!-- 强制分布 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--em)"></span><span class="card-title">强制分布 · ${s.forcedDist.name}</span></div>
      <div style="margin-bottom:12px"><lbl>提交方式</lbl><val>${s.ratifySubmitMode||'—'}</val></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${s.forcedDist.grades.map(d=>`<span style="font:500 13px/1 var(--f);color:var(--c7)"><strong>${d.code}</strong> ${d.name} <span style="color:var(--c5)">${d.op} ${d.pct}%</span></span>`).join('<span style="color:var(--c3)">|</span>')}
      </div>
    </div>

    <!-- 关联活动 -->
    <div class="card">
      <div class="card-hd"><span class="card-bar" style="background:var(--pr)"></span><span class="card-title">关联活动</span></div>
      <div id="relatedActs"></div>
    </div>
  </div>`;
}

// ═══ RELATED ACTIVITIES ═══
var SCHEME_ACTS=[
  {id:1,name:'2026年Q2绩效考核',cycle:'2026年Q2',creationSource:'auto',status:'active',currentStage:'绩效考核',empCount:128,type:'current'},
  {id:2,name:'2026年Q3绩效考核',cycle:'2026年Q3',creationSource:'auto',status:'not_started',currentStage:'',empCount:0,type:'future_created'},
  {id:3,name:'2026年Q1绩效考核',cycle:'2026年Q1',creationSource:'auto',status:'ended_normal',currentStage:'结果确认',empCount:96,type:'history'}
];
var FUTURE_WAITING=[{cycle:'2026年Q4',label:'2026年Q4绩效考核'}];
var relatedTab='current';
var STAT_MAP_S={not_started:{label:'未进入执行',cls:'not_started'},active:{label:'执行中',cls:'active'},paused:{label:'已暂停',cls:'paused'},ended_normal:{label:'已正常结束',cls:'ended_normal'},ended_early:{label:'已提前终止',cls:'ended_early'}};

function renderRelatedActs(){
  var h='<div style="display:flex;gap:0;border-bottom:1px solid var(--dv);padding:0 18px">';
  h+=tab('current','当前活动（'+SCHEME_ACTS.filter(function(a){return a.status==='active'||a.status==='paused';}).length+'）');
  h+=tab('history','历史活动（'+SCHEME_ACTS.filter(function(a){return a.status==='ended_normal'||a.status==='ended_early';}).length+'）');
  h+=tab('future','未来活动（'+(SCHEME_ACTS.filter(function(a){return a.status==='not_started';}).length+FUTURE_WAITING.length)+'）');
  h+='</div><div style="padding:12px 18px">';
  var items=[];
  if(relatedTab==='current')SCHEME_ACTS.filter(function(a){return a.status==='active'||a.status==='paused';}).forEach(function(a){items.push({type:'created',data:a});});
  else if(relatedTab==='history')SCHEME_ACTS.filter(function(a){return a.status==='ended_normal'||a.status==='ended_early';}).forEach(function(a){items.push({type:'created',data:a});});
  else{SCHEME_ACTS.filter(function(a){return a.status==='not_started';}).forEach(function(a){items.push({type:'created',data:a});});FUTURE_WAITING.forEach(function(f){items.push({type:'waiting',data:f});});}
  if(items.length===0){h+='<div style="color:var(--c4);padding:20px;text-align:center">暂无活动</div>';}
  else{
    h+='<table style="width:100%;border-collapse:collapse"><thead><tr><th>活动名称</th><th>周期</th><th>创建来源</th><th>状态</th><th>当前环节</th><th>人数</th><th>操作</th></tr></thead><tbody>';
    items.forEach(function(item){
      if(item.type==='waiting'){h+='<tr><td style="color:var(--c4)">'+item.data.label+'</td><td>'+item.data.cycle+'</td><td colspan="4" style="color:var(--c4)">待自动创建</td><td>—</td></tr>';}
      else{var a=item.data,st=STAT_MAP_S[a.status];h+='<tr><td><a href="perf-activity-detail.html?id='+a.id+'" style="font:500 13px/1.3 var(--f);color:var(--pr);text-decoration:none">'+a.name+'</a></td><td>'+a.cycle+'</td><td><span style="font:400 12px/1 var(--f);color:'+(a.creationSource==='auto'?'var(--em700)':'var(--ac700)')+'">'+(a.creationSource==='auto'?'自动创建':'手动补充')+'</span></td><td><span class="status '+st.cls+'" style="font-size:11px"><span class="status-dot"></span>'+st.label+'</span></td><td>'+(a.currentStage||'—')+'</td><td>'+a.empCount+'</td><td><a href="perf-activity-detail.html?id='+a.id+'" class="btn btn-s" style="text-decoration:none;height:26px;font-size:11px;padding:0 10px">查看</a></td></tr>';}
    });h+='</tbody></table>';
  }h+='</div>';document.getElementById('relatedActs').innerHTML=h;
}

function tab(t,l){return '<button style="padding:10px 16px;border:none;background:none;font:500 13px/1 var(--f);color:'+(relatedTab===t?'var(--pr)':'var(--c5)')+';border-bottom:'+(relatedTab===t?'2px solid var(--pr)':'2px solid transparent')+';cursor:pointer" onclick="relatedTab=\''+t+'\';renderRelatedActs()">'+l+'</button>';}

GHR_NAV.init('perf','绩效方案');
render();
renderRelatedActs();
</script>
</body>
</html>
