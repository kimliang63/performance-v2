<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 考核进度</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --vi:#8B5CF6;--vi50:#F5F3FF;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#FAFAF9;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-modal:0 25px 60px -12px rgba(0,0,0,.2);
  --r1:6px;--r2:8px;--r3:10px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}

.fl-bar{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl-bar .fl-search{margin-bottom:0;min-width:220px}
.fl-sel{height:32px;padding:0 28px 0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c7);background:var(--sf) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;appearance:none;cursor:pointer;transition:all .12s;outline:none;-webkit-appearance:none;-moz-appearance:none}
.fl-sel:focus{border-color:var(--pr)}
.fl-actions{display:flex;gap:6px;margin-left:auto}
.fl-hint{font:400 12px/1 var(--f);color:var(--c5)}
.fl-hint b{font-weight:600;color:var(--c9)}

.org-pick{position:relative;min-width:180px;z-index:20}
.org-trig{height:32px;width:100%;padding:0 28px 0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c7);background:var(--sf);display:flex;align-items:center;cursor:pointer;outline:none;text-align:left;position:relative}
.org-trig:hover{border-color:var(--c3)}
.org-trig.is-open,.org-trig:focus{border-color:var(--pr)}
.org-trig-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org-trig .org-caret{position:absolute;right:10px;color:var(--c4);pointer-events:none}
.org-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:280px;max-height:360px;overflow:auto;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);box-shadow:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);padding:6px}
.fl-filter{position:relative;z-index:20}
.fl-filter .btn.is-open{border-color:var(--pr);color:var(--pr);background:var(--pr50)}
.fl-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;margin-left:2px;border-radius:8px;background:var(--pr);color:#FFF;font:600 10px/1 var(--m)}
.fl-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;width:320px;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);box-shadow:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);padding:12px}
.fl-pop-lab{font:500 12px/1.4 var(--f);color:var(--c6);margin-bottom:6px}
.fl-pop .fl-search{width:100%;min-width:0;margin-bottom:0}
.fl-pop-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--dv)}
.ex-wrap{position:relative;z-index:20}
.ex-wrap .btn.is-open{border-color:var(--pr);color:var(--pr);background:var(--pr50)}
.ex-wrap .btn svg:last-of-type{width:10px;height:10px;flex-shrink:0}
.ex-wrap .btn.is-open svg:last-of-type{transform:rotate(180deg)}
.ex-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:30;min-width:160px;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);box-shadow:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);padding:4px}
.ex-item{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 12px;border-radius:var(--r1);font:400 13px/1.3 var(--f);color:var(--c7);cursor:pointer}
.ex-item:hover{background:var(--pr50);color:var(--pr)}
.org-item{display:flex;align-items:center;gap:2px;min-height:30px;padding-right:8px;border-radius:var(--r1);font:400 13px/1.3 var(--f);color:var(--c7)}
.org-item:hover{background:var(--c0)}
.org-item.is-on{background:var(--pr50);color:var(--pr);font-weight:600}
.org-item-name{flex:1;cursor:pointer;padding:4px 6px;border-radius:var(--r1)}
.org-chev,.dept-chev{width:18px;height:18px;border:none;background:transparent;color:var(--c5);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:var(--r1);padding:0}
.org-chev svg,.dept-chev svg{width:10px;height:10px;transform:rotate(-90deg);transition:transform .12s}
.org-chev.is-open svg,.dept-chev.is-open svg{transform:rotate(0deg)}
.org-chev:hover,.dept-chev:hover{background:var(--c1);color:var(--c7)}
.org-chev-ph,.dept-chev-ph{width:18px;height:18px;flex-shrink:0}
.dept-cell{display:flex;align-items:center;gap:4px}
.dept-name.is-toggle{cursor:pointer}
.dept-name.is-toggle:hover{color:var(--pr)}
.dept-sub .dept-name{font-weight:500;color:var(--c8)}

.tbl-card{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);overflow:hidden}
.view-tabs{display:flex;align-items:center;gap:0;padding:0 16px;background:var(--c0);border-bottom:1px solid var(--dv)}
.view-tab{height:40px;padding:0 16px;border:none;background:transparent;font:500 13px/1 var(--f);color:var(--c5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.view-tab:hover{color:var(--c8)}
.view-tab.is-on{color:var(--pr);font-weight:600;border-bottom-color:var(--pr)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 240px)}
table{width:100%;border-collapse:separate;border-spacing:0}
.rate-cell{display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0;min-height:22px;padding:0;margin:0;pointer-events:none}
.rate-bar{flex:1;height:4px;min-width:24px;background:var(--c1);border-radius:2px;overflow:hidden}
.rate-fill{height:100%;border-radius:2px;background:var(--em);transition:width .6s ease}
.rate{font-family:var(--m);font-size:12px;font-weight:600;color:var(--c8);white-space:nowrap;width:34px;flex-shrink:0;text-align:right}
.rate-zero{color:var(--c4);font-weight:500}
.rate-ac{color:var(--ac700)}
.rate-pr{color:var(--pr)}
thead th{font:600 12px/1.2 var(--f);color:var(--c5);text-align:left;padding:8px 8px;border-bottom:1px solid var(--c2);border-right:1px solid var(--dv);white-space:nowrap;background:var(--c0);letter-spacing:.2px}
thead .g-th{font:600 12px/1 var(--f);color:var(--c8);padding:9px 8px;border-bottom:1px solid var(--c2);cursor:pointer;user-select:none;background:var(--c0)}
thead .g-th:hover{background:var(--c1)}
.g-th-in{display:inline-flex;align-items:center;justify-content:flex-start;gap:4px}
.g-th svg{width:10px;height:10px;flex-shrink:0;opacity:.75}
.g-th.is-off svg{transform:rotate(-90deg)}
.g-th-n{font:600 12px/1 var(--m);color:var(--c4);width:12px;flex-shrink:0}
.g-chk{display:inline-flex;align-items:center;flex-shrink:0;cursor:pointer;line-height:0}
.g-chk input{width:13px;height:13px;margin:0;accent-color:var(--pr);cursor:pointer}
thead .g-part,tbody .g-part{width:1%;min-width:56px;max-width:68px;padding:6px 4px;text-align:center;white-space:nowrap}
.g-part .num-link{justify-content:center;padding:2px 0;width:100%}
thead .dept-h,tbody .dept-c{position:sticky;left:0;z-index:3;text-align:left;width:1%;min-width:176px;padding:8px 16px;border-right:1px solid var(--c2);background:var(--sf)}
thead .dept-h{z-index:4;background:var(--c0);text-align:left;font:600 12px/1 var(--f);color:var(--c5);letter-spacing:.2px}
thead .count-g-th{width:124px;min-width:124px;max-width:124px;font:600 12px/1 var(--f);color:var(--c8);padding:9px 6px;background:var(--c0);cursor:default}
thead .part-h,tbody .part-c{width:1%;min-width:68px;max-width:68px;padding:6px 4px;text-align:center;border-right:1px solid var(--c2);white-space:nowrap}
thead .part-h{font:600 12px/1.2 var(--f);color:var(--c5);letter-spacing:.2px}
thead .skip-h,tbody .skip-c{width:1%;min-width:56px;max-width:56px;padding:6px 4px;text-align:center;border-right:2px solid var(--c3);white-space:nowrap}
thead .skip-h{font:600 12px/1.2 var(--f);color:var(--c5);letter-spacing:.2px}
.part-c .num-link,.skip-c .num-link{justify-content:center;padding:2px 0;width:100%}
tbody td{font:400 13px/1.3 var(--f);color:var(--c7);padding:8px 8px;border-bottom:1px solid var(--dv);border-right:1px solid var(--dv);text-align:left;vertical-align:middle}
tbody tr:hover td{background:var(--c0)}
tbody tr:hover .dept-c,tbody tr:hover .part-c,tbody tr:hover .skip-c{background:var(--c0)}
tbody tr:last-child td{border-bottom:none}
.dept-name{font:600 13px/1.3 var(--f);color:var(--c9);white-space:nowrap}
.dept-n{font-weight:400;color:var(--c5)}
.num{font-family:var(--m);font-size:13px;font-weight:500;color:var(--c4);display:inline-flex;align-items:center;justify-content:flex-start;line-height:1.2;vertical-align:middle}
.num-link{color:var(--c8);cursor:pointer;background:none;border:none;padding:2px 4px 2px 0;border-radius:var(--r1);font:500 13px/1.2 var(--m);display:inline-flex;align-items:center;justify-content:flex-start;vertical-align:middle;transition:all .12s}
.num-link:hover{background:var(--c1);text-decoration:underline}
.num-link.on{background:var(--c8);color:#FFF}
.num-em,.num-link.num-em{color:var(--em700)}
.num-ro,.num-link.num-ro{color:var(--ro)}
.num-ac,.num-link.num-ac{color:var(--ac700)}
.num-idle,.num-link.num-idle{color:var(--c4)}
.num-ink,.num-link.num-ink{color:var(--c8)}
.num-link.on,.num-link.on.num-em,.num-link.on.num-ro,.num-link.on.num-ac,.num-link.on.num-idle,.num-link.on.num-ink{background:var(--c8);color:#FFF}
.g-split{border-right:2px solid var(--c3)!important}
.total-row td{background:var(--c0);font-weight:600}
.total-row .dept-c,.total-row .part-c,.total-row .skip-c{background:var(--c0)}
.total-row:hover td,.total-row:hover .dept-c,.total-row:hover .part-c,.total-row:hover .skip-c{background:var(--c0)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-modal);width:min(1120px,calc(100vw - 48px));max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--dv);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-hd-title{font:600 15px/1.3 var(--f);color:var(--c9)}
.modal-close{width:28px;height:28px;border-radius:var(--r1);border:none;background:transparent;color:var(--c5);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:var(--c1);color:var(--c7)}
.modal-bd{flex:1;min-height:0;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column}
.modal-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:12px}
.modal-tools .fl-search{flex:1;min-width:0;margin-bottom:0}
.modal-tbl-wrap{flex:1;min-height:0;overflow:auto}
.modal-ft{padding:12px 20px;border-top:1px solid var(--dv);display:flex;align-items:center;justify-content:flex-start}
.col-set-modal{width:min(520px,calc(100vw - 48px));max-height:80vh}
.col-set-modal .modal-bd{overflow:auto;padding:0}
.col-set-sec{padding:12px 16px}
.col-set-sec+.col-set-sec{border-top:1px solid var(--dv)}
.col-set-h{font:600 12px/1.3 var(--f);color:var(--c9);margin:0 0 8px}
.col-set-row{display:flex;flex-wrap:wrap;gap:0 4px}
.col-set-row .col-set-item{flex:0 0 auto;width:auto;padding-right:10px}
.col-set-stage{margin-top:12px}
.col-set-stage:first-child{margin-top:0}
.col-set-stage-name{font:600 12px/1.3 var(--f);color:var(--c7);margin:0 0 6px}
.col-set-proc{margin:8px 0 0}
.col-set-proc:last-child{margin-bottom:0}
.col-set-proc-name{font:500 12px/1.3 var(--f);color:var(--c6);margin:0 0 6px}
.col-set-node-block{margin:6px 0 0;padding:8px 10px;background:var(--c0);border-radius:var(--r1)}
.col-set-node-h{font:500 11px/1.3 var(--f);color:var(--c5);margin:0 0 6px}
.col-set-item{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:var(--r1);font:400 13px/1.3 var(--f);color:var(--c7);cursor:pointer}
.col-set-item.sub{min-height:28px;font-size:12px;color:var(--c6)}
.col-set-item:hover{background:var(--c0)}
.col-set-item input{width:13px;height:13px;margin:0;accent-color:var(--pr);cursor:pointer;flex-shrink:0}
.node-pick{position:relative;z-index:1}
.node-pick.is-open{z-index:40}
.node-trig{height:32px;width:100%;padding:0 28px 0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c7);background:var(--sf);display:flex;align-items:center;cursor:pointer;outline:none;text-align:left;position:relative}
.node-trig:hover{border-color:var(--c3)}
.node-trig.is-open,.node-trig:focus{border-color:var(--pr)}
.node-trig-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-trig.is-empty .node-trig-txt{color:var(--c4)}
.node-trig .org-caret{position:absolute;right:10px;color:var(--c4);pointer-events:none}
.node-pick-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;max-height:220px;overflow:auto;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);box-shadow:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);padding:4px}
.node-pick-panel .col-set-item:hover{background:var(--c0)}
.flow-tbl{width:100%;border-collapse:collapse;min-width:1080px}
.flow-tbl th{padding:8px 12px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);background:var(--c0);white-space:nowrap;position:sticky;top:0;z-index:1}
.flow-tbl td{padding:9px 12px;font:400 12px/1.4 var(--f);color:var(--c7);border-bottom:1px solid var(--dv)}
.flow-tbl tr:last-child td{border-bottom:none}
.fl-search{display:flex;align-items:center;gap:6px;background:var(--c0);border:1px solid var(--c2);border-radius:var(--r1);padding:0 10px;height:32px;min-width:200px;margin-bottom:12px;transition:all .15s}
.fl-search:focus-within{background:var(--sf);border-color:var(--pr)}
.fl-search svg{color:var(--c4);flex-shrink:0;width:13px;height:13px}
.fl-search input{border:none;background:transparent;outline:none;font:13px/1 var(--f);width:100%;color:var(--c9)}
.fl-search input::placeholder{color:var(--c4)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font:500 11px/1 var(--f);white-space:nowrap}
.tag-pr{background:var(--pr50);color:var(--pr)}
.tag-em{background:var(--em50);color:var(--em700)}
.tag-ac{background:var(--ac50);color:var(--ac700)}
.tag-ro{background:var(--ro50);color:var(--ro)}
.empty{text-align:center;padding:36px 12px;color:var(--c4);font:400 13px/1.4 var(--f)}
.mono{font-family:var(--m);font-size:12px}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .2s ease forwards}
</style>
</head>

var ORG_INDEX={};
(function indexOrg(node, parent){
  node.parent=parent||null;
  node.hasChildren=!!(node.children&&node.children.length);
  ORG_INDEX[node.id]=node;
  (node.children||[]).forEach(function(ch){ indexOrg(ch, node); });
})(ORG_TREE, null);

function person(p){
  p.skip=!!(p.skip||p.goal==='未参与考核'||p.eval==='未参与考核');
  if(p.skip){
    p.goal='未参与考核';
    p.talk='未参与考核';
    p.eval='未参与考核';
    p.ratify='未参与考核';
    p.confirm='未参与考核';
    if(!p.node) p.node='未参与考核';
  }
  p.activity=p.period+'-'+p.dept+'考核';
  var leaf=ORG_INDEX[p.orgId];
  p.orgName=leaf?leaf.name:p.dept;
  if(!p.evalGroup) p.evalGroup=EVAL_GROUP_BY_ORG[p.orgId]||p.orgName||p.dept;
  if(!p.talk){
    if(p.goal!=='已完成'&&p.goal!=='已通过') p.talk='未开始';
    else if(p.eval!=='未开始') p.talk='已完成';
    else p.talk='进行中';
  }
  var n=parseInt(String(p.empId).replace(/\D/g,''),10)||1;
  var meta=DEPT_META[p.dept]||{area:'中国区',jobs:['专员'],ranks:['P4']};
  if(!p.empStatus) p.empStatus=n%11===0?'试用':(n%13===0?'待离职':'在职');
  if(!p.workType) p.workType=n%8===0?'劳务派遣':(n%9===0?'实习':'劳动合同');
  if(!p.area) p.area=meta.area;
  if(!p.job) p.job=meta.jobs[n%meta.jobs.length];
  if(!p.rank) p.rank=meta.ranks[n%meta.ranks.length];
  if(!p.hireDate){
    var y=2016+(n%8);
    var mo=('0'+((n%12)+1)).slice(-2);
    var d=('0'+((n%27)+1)).slice(-2);
    p.hireDate=y+'-'+mo+'-'+d;
  }
  if(!p.handler){
    if(p.skip) p.handler='陈HRBP';
    else if(p.eval==='自评中'||p.node==='自评中') p.handler=p.name;
    else if(p.confirm==='申诉'||p.node==='申诉') p.handler='陈HRBP';
    else p.handler='王总监';
  }
  return p;
}

function getCycles(){
  var set={};
  for(var i=0;i<PEOPLE.length;i++) set[PEOPLE[i].period]=1;
  return Object.keys(set).sort().reverse();
}
function getAreas(){
  var set={};
  for(var i=0;i<PEOPLE.length;i++){
    var parts=parseAreaPath(PEOPLE[i].area);
    var path='';
    for(var j=0;j<parts.length;j++){
      path=path?path+' · '+parts[j]:parts[j];
      set[path]=1;
    }
  }
  return Object.keys(set).sort();
}
function parseAreaPath(area){
  return String(area||'').split(' · ').map(function(s){ return s.trim(); }).filter(Boolean);
}
function qid(id){
  return String(id).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function nodeTitle(id){
  if(id==='total') return '合计';
  if(ORG_INDEX[id]) return ORG_INDEX[id].name;
  if(String(id).indexOf('area:')===0){
    var parts=parseAreaPath(id.slice(5));
    return parts.length?parts[parts.length-1]:id;
  }
  if(String(id).indexOf('grp:')===0){
    var rest=id.slice(4);
    var i=rest.lastIndexOf('||');
    return i>=0?rest.slice(i+2):rest;
  }
  if(String(id).indexOf('act:')===0) return id.slice(4);
  return id;
}

function collectIds(node, out){
  out=out||[];
  if(!node) return out;
  out.push(node.id);
  (node.children||[]).forEach(function(ch){ collectIds(ch, out); });
  return out;
}

function inSubtree(orgId, personOrgId){
  if(!orgId||orgId==='all'||orgId==='total') return true;
  var node=ORG_INDEX[orgId];
  if(!node) return false;
  return collectIds(node).indexOf(personOrgId)!==-1;
}
function inNode(nodeId, p){
  if(!nodeId||nodeId==='all'||nodeId==='total') return true;
  if(String(nodeId).indexOf('area:')===0){
    var path=nodeId.slice(5);
    return p.area===path || (p.area&&p.area.indexOf(path+' · ')===0);
  }
  if(String(nodeId).indexOf('grp:')===0){
    var rest=nodeId.slice(4);
    var i=rest.lastIndexOf('||');
    var act=i>=0?rest.slice(0,i):'';
    var grp=i>=0?rest.slice(i+2):rest;
    return p.activity===act && p.evalGroup===grp;
  }
  if(String(nodeId).indexOf('act:')===0) return p.activity===nodeId.slice(4);
  return inSubtree(nodeId, p.orgId);
}

  return PEOPLE.filter(function(d){
    if(filter.cycle&&d.period!==filter.cycle) return false;
    if(filter.area&&d.area!==filter.area&&!(d.area&&d.area.indexOf(filter.area+' · ')===0)) return false;
    if(!inSubtree(orgId, d.orgId)) return false;
    if(act&&d.activity.indexOf(act)===-1) return false;
    return true;
  });
}

function emptyRow(org){
  return {id:org.id,name:org.name,kind:org.kind,total:0,skip:0,goal:{},talk:{},eval:{},ratify:{},confirm:{},children:[]};
}

function colKey(groupId, status){
  if(groupId==='goal' && status==='目标制定中') return '制定中';
  if(groupId==='goal' && status==='已通过') return '已完成';
  if(groupId==='ratify' && (status==='审定人评级'||status==='审批中')) return '进行中';
  return status;
}

function addCount(row,p){
  GROUPS.forEach(function(g){
    var key=colKey(g.id, p[g.id]);
    row[g.id][key]=(row[g.id][key]||0)+1;
  });
}

function mergeCounts(target, src){
  target.total+=src.total;
  target.skip+=(src.skip||0);
  GROUPS.forEach(function(g){
    Object.keys(src[g.id]).forEach(function(k){
      target[g.id][k]=(target[g.id][k]||0)+src[g.id][k];
    });
  });
}

function rollup(node, byLeaf){
  var row=emptyRow(node);
  (node.children||[]).forEach(function(ch){
    var child=rollup(ch, byLeaf);
    if(child.total>0){
      row.children.push(child);
      mergeCounts(row, child);
    }
  });
  (byLeaf[node.id]||[]).forEach(function(p){
    row.total+=1;
    if(p.skip) row.skip+=1;
    else addCount(row,p);
  });
  return row;
}

function tableRoots(selected){
  if(!selected) selected=ORG_TREE;
  if(selected.kind==='dept'||selected.kind==='team') return [selected];
  var out=[];
  function walk(n){
    if(n.kind==='dept'){ out.push(n); return; }
    (n.children||[]).forEach(walk);
  }
  walk(selected);
  return out;
}
function getDeptRows(people){
  var byLeaf={};
  people.forEach(function(p){
    if(!byLeaf[p.orgId]) byLeaf[p.orgId]=[];
    byLeaf[p.orgId].push(p);
  });
  var selected=ORG_INDEX[filter.orgId]||ORG_TREE;
  return tableRoots(selected).map(function(n){ return rollup(n, byLeaf); }).filter(function(r){ return r.total>0; });
}
function getAreaForest(people){
  var map={};
  var roots=[];
  people.forEach(function(p){
    var parts=parseAreaPath(p.area);
    var path='';
    var parent=null;
    parts.forEach(function(part){
      path=path?path+' · '+part:part;
      var id='area:'+path;
      if(!map[id]){
        var node={id:id,name:part,kind:'area',children:[]};
        map[id]=node;
        if(parent) parent.children.push(node);
        else roots.push(node);
      }
      parent=map[id];
    });
  });
  return {map:map, roots:roots};
}
function getAreaRows(people){
  var forest=getAreaForest(people);
  var byLeaf={};
  people.forEach(function(p){
    var id='area:'+p.area;
    if(!byLeaf[id]) byLeaf[id]=[];
    byLeaf[id].push(p);
  });
  var starts=forest.roots;
  if(filter.area&&forest.map['area:'+filter.area]) starts=[forest.map['area:'+filter.area]];
  return starts.map(function(n){ return rollup(n, byLeaf); }).filter(function(r){ return r.total>0; });
}
function getActivityRows(people){
  var acts={};
  people.forEach(function(p){
    var aid='act:'+p.activity;
    if(!acts[aid]) acts[aid]={id:aid,name:p.activity,kind:'activity',groups:{}};
    var gname=p.evalGroup||'';
    if(!gname){
      if(!acts[aid].ungrouped) acts[aid].ungrouped=[];
      acts[aid].ungrouped.push(p);
      return;
    }
    var gid='grp:'+p.activity+'||'+gname;
    if(!acts[aid].groups[gid]) acts[aid].groups[gid]=emptyRow({id:gid,name:gname,kind:'evalGroup'});
    var g=acts[aid].groups[gid];
    g.total+=1;
    if(p.skip) g.skip+=1;
    else addCount(g, p);
  });
  return Object.keys(acts).sort().map(function(aid){
    var a=acts[aid];
    var row=emptyRow({id:a.id,name:a.name,kind:'activity'});
    Object.keys(a.groups).sort().forEach(function(gid){
      var ch=a.groups[gid];
      row.children.push(ch);
      mergeCounts(row, ch);
    });
    (a.ungrouped||[]).forEach(function(p){
      row.total+=1;
      if(p.skip) row.skip+=1;
      else addCount(row, p);
    });
    return row;
  });
}
function getRows(){

  if(groupId==='skip') return {stage:'—',status:'未参与'};

    if(p.ratify&&p.ratify!=='未开始') return {stage:'结果审定',status:colKey('ratify',p.ratify)};
    if(p.eval&&p.eval!=='未开始') return {stage:'绩效考核',status:p.eval};
    if(p.talk&&p.talk!=='未开始') return {stage:'绩效面谈',status:p.talk};
    return {stage:'目标制定',status:colKey('goal',p.goal)};
  }
  var g=GROUPS.find(function(x){ return x.id===groupId; });
  if(col==='参与') return {stage:g?g.name:'',status:colKey(groupId, p[groupId])};
  return {stage:g?g.name:'',status:col};
}

function groupItems(g){
  var rates=g.rates||[];
  if(g.order){
    if(isOff(g)) return g.order.filter(function(it){ return it.type==='rate'; });
    return g.order;
  }
  var items=[];
  if(!isOff(g)){
    items.push({type:'part',key:'参与'});
    (g.cols||[]).forEach(function(c){ items.push({type:'col',key:c}); });
  }
  rates.forEach(function(c){ items.push({type:'rate',key:c}); });
  return items;
}
function groupSpan(g){
  return Math.max(groupItems(g).length,1);
}

function groupRates(row,g){
  var n=row.total-(row.skip||0);
  function pct(part){ return n?Math.round(part/n*100):null; }
  if(g.id==='goal'){
    var passed=(row.goal['已完成']||0)+(row.goal['已通过']||0);
    return {
      '目标提交率': pct((row.goal['审批中']||0)+passed),
      '完成率': pct(passed)
    };
  }
  if(g.id==='talk'){
    return { '完成率': pct(row.talk['已完成']||0) };
  }
  if(g.id==='eval'){
    var scored=row.eval['已完成']||0;
    return {
      '自评完成率': pct((row.eval['考核人评分']||0)+scored),
      '完成率': pct(scored)
    };
  }
  if(g.id==='ratify'){
    return { '完成率': pct(row.ratify['已完成']||0) };
  }
  if(g.id==='confirm'){
    return { '完成率': pct(row.confirm['已确认']||0) };
  }
  return {};
}

function pctTone(pct){
  if(pct===null||pct===0) return {fill:'var(--c4)', text:'rate-zero'};
  if(pct===100) return {fill:'var(--em)', text:'num-em'};
  if(pct<60) return {fill:'var(--ac)', text:'rate-ac'};
  return {fill:'var(--pr)', text:'rate-pr'};
}

function rateCell(pct){
  if(pct===null) return '<span class="rate rate-zero">—</span>';
  var w=Math.max(0,Math.min(100,pct));
  var t=pctTone(pct);
  return '<div class="rate-cell"><div class="rate-bar"><div class="rate-fill" style="width:'+w+'%;background:'+t.fill+'"></div></div><span class="rate '+t.text+'">'+pct+'%</span></div>';
}

function stagePartBtn(row,g){
  var n=row.total-(row.skip||0);
  var on=modalState&&modalState.orgId===row.id&&modalState.groupId===g.id&&modalState.col==='参与'?' on':'';
  return '<button class="num-link num-ink'+on+'" onclick="openCell(\''+qid(row.id)+'\',\''+g.id+'\',\'参与\')">'+n+'</button>';
}

function groupCells(row,g,i,isTotal){
  var html='';
  var items=groupItems(g);
  var vals=groupRates(row,g);
  items.forEach(function(it,j){
    var last=j===items.length-1&&g.id!==lastVisGroupId();
    var inner;
    if(it.type==='rate') inner=rateCell(vals[it.key]);
    else if(it.type==='part') inner=stagePartBtn(row,g);
    else inner=countBtn(row,g,it.key);
    var cls=(it.type==='part'?'g-part':'')+(last?' g-split':'');
    html+='<td'+(cls?' class="'+cls.trim()+'"':'')+'>'+inner+'</td>';
  });
  return html;
}

function renderOrgTreeNodes(node, depth){
  var kids=node.children||[];
  var hasKids=kids.length>0;
  var open=node.id==='all'||!!pickerExpanded[node.id];
  var html='<div class="org-item'+(filter.orgId===node.id?' is-on':'')+'" style="padding-left:'+(4+depth*16)+'px">';
  if(hasKids&&node.id!=='all'){
    html+='<button type="button" class="org-chev'+(open?' is-open':'')+'" onclick="togglePickerNode(\''+node.id+'\',event)" aria-label="'+(open?'收起':'展开')+'">'+I.chev+'</button>';
  }else{
    html+='<span class="org-chev-ph"></span>';
  }
  html+='<span class="org-item-name" onclick="selectOrg(\''+node.id+'\')">'+node.name+'</span></div>';
  if(hasKids&&open){
    kids.forEach(function(ch){ html+=renderOrgTreeNodes(ch, depth+1); });
  }
  return html;
}

function dimHeader(){
  return viewMode==='area'?'划分区域':viewMode==='activity'?'活动名称':'部门名称';
}
function renderViewTabs(){
  var tabs=[{id:'dept',name:'部门'},{id:'area',name:'划分区域'},{id:'activity',name:'活动'}];
  var html='<div class="view-tabs">';
  tabs.forEach(function(t){
    html+='<button type="button" class="view-tab'+(viewMode===t.id?' is-on':'')+'" onclick="setView(\''+t.id+'\')">'+t.name+'</button>';
  });
  return html+'</div>';
}
function extraFilterCount(){
  return (filter.activity||'').trim()?1:0;
}
function renderFilter(){
  var n=extraFilterCount();
  var act=String(filter.activity||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  var html='<div class="fl-filter" id="flFilter">'+
    '<button type="button" class="btn btn-s'+(filterOpen?' is-open':'')+'" onclick="toggleFilter(event)" aria-expanded="'+(filterOpen?'true':'false')+'">'+
      I.filter+' 筛选'+(n?'<span class="fl-badge">'+n+'</span>':'')+
    '</button>';
  if(filterOpen){
    html+='<div class="fl-pop" onclick="event.stopPropagation()">'+
      '<div class="fl-pop-lab">绩效活动</div>'+
      '<div class="fl-search">'+I.search+'<input id="actSearch" placeholder="搜索绩效活动…" value="'+act+'" oninput="onActivity(this.value)"></div>'+
      '<div class="fl-pop-ft"><button type="button" class="btn btn-s" onclick="resetPanelFilters()">重置</button><button type="button" class="btn btn-p" onclick="applyFilterPanel()">确定</button></div>'+
    '</div>';
  }
  return html+'</div>';
}
function renderExport(){
  var html='<div class="ex-wrap" id="exWrap">'+
    '<button type="button" class="btn btn-s'+(exportOpen?' is-open':'')+'" onclick="toggleExport(event)" aria-expanded="'+(exportOpen?'true':'false')+'">'+
      I.download+' 导出 '+I.chev+
    '</button>';
  if(exportOpen){
    html+='<div class="ex-menu" onclick="event.stopPropagation()">'+
      '<button type="button" class="ex-item" onclick="exportView()">导出视图明细</button>'+
      '<button type="button" class="ex-item" onclick="exportPeople()">导出人员明细</button>'+
    '</div>';
  }
  return html+'</div>';
}

function renderOrgPicker(){
  var cur=ORG_INDEX[filter.orgId]||ORG_TREE;
  var html='<div class="org-pick" id="orgPick">'+
    '<button type="button" class="org-trig'+(orgPanelOpen?' is-open':'')+'" onclick="toggleOrgPanel(event)" aria-expanded="'+(orgPanelOpen?'true':'false')+'">'+
      '<span class="org-trig-txt">'+cur.name+'</span>'+I.caret+
    '</button>';
  if(orgPanelOpen){
    html+='<div class="org-panel" id="orgPanel" onclick="event.stopPropagation()">'+renderOrgTreeNodes(ORG_TREE, 0)+'</div>';
  }
  return html+'</div>';
}

function partCell(row, isTotal){
  var n=row.total-(row.skip||0);
  var on=modalState&&modalState.orgId===row.id&&modalState.groupId==='part'?' on':'';
  return '<td class="part-c"><button class="num-link num-ink'+on+'" onclick="openCell(\''+qid(row.id)+'\',\'part\',\'参与\')">'+n+'</button></td>';
}

function skipCell(row, isTotal){
  var n=row.skip||0;
  var extra=n?' num-idle':'';
  var on=modalState&&modalState.orgId===row.id&&modalState.groupId==='skip'?' on':'';
  return '<td class="skip-c"><button class="num-link'+extra+on+'" onclick="openCell(\''+qid(row.id)+'\',\'skip\',\'未参与\')">'+n+'</button></td>';
}

function deptCell(row, depth){
  var canToggle=row.children&&row.children.length>0;
  var pad=depth*18;
  var chev=canToggle
    ? '<button type="button" class="dept-chev'+(expanded[row.id]?' is-open':'')+'" onclick="toggleExpand(\''+qid(row.id)+'\')" aria-label="'+(expanded[row.id]?'收起':'展开')+'">'+I.chev+'</button>'
    : '<span class="dept-chev-ph"></span>';
  var nameCls='dept-name'+(canToggle?' is-toggle':'');
  var nameClick=canToggle?' onclick="toggleExpand(\''+qid(row.id)+'\')"':'';
  return '<td class="dept-c"><div class="dept-cell" style="padding-left:'+pad+'px">'+chev+'<span class="'+nameCls+'"'+nameClick+'>'+row.name+'</span></div></td>';
}

function renderOrgRows(row, depth){
  var html='<tr'+(depth?' class="dept-sub"':'')+'>'+deptCell(row, depth);
  if(isGroupOn('count')) html+=partCell(row,false)+skipCell(row,false);
  GROUPS.forEach(function(g,i){ if(isGroupOn(g.id)) html+=groupCells(row,g,i,false); });
  html+='</tr>';
  if(row.children&&row.children.length&&expanded[row.id]){
    row.children.forEach(function(ch){ html+=renderOrgRows(ch, depth+1); });
  }
  return html;
}

function render(){
  var rows=getRows();
  var people=getPeople();
  var cycleOptions=getCycles().map(function(c){ return '<option value="'+c+'"'+(filter.cycle===c?' selected':'')+'>'+c+'</option>'; }).join('');
  var areaOptions=getAreas().map(function(a){ return '<option value="'+a.replace(/"/g,'&quot;')+'"'+(filter.area===a?' selected':'')+'>'+a+'</option>'; }).join('');
  var totals={id:'total',name:'合计',total:people.length,skip:0,goal:{},talk:{},eval:{},ratify:{},confirm:{}};
  people.forEach(function(p){
    if(p.skip) totals.skip+=1;
    else addCount(totals,p);
  });

  var html='<div'+(firstPaint?' class="fi"':'')+'>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'+
      '<div><h1 style="font:700 20px/1.2 var(--f);color:var(--c9);margin-bottom:4px">考核进度</h1><p style="font:400 13px/1 var(--f);color:var(--c5)">按部门、划分区域或绩效活动统计各环节当前人数，点击行展开下级，点击人数查看名单</p></div>'+
      '<div style="display:flex;gap:8px"><button class="btn btn-s" onclick="openColSet()">'+I.settings+' 设置</button>'+renderExport()+'</div>'+
    '</div>'+
    '<div class="fl-bar">'+
      '<select class="fl-sel" onchange="onCycle(this.value)"><option value="">全部周期</option>'+cycleOptions+'</select>'+
      renderOrgPicker()+
      '<select class="fl-sel" onchange="onArea(this.value)" aria-label="划分区域"><option value="">全部划分区域</option>'+areaOptions+'</select>'+
      renderFilter()+
      '<div class="fl-actions"><button class="btn btn-s" onclick="resetFilters()">'+I.x+' 重置</button></div>'+
    '</div>'+
    '<div class="tbl-card">'+renderViewTabs()+
    '<div class="tbl-wrap"><table style="min-width:'+(176+(isGroupOn('count')?68+56:0)+visGroups().reduce(function(n,g){ return n+groupSpan(g)*88; },0))+'px"><thead>'+
      '<tr><th class="dept-h" rowspan="2">'+dimHeader()+'</th>';
  if(isGroupOn('count')) html+='<th class="count-g-th g-split" colspan="2">考核人数</th>';
  GROUPS.forEach(function(g){
    if(!isGroupOn(g.id)) return;
    html+='<th class="g-th'+(isOff(g)?' is-off':'')+(g.id===lastVisGroupId()?'':' g-split')+'" colspan="'+groupSpan(g)+'" onclick="toggleGroup(\''+g.id+'\')" aria-expanded="'+(isOff(g)?'false':'true')+'" title="'+(isOff(g)?'展开人数列':'收起人数列，只看完成率')+'"><span class="g-th-in">'+I.chev+' '+g.name+'</span></th>';
  });
  html+='</tr><tr>';
  if(isGroupOn('count')) html+='<th class="part-h">参与</th><th class="skip-h">未参与</th>';
  GROUPS.forEach(function(g,i){
    if(!isGroupOn(g.id)) return;
    var items=groupItems(g);
    items.forEach(function(it,j){
      var last=j===items.length-1&&g.id!==lastVisGroupId();
      var cls=(it.type==='part'?'g-part':'')+(last?' g-split':'');
      html+='<th'+(cls?' class="'+cls.trim()+'"':'')+'>'+it.key+'</th>';
    });
  });
  html+='</tr></thead><tbody>';

  var emptySpan=1+(isGroupOn('count')?2:0)+visGroups().reduce(function(n,g){ return n+groupSpan(g); },0);
  if(!rows.length){
    html+='<tr><td class="empty" colspan="'+emptySpan+'">没有匹配的数据</td></tr>';
  }else{
    html+='<tr class="total-row"><td class="dept-c"><span class="dept-name">合计</span></td>';
    if(isGroupOn('count')) html+=partCell(totals,true)+skipCell(totals,true);
    GROUPS.forEach(function(g,i){ if(isGroupOn(g.id)) html+=groupCells(totals,g,i,true); });
    html+='</tr>';
    rows.forEach(function(row){ html+=renderOrgRows(row, 0); });
  }

  html+='</tbody></table></div></div></div>';
  document.getElementById('app').innerHTML=html;
  firstPaint=false;
  if(colSetOpen) renderColSet();
  if(filterOpen){
    var input=document.getElementById('actSearch');
    if(input){
      input.focus();
      var t=input.value;
      input.setSelectionRange(t.length,t.length);
    }
  }
}

function onCycle(v){filter.cycle=v;orgPanelOpen=false;filterOpen=false;exportOpen=false;colSetOpen=false;closeModal();}
function onArea(v){filter.area=v;orgPanelOpen=false;filterOpen=false;exportOpen=false;colSetOpen=false;closeModal();}
function setView(id){
  viewMode=id;
  expanded={};
  filterOpen=false;
  exportOpen=false;
  if(modalState) closeModal();
  else render();
}
function toggleFilter(ev){
  if(ev) ev.stopPropagation();
  filterOpen=!filterOpen;
  orgPanelOpen=false;
  exportOpen=false;
  render();
}
function applyFilterPanel(){ filterOpen=false; render(); }
function resetPanelFilters(){ filter.activity=''; filterOpen=true; render(); }
function toggleOrgPanel(ev){
  if(ev) ev.stopPropagation();
  orgPanelOpen=!orgPanelOpen;
  filterOpen=false;
  exportOpen=false;
  render();
}
function togglePickerNode(id, ev){
  if(ev) ev.stopPropagation();
  var panel=document.getElementById('orgPanel');
  var top=panel?panel.scrollTop:0;
  pickerExpanded[id]=!pickerExpanded[id];
  render();
  var next=document.getElementById('orgPanel');
  if(next) next.scrollTop=top;
}
function selectOrg(id){
  filter.orgId=id;
  orgPanelOpen=false;
  if(modalState) closeModal();
  else render();
}
function onActivity(v){
  filter.activity=v;
  filterOpen=true;
  if(modalState) closeModal();
  else render();
}
function toggleGroup(id){
  collapsed[id]=!collapsed[id];
  render();
}
function toggleExpand(id){
  expanded[id]=!expanded[id];
  render();
}
function resetFilters(){filter={cycle:'2026年Q2',orgId:'all',activity:'',area:''};orgPanelOpen=false;filterOpen=false;exportOpen=false;colSetOpen=false;closeModal();}
function exportRowVals(row){
  var vals=[row.name];
  if(isGroupOn('count')) vals.push(row.total-(row.skip||0), row.skip||0);
  visGroups().forEach(function(g){
    var items=groupItems(g);
    var rates=groupRates(row,g);
    items.forEach(function(it){
      if(it.type==='rate') vals.push(rates[it.key]==null?'':rates[it.key]+'%');
      else if(it.type==='part') vals.push(row.total-(row.skip||0));
      else vals.push(row[g.id][it.key]||0);
    });
  });
  return vals;
}
function toggleExport(ev){
  if(ev) ev.stopPropagation();
  exportOpen=!exportOpen;
  filterOpen=false;
  orgPanelOpen=false;
  render();
}
function exportView(){
  exportOpen=false;
  var h1=[dimHeader()];
  var h2=[dimHeader()];
  if(isGroupOn('count')){ h1.push('考核人数','考核人数'); h2.push('参与','未参与'); }
  visGroups().forEach(function(g){
    groupItems(g).forEach(function(it){ h1.push(g.name); h2.push(it.key); });
  });
  var people=getPeople();
  var totals={id:'total',name:'合计',total:people.length,skip:0,goal:{},talk:{},eval:{},ratify:{},confirm:{}};
  people.forEach(function(p){ if(p.skip) totals.skip+=1; else addCount(totals,p); });
  var lines=[h1.map(csvCell).join(','), h2.map(csvCell).join(','), exportRowVals(totals).map(csvCell).join(',')];
  function walk(row){
    lines.push(exportRowVals(row).map(csvCell).join(','));
    if(row.children&&row.children.length&&expanded[row.id]) row.children.forEach(walk);
  }
  getRows().forEach(walk);
  downloadCsv('考核进度-视图明细.csv', lines, '已导出当前视图明细');
  render();
}
function exportPeople(){
  exportOpen=false;
  var headers=['姓名（工号）','部门','人员状态','用工形式','划分区域','岗位','职级','入职日期','活动名称','当前环节','当前处理人','当前状态'];
  var lines=[headers.map(csvCell).join(',')];
  getPeople().forEach(function(p){
    var ss=cellStageStatus(p,'part','参与');
    lines.push([p.name+'（'+p.empId+'）',p.dept,p.empStatus,p.workType,p.area,p.job,p.rank,p.hireDate,p.activity,ss.stage,p.handler,ss.status].map(csvCell).join(','));
  });
  downloadCsv('考核进度-人员明细.csv', lines, '已导出 '+getPeople().length+' 人');
  render();
}

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if((nodePickOpen||procPickOpen)&&colSetOpen){
    closeColPicks();
    renderColSet();
  }
  else if(modalState) closeModal();
  else if(colSetOpen) closeColSet();
  else if(exportOpen){ exportOpen=false; render(); }
  else if(filterOpen){ filterOpen=false; render(); }
  else if(orgPanelOpen){ orgPanelOpen=false; render(); }
});
document.addEventListener('click',function(e){
  var need=false;
  if(orgPanelOpen){
    var wrap=document.getElementById('orgPick');
    if(!(wrap&&wrap.contains(e.target))){ orgPanelOpen=false; need=true; }
  }
  if(filterOpen){
    var fil=document.getElementById('flFilter');
    if(!(fil&&fil.contains(e.target))){ filterOpen=false; need=true; }
  }
  if(exportOpen){
    var ex=document.getElementById('exWrap');
    if(!(ex&&ex.contains(e.target))){ exportOpen=false; need=true; }
  }
  if((nodePickOpen||procPickOpen)&&colSetOpen){
    var np=document.querySelector('.node-pick.is-open');
    if(!(np&&np.contains(e.target))){
      closeColPicks();
      renderColSet();
    }
  }
  if(need) render();
});

render();
</script>
</body>
</html>
