<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 绩效结果</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#F5F5F4;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --r1:6px;--r2:8px;--r3:10px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}

.fl-bar{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl-search{display:flex;align-items:center;gap:6px;background:var(--c0);border:1px solid var(--c2);border-radius:var(--r1);padding:0 10px;height:32px;min-width:200px;transition:all .15s}
.fl-search:focus-within{background:var(--sf);border-color:var(--pr)}
.fl-search svg{color:var(--c4);flex-shrink:0;width:13px;height:13px}
.fl-search input{border:none;background:transparent;outline:none;font:13px/1 var(--f);width:100%;color:var(--c9)}
.fl-search input::placeholder{color:var(--c4)}
.fl-sel{height:32px;padding:0 28px 0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c7);background:var(--sf) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;appearance:none;cursor:pointer;transition:all .12s;outline:none;-webkit-appearance:none;-moz-appearance:none}
.fl-sel:focus{border-color:var(--pr)}
.fl-actions{display:flex;gap:6px;margin-left:auto}

.tbl-card{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:var(--c0);font:600 12px/1 var(--f);color:var(--c5);text-align:left;padding:10px 14px;border-bottom:1px solid var(--dv);white-space:nowrap;letter-spacing:.2px;text-transform:uppercase}
tbody td{font:400 13px/1.4 var(--f);color:var(--c7);padding:12px 14px;border-bottom:1px solid var(--dv);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--c0)}
tbody tr:nth-child(even){background:var(--c0)}
tbody tr:nth-child(even):hover{background:var(--pr50)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--m);font-size:12px}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font:500 11px/1 var(--f);white-space:nowrap}
.tag-em{background:var(--em50);color:var(--em700)}
.tag-ac{background:var(--ac50);color:var(--ac700)}
.tag-ro{background:var(--ro50);color:var(--ro)}

.grade-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:4px;font:600 12px/1 var(--f)}
.grade-S{background:#FEF2F2;color:#DC2626}
.grade-A{background:#FFF7ED;color:#F97316}
.grade-Bp{background:#FFFBEB;color:#F59E0B}
.grade-B{background:#ECFDF5;color:#10B981}
.grade-Bm{background:#EEF2FF;color:#6366F1}
.grade-C{background:#F4F4F5;color:#71717A}
.grade-D{background:#FAFAFA;color:#A1A1AA}

.pg-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--dv);font:400 12px/1 var(--f);color:var(--c5)}
.pg-info{display:flex;align-items:center;gap:16px}
.pg-nav{display:flex;align-items:center;gap:4px}
.pg-btn{width:28px;height:28px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;border:1px solid var(--c2);background:var(--sf);cursor:pointer;color:var(--c5);font:500 12px/1 var(--f);transition:all .12s}
.pg-btn:hover{border-color:var(--pr);color:var(--pr)}
.pg-btn.on{background:var(--pr);border-color:var(--pr);color:#FFF}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

.lk{color:var(--pr);cursor:pointer;text-decoration:none;font-weight:500}
.lk:hover{text-decoration:underline}

.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--dv)}.tbl-title{font-size:14px;font-weight:600;color:var(--c9)}.cutoff{font-size:11px;color:var(--c5)}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;width:100%}.filter-row+.filter-row{padding-top:12px;margin-top:2px;border-top:1px solid var(--dv)}.fl-search.activity{min-width:240px}.summary{font-size:12px;color:var(--c5);align-self:center}.summary strong{color:var(--c9)}table{min-width:3300px}tbody td{white-space:nowrap}.cell-long{min-width:280px;white-space:normal!important}.tag-ne{background:var(--c1);color:var(--c6)}.empty{text-align:center!important;padding:52px!important;color:var(--c5)}
.mask{position:fixed;inset:0;background:rgba(24,24,27,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:999}.modal{width:min(680px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--sf);border-radius:12px;box-shadow:0 20px 55px rgba(0,0,0,.22)}.modal-head,.modal-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--dv)}.modal-head h2{font-size:17px;color:var(--c9)}.modal-body{padding:20px}.modal-foot{justify-content:flex-end;border-top:1px solid var(--dv);border-bottom:0;gap:8px}.close{border:0;background:transparent;font-size:22px;color:var(--c5);cursor:pointer}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px}.detail-grid dt{font-size:11px;color:var(--c5);margin-bottom:4px}.detail-grid dd{font-size:13px;color:var(--c8);font-weight:500}.result-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--dv)}.result-box{padding:12px;background:var(--c0);border:1px solid var(--c2);border-radius:var(--r2)}.result-box span{display:block;font-size:11px;color:var(--c5);margin-bottom:4px}.result-box strong{font-size:13px;color:var(--c9)}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.checks label{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--c2);border-radius:var(--r1);font-size:12px;cursor:pointer}.checks input{accent-color:var(--pr)}.notice{margin-top:14px;padding:10px 12px;background:var(--pr50);color:var(--pr700);border-radius:var(--r1);font-size:12px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 16px;background:var(--c9);color:#fff;border-radius:var(--r1);font-size:12px;z-index:1000}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){.detail-grid,.result-flow,.checks{grid-template-columns:1fr}.fl-search,.fl-search.activity{width:100%}}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .25s ease forwards}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div><div id="toast"></div>
<script src="navigation.js"></script>
<script>
GHR_NAV.init('perf', '绩效结果');

var I={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>',
};

var GRADE_CODE={'远超预期':'S','超出预期':'A','符合预期+':'Bp','符合预期':'B','符合预期-':'Bm','低于预期':'C','远低预期':'D'};
var GRADE_MAP={S:'grade-S',A:'grade-A',Bp:'grade-Bp',B:'grade-B',Bm:'grade-Bm',C:'grade-C',D:'grade-D'};

var names=['张明','李华','王芳','赵磊','陈静','刘洋','周婷','吴强','郑丽','孙鹏','钱敏','黄波','林燕','何涛','马丽','朱伟','胡洁','郭明','杨峰','沈云'];
var depts=['产品部','技术部','市场部','设计部','运营部','产品部','技术部','市场部','设计部','运营部','产品部','技术部','市场部','设计部','运营部','产品部','技术部','市场部','设计部','运营部'];
var jobs=['高级产品经理','高级工程师','市场经理','UI设计师','运营主管','产品经理','前端工程师','品牌专员','交互设计师','数据分析师','产品助理','后端工程师','活动策划','视觉设计师','内容运营','产品总监','测试工程师','渠道经理','设计总监','社群运营'];
var allPeriods=['2026年Q2','2026年Q2','2026年Q2','2026年Q2','2026年Q2','2026年Q1','2026年Q1','2026年Q1','2026年Q1','2025年Q4','2025年Q4','2025年Q4','2025年Q4','2025年Q4','2025年Q3','2025年Q3','2025年Q3','2025年Q3','2025年Q3','2026年Q2'];
var scores=[87.5,92.0,78.3,85.6,81.2,90.1,76.8,82.4,88.9,79.5,72.3,95.0,68.5,84.2,75.0,91.3,83.7,73.2,89.0,58.0];
var grades=['符合预期+','超出预期','符合预期','符合预期+','符合预期','超出预期','符合预期','符合预期+','符合预期+','符合预期','符合预期','远超预期','符合预期-','符合预期','符合预期','超出预期','符合预期','符合预期','符合预期+','低于预期'];
var ratifyGrades=['符合预期+','超出预期','符合预期','符合预期+','符合预期','超出预期','符合预期','符合预期+','符合预期+','符合预期','符合预期','远超预期','符合预期-','符合预期','符合预期-','超出预期','符合预期','符合预期','符合预期+','低于预期'];
var confirms=['已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','已确认','待确认','待确认','待确认','待确认','待确认','已申诉'];

function orgProfile(dept,region){
  var deptLevel2='中国区';
  var deptLevel3=region+'区域';
  var deptLevel4=(dept==='产品部'||dept==='技术部'||dept==='设计部')?'产品研发中心':'市场运营中心';
  var deptLevel5=dept;
  return {
    currentDept:dept,
    fullDept:[deptLevel2,deptLevel3,deptLevel4,deptLevel5].join(' / '),
    deptLevel2:deptLevel2,deptLevel3:deptLevel3,deptLevel4:deptLevel4,deptLevel5:deptLevel5,
    deptLevel6:'—',deptLevel7:'—',deptLevel8:'—'
  };
}

var RESULT_DATA=[];
for(var i=0;i<20;i++){
  var region=i%3===0?'华东':'华南';
  var org=orgProfile(depts[i],region);
  RESULT_DATA.push({
    empId:'EMP'+String(i+1).padStart(4,'0'),name:names[i],dept:depts[i],currentDept:org.currentDept,fullDept:org.fullDept,
    deptLevel2:org.deptLevel2,deptLevel3:org.deptLevel3,deptLevel4:org.deptLevel4,deptLevel5:org.deptLevel5,deptLevel6:org.deptLevel6,deptLevel7:org.deptLevel7,deptLevel8:org.deptLevel8,
    job:jobs[i],period:allPeriods[i],activity:allPeriods[i]+'-'+depts[i]+'考核',cycleType:'季度',rule:'七级绩效等级',personStatus:i===19?'离职':'在职',employment:['正式员工','劳务派遣','实习生'][i%3],region:region,level:['P7','P6','P6','P5','P5'][i%5],hireDate:(2020+i%5)+'-'+String(i%12+1).padStart(2,'0')+'-'+String(i%25+1).padStart(2,'0'),
    score:scores[i],grade:grades[i],adjustedGrade:i===14?'符合预期-':grades[i],ratifyGrade:ratifyGrades[i],confirm:confirms[i],source:i===18?'报表导入':'活动更新',dataStatus:i===18?'活动管理员导入':'已完成',updated:'2026-08-'+String(10-i%7).padStart(2,'0')+' '+String(9+i%8).padStart(2,'0')+':'+String(i*7%60).padStart(2,'0')
  });
}
RESULT_DATA.sort(function(a,b){return b.period.localeCompare(a.period,'zh-CN')||a.empId.localeCompare(b.empId);});

var DEPTS=['全部','产品部','技术部','市场部','设计部','运营部'];
var CONFIRM_STATUSES=['全部状态','已确认','待确认','已申诉'];

var filter={search:'',activity:'',cycle:'',dept:'',rule:'',dataStatus:'',status:''};
var currentPage=1;
var pageSize=10;
var filterTimer;

function getCycles(){
  var set={};
  for(var i=0;i<RESULT_DATA.length;i++){set[RESULT_DATA[i].period]=1;}
  return Object.keys(set).sort().reverse();
}

function getFiltered(){
  return RESULT_DATA.filter(function(d){
    if(filter.search&&d.name.indexOf(filter.search)===-1&&d.empId.indexOf(filter.search)===-1)return false;
    if(filter.activity&&d.activity.indexOf(filter.activity)===-1)return false;
    if(filter.cycle&&d.period!==filter.cycle)return false;
    if(filter.dept&&d.dept!==filter.dept)return false;
    if(filter.rule&&d.rule!==filter.rule)return false;
    if(filter.dataStatus&&d.dataStatus!==filter.dataStatus)return false;
    if(filter.status&&filter.status!=='全部状态'&&d.confirm!==filter.status)return false;
    return true;
  });
}

function gradeClass(g){
  var code=GRADE_CODE[g]||'B';
  return GRADE_MAP[code]||'grade-B';
}

function render(){
  var data=getFiltered();
  var total=data.length;
  var totalPages=Math.ceil(total/pageSize)||1;
  if(currentPage>totalPages)currentPage=totalPages;
  var start=(currentPage-1)*pageSize;
  var page=data.slice(start,start+pageSize);

  var cycleOptions=getCycles().map(function(c){return '<option value="'+c+'"'+(filter.cycle===c?' selected':'')+'>'+c+'</option>';}).join('');
  var deptOptions=DEPTS.slice(1).map(function(d){return '<option value="'+d+'"'+(filter.dept===d?' selected':'')+'>'+d+'</option>';}).join('');
  var statusOptions=CONFIRM_STATUSES.map(function(s){return '<option value="'+s+'"'+(filter.status===s?' selected':'')+'>'+s+'</option>';}).join('');
  var html='<div class="fi">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'+
      '<div><h1 style="font:700 20px/1.2 var(--f);color:var(--c9);margin-bottom:4px">绩效结果</h1><p style="font:400 13px/1 var(--f);color:var(--c5)">按员工、周期与活动查看当前有效的绩效结果</p></div>'+
      '<div style="display:flex;gap:8px"><button class="btn btn-s" onclick="openImport()">'+I.upload+' 导入</button><button class="btn btn-s" onclick="openExport()">导出设置</button><button class="btn btn-p" onclick="handleExport()">'+I.download+' 导出</button></div>'+
    '</div>'+
    '<div class="fl-bar">'+
      '<div class="filter-row"><div class="fl-search">'+I.search+'<input id="flSearch" aria-label="员工" placeholder="姓名或工号" value="'+filter.search+'" oninput="onSearch(this.value)"></div><div class="fl-search activity">'+I.search+'<input aria-label="考核活动" placeholder="考核活动名称" value="'+filter.activity+'" oninput="onActivity(this.value)"></div><select aria-label="周期" class="fl-sel" onchange="onCycle(this.value)"><option value="">全部周期</option>'+cycleOptions+'</select><select aria-label="部门" class="fl-sel" onchange="onDept(this.value)"><option value="">全部部门</option>'+deptOptions+'</select></div>'+
      '<div class="filter-row"><select aria-label="等级规则" class="fl-sel" onchange="onRule(this.value)"><option value="">全部等级规则</option><option value="七级绩效等级"'+(filter.rule?' selected':'')+'>七级绩效等级</option></select><select aria-label="数据状态" class="fl-sel" onchange="onDataStatus(this.value)"><option value="">全部数据状态</option><option value="已完成"'+(filter.dataStatus==='已完成'?' selected':'')+'>已完成</option><option value="活动管理员导入"'+(filter.dataStatus==='活动管理员导入'?' selected':'')+'>活动管理员导入</option></select><select aria-label="确认状态" class="fl-sel" onchange="onStatus(this.value)">'+statusOptions+'</select><span class="summary">已找到 <strong>'+total+'</strong> 条当前有效结果</span><div class="fl-actions"><button class="btn btn-s" onclick="resetFilters()">'+I.x+' 重置</button><button class="btn btn-p" onclick="showToast(\'已按当前条件查询\')">查询</button></div></div>'+
    '</div>'+
    '<div class="tbl-card">'+
      '<div class="tbl-head"><span class="tbl-title">结果明细</span><span class="cutoff">数据截止 2026-08-11 18:00</span></div><div class="tbl-wrap"><table><thead><tr>'+
        '<th>姓名</th><th>工号</th><th>当前部门</th><th>全路径部门</th><th>二级部门</th><th>三级部门</th><th>四级部门</th><th>五级部门</th><th>六级部门</th><th>七级部门</th><th>八级部门</th><th>人员状态</th><th>用工形式</th><th>划分区域</th><th>岗位</th><th>职级</th><th>入职日期</th><th>周期类型</th><th>周期</th><th>绩效活动</th><th>等级规则</th><th>考核总分</th><th>初评等级</th><th>最终等级</th><th>确认状态</th><th>数据来源</th><th>更新时间</th>'+
      '</tr></thead><tbody>';

  if(!page.length)html+='<tr><td class="empty" colspan="27">数据尚未产生，请调整筛选条件</td></tr>';
  for(var i=0;i<page.length;i++){
    var d=page[i];
    var ct=d.confirm==='已确认'?'tag-em':d.confirm==='待确认'?'tag-ac':'tag-ro';
    html+='<tr>'+
      '<td style="font-weight:500;color:var(--c9)">'+d.name+'</td>'+
      '<td class="mono">'+d.empId+'</td>'+
      '<td>'+d.currentDept+'</td><td class="cell-long">'+d.fullDept+'</td>'+
      '<td>'+d.deptLevel2+'</td><td>'+d.deptLevel3+'</td><td>'+d.deptLevel4+'</td><td>'+d.deptLevel5+'</td><td>'+d.deptLevel6+'</td><td>'+d.deptLevel7+'</td><td>'+d.deptLevel8+'</td>'+
      '<td><span class="tag '+(d.personStatus==='在职'?'tag-em':'tag-ne')+'">'+d.personStatus+'</span></td><td>'+d.employment+'</td><td>'+d.region+'</td>'+
      '<td>'+d.job+'</td>'+
      '<td>'+d.level+'</td><td class="mono">'+d.hireDate+'</td><td>'+d.cycleType+'</td><td>'+d.period+'</td><td>'+d.activity+'</td><td>'+d.rule+'</td>'+
      '<td class="mono" style="font-weight:600">'+d.score.toFixed(2)+'</td><td>'+d.adjustedGrade+'</td>'+
      '<td><span class="grade-tag '+gradeClass(d.ratifyGrade)+'">'+d.ratifyGrade+'</span></td>'+
      '<td><span class="tag '+ct+'">'+d.confirm+'</span></td>'+
      '<td><span class="tag '+(d.source==='活动更新'?'tag-em':'tag-ne')+'">'+d.source+'</span></td><td class="mono">'+d.updated+'</td>'+
      '</tr>';
  }

  html+='</tbody></table></div>'+
    '<div class="pg-bar">'+
      '<div class="pg-info"><span>第 '+(total?start+1:0)+'-'+Math.min(start+pageSize,total)+' 条，共 '+total+' 条</span></div>'+
      '<div class="pg-nav">';
  for(var p=1;p<=totalPages;p++){
    html+='<button class="pg-btn'+(p===currentPage?' on':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  }
  html+='</div></div></div></div>';

  document.getElementById('app').innerHTML=html;
}

function onSearch(v){filter.search=v;currentPage=1;clearTimeout(filterTimer);filterTimer=setTimeout(render,180);}
function onActivity(v){filter.activity=v;currentPage=1;clearTimeout(filterTimer);filterTimer=setTimeout(render,180);}
function onCycle(v){filter.cycle=v;currentPage=1;render();}
function onDept(v){filter.dept=v;currentPage=1;render();}
function onRule(v){filter.rule=v;currentPage=1;render();}
function onDataStatus(v){filter.dataStatus=v;currentPage=1;render();}
function onStatus(v){filter.status=v;currentPage=1;render();}
function goPage(p){currentPage=p;render();}
function resetFilters(){clearTimeout(filterTimer);filter={search:'',activity:'',cycle:'',dept:'',rule:'',dataStatus:'',status:''};currentPage=1;render();showToast('筛选条件已重置');}
function showModal(title,body,foot){document.getElementById('overlay').innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">'+title+'</h2><button class="close" aria-label="关闭" onclick="closeModal()">×</button></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+foot+'</div></section></div>';document.querySelector('.close').focus();}
function closeModal(){document.getElementById('overlay').innerHTML='';}
function handleExport(){showToast('正在导出当前 '+getFiltered().length+' 条结果');}
function openExport(){var fs=['姓名','工号','当前部门','全路径部门','二级部门','三级部门','四级部门','五级部门','六级部门','七级部门','八级部门','人员状态','用工形式','划分区域','岗位','职级','入职日期','周期类型','周期','绩效活动','等级规则','考核总分','初评等级','最终等级','确认状态','数据来源','更新时间'];showModal('导出设置','<div class="checks">'+fs.map(function(x){return '<label><input type="checkbox" checked> '+x+'</label>';}).join('')+'</div><div class="notice">仅导出当前查询范围和当前用户有权查看的字段，并附带查询条件与数据截止时间。</div>','<button class="btn btn-s" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="closeModal();handleExport()">确认导出</button>');}
function openImport(){showModal('导入绩效结果','<div style="padding:28px;text-align:center;border:1px dashed var(--c3);border-radius:8px;background:var(--c0)"><strong style="display:block;margin-bottom:8px">上传绩效结果文件</strong><input id="importFile" type="file" accept=".xlsx"><p style="font-size:12px;color:var(--c5);margin-top:8px">按工号、周期、等级规则和最终等级匹配</p></div><div class="notice">报表导入不会覆盖活动更新数据；已有报表导入记录时更新原记录。</div>','<button class="btn btn-s" onclick="showToast(\'模板下载已触发（原型）\')">下载模板</button><button class="btn btn-p" onclick="validateImport()">上传并校验</button>');}
function validateImport(){var f=document.getElementById('importFile');if(!f.files.length){showToast('请先选择 .xlsx 文件');return;}closeModal();showToast('文件已通过格式校验（原型）');}
var toastTimer;function showToast(msg){clearTimeout(toastTimer);document.getElementById('toast').innerHTML='<div class="toast" role="status">'+msg+'</div>';toastTimer=setTimeout(function(){document.getElementById('toast').innerHTML='';},2200);}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
