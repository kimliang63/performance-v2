<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 目标中心</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#F5F5F4;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --r1:6px;--r2:8px;--r3:10px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}

.fl-bar{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl-search{display:flex;align-items:center;gap:6px;background:var(--c0);border:1px solid var(--c2);border-radius:var(--r1);padding:0 10px;height:32px;min-width:200px;transition:all .15s}
.fl-search:focus-within{background:var(--sf);border-color:var(--pr)}
.fl-search svg{color:var(--c4);flex-shrink:0;width:13px;height:13px}
.fl-search input{border:none;background:transparent;outline:none;font:13px/1 var(--f);width:100%;color:var(--c9)}
.fl-search input::placeholder{color:var(--c4)}
.fl-sel{height:32px;padding:0 28px 0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c7);background:var(--sf) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 10px center;appearance:none;cursor:pointer;transition:all .12s;outline:none;-webkit-appearance:none;-moz-appearance:none}
.fl-sel:focus{border-color:var(--pr)}
.fl-actions{display:flex;gap:6px;margin-left:auto}

.tbl-card{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:3300px}
thead th{background:var(--c0);font:600 12px/1 var(--f);color:var(--c5);text-align:left;padding:10px 14px;border-bottom:1px solid var(--dv);white-space:nowrap;letter-spacing:.2px;text-transform:uppercase}
tbody td{font:400 13px/1.4 var(--f);color:var(--c7);padding:12px 14px;border-bottom:1px solid var(--dv);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--c0)}
tbody tr:nth-child(even){background:var(--c0)}
tbody tr:nth-child(even):hover{background:var(--pr50)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--m);font-size:12px}
.cell-long{min-width:180px;max-width:280px;white-space:normal}
.gradient-list{min-width:240px;display:flex;flex-direction:column;gap:4px;white-space:normal}
.gradient-name{color:var(--c5);font-weight:500}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font:500 11px/1 var(--f);white-space:nowrap}
.tag-em{background:var(--em50);color:var(--em700)}
.tag-ac{background:var(--ac50);color:var(--ac700)}
.tag-pr{background:var(--pr50);color:var(--pr)}
.tag-c5{background:var(--c1);color:var(--c5)}
.tag-ro{background:var(--ro50);color:var(--ro)}

.pg-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--dv);font:400 12px/1 var(--f);color:var(--c5)}
.pg-info{display:flex;align-items:center;gap:16px}
.pg-nav{display:flex;align-items:center;gap:4px}
.pg-btn{width:28px;height:28px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;border:1px solid var(--c2);background:var(--sf);cursor:pointer;color:var(--c5);font:500 12px/1 var(--f);transition:all .12s}
.pg-btn:hover{border-color:var(--pr);color:var(--pr)}
.pg-btn.on{background:var(--pr);border-color:var(--pr);color:#FFF}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

.lk{color:var(--pr);cursor:pointer;text-decoration:none;font-weight:500}
.lk:hover{text-decoration:underline}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .25s ease forwards}
</style>
</head>
<body>
<div id="app"></div>
<script src="navigation.js"></script>
<script>
GHR_NAV.init('perf', '目标中心');

var I={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
};

function personProfile(dept,region,job,level,status,employment,hireDate,center){
  var deptLevel2='中国区';
  var deptLevel3=region+'区域';
  var deptLevel4=center;
  var deptLevel5=dept;
  return {
    currentDept:dept,
    fullDept:[deptLevel2,deptLevel3,deptLevel4,deptLevel5].join(' / '),
    deptLevel2:deptLevel2,deptLevel3:deptLevel3,deptLevel4:deptLevel4,deptLevel5:deptLevel5,
    deptLevel6:'—',deptLevel7:'—',deptLevel8:'—',
    personStatus:status,employment:employment,region:region,job:job,level:level,hireDate:hireDate
  };
}

var PERSON_META={
  EMP0001:personProfile('产品部','华东','高级产品经理','P7','在职','正式员工','2022-03-15','产品研发中心'),
  EMP0002:personProfile('技术部','华东','高级工程师','P7','在职','正式员工','2021-07-01','产品研发中心'),
  EMP0003:personProfile('市场部','华南','市场经理','P6','在职','正式员工','2023-02-20','市场运营中心'),
  EMP0005:personProfile('运营部','华南','运营主管','P6','在职','劳务派遣','2024-01-08','市场运营中心'),
  EMP0007:personProfile('技术部','华东','前端工程师','P6','在职','正式员工','2023-06-12','产品研发中心'),
  EMP0016:personProfile('产品部','华东','产品总监','P9','在职','正式员工','2019-09-16','产品研发中心')
};

var GOAL_DATA=[
  {empId:'EMP0001',name:'张明',dept:'产品部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'完成新员工入职体验优化',weight:'30%',type:'定量',standard:'阶梯目标值',gradient1:'满意度 ≥ 85%',gradient2:'满意度 ≥ 90%',gradient3:'满意度 ≥ 95%',unit:'%'},
  {empId:'EMP0001',name:'张明',dept:'产品部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'绩效产品需求按期交付',weight:'40%',type:'定量',standard:'阶梯完成率',gradient1:'按期率 ≥ 80%',gradient2:'按期率 ≥ 90%',gradient3:'按期率 = 100%',unit:'%'},
  {empId:'EMP0001',name:'张明',dept:'产品部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'提升跨团队协作质量',weight:'30%',type:'定性',standard:'行为等级描述',gradient1:'能主动同步风险',gradient2:'能推动多方达成一致',gradient3:'形成可复用协作机制',unit:'—'},
  {empId:'EMP0002',name:'李华',dept:'技术部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'核心服务可用性提升',weight:'50%',type:'定量',standard:'阶梯目标值',gradient1:'99.90%',gradient2:'99.95%',gradient3:'99.99%',unit:'%'},
  {empId:'EMP0002',name:'李华',dept:'技术部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'关键项目技术方案评审',weight:'50%',type:'定性',standard:'行为等级描述',gradient1:'方案完整可落地',gradient2:'识别并关闭关键风险',gradient3:'沉淀团队技术规范',unit:'—'},
  {empId:'EMP0003',name:'王芳',dept:'市场部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'重点市场活动获客',weight:'60%',type:'定量',standard:'阶梯目标值',gradient1:'800',gradient2:'1000',gradient3:'1200',unit:'人'},
  {empId:'EMP0003',name:'王芳',dept:'市场部',period:'2026年Q2',activity:'2026年Q2标准季度考核方案',goal:'品牌内容质量提升',weight:'40%',type:'定性',standard:'行为等级描述',gradient1:'内容按计划发布',gradient2:'重点内容形成传播',gradient3:'形成行业影响力',unit:'—'},
  {empId:'EMP0005',name:'陈静',dept:'运营部',period:'2026年6月',activity:'2026年6月运营月度考核',goal:'客户工单按时解决率',weight:'70%',type:'定量',standard:'阶梯完成率',gradient1:'≥ 90%',gradient2:'≥ 95%',gradient3:'≥ 98%',unit:'%'},
  {empId:'EMP0005',name:'陈静',dept:'运营部',period:'2026年6月',activity:'2026年6月运营月度考核',goal:'运营流程优化',weight:'30%',type:'定性',standard:'行为等级描述',gradient1:'完成问题识别',gradient2:'完成方案落地',gradient3:'效果稳定并推广',unit:'—'},
  {empId:'EMP0007',name:'周婷',dept:'技术部',period:'2026年6月',activity:'2026年6月研发月度考核',goal:'线上缺陷修复时效',weight:'60%',type:'定量',standard:'阶梯时效值',gradient1:'48',gradient2:'24',gradient3:'12',unit:'小时'},
  {empId:'EMP0007',name:'周婷',dept:'技术部',period:'2026年6月',activity:'2026年6月研发月度考核',goal:'代码评审质量',weight:'40%',type:'定性',standard:'行为等级描述',gradient1:'按规范完成评审',gradient2:'主动识别系统风险',gradient3:'推动质量机制改进',unit:'—'},
  {empId:'EMP0016',name:'朱伟',dept:'产品部',period:'2026年H1',activity:'2026年H1产品半年度考核',goal:'产品路线图重点事项达成',weight:'50%',type:'定量',standard:'阶梯完成率',gradient1:'≥ 80%',gradient2:'≥ 90%',gradient3:'= 100%',unit:'%'},
  {empId:'EMP0016',name:'朱伟',dept:'产品部',period:'2026年H1',activity:'2026年H1产品半年度考核',goal:'用户研究体系建设',weight:'50%',type:'定性',standard:'行为等级描述',gradient1:'完成研究计划',gradient2:'洞察进入产品决策',gradient3:'建立持续研究机制',unit:'—'},
];

GOAL_DATA.forEach(function(d){
  var profile=PERSON_META[d.empId];
  if(profile)Object.keys(profile).forEach(function(key){d[key]=profile[key];});
});

var DEPTS=['全部','产品部','技术部','市场部','设计部','运营部'];
var TYPES=['全部类型','定量','定性'];

var filter={search:'',cycle:'',activity:'',dept:'',type:''};
var currentPage=1;
var pageSize=10;

function getCycles(){
  var set={};
  for(var i=0;i<GOAL_DATA.length;i++){set[GOAL_DATA[i].period]=1;}
  return Object.keys(set).sort().reverse();
}

function getActivities(){
  var set={};
  for(var i=0;i<GOAL_DATA.length;i++){set[GOAL_DATA[i].activity]=1;}
  return Object.keys(set).sort();
}

function getFiltered(){
  return GOAL_DATA.filter(function(d){
    if(filter.search&&d.name.indexOf(filter.search)===-1&&d.empId.indexOf(filter.search)===-1&&d.goal.indexOf(filter.search)===-1)return false;
    if(filter.cycle&&d.period!==filter.cycle)return false;
    if(filter.activity&&d.activity!==filter.activity)return false;
    if(filter.dept&&d.dept!==filter.dept)return false;
    if(filter.type&&filter.type!=='全部类型'&&d.type!==filter.type)return false;
    return true;
  });
}

function gradientValue(value,unit){
  if(!value)return '—';
  if(!unit||unit==='—'||value.indexOf(unit)!==-1)return value;
  return value+unit;
}

function gradientCell(d){
  var names=d.gradientNames||(d.type==='定量'?['保底值','目标值','挑战值']:['达标','良好','优秀']);
  var values=[d.gradient1,d.gradient2,d.gradient3];
  return '<div class="gradient-list">'+values.map(function(value,index){
    return '<div><span class="gradient-name">'+names[index]+'：</span>'+gradientValue(value,d.unit)+'</div>';
  }).join('')+'</div>';
}

function render(){
  var data=getFiltered();
  var total=data.length;
  var totalPages=Math.ceil(total/pageSize)||1;
  if(currentPage>totalPages)currentPage=totalPages;
  var start=(currentPage-1)*pageSize;
  var page=data.slice(start,start+pageSize);

  var cycleOptions=getCycles().map(function(c){return '<option value="'+c+'"'+(filter.cycle===c?' selected':'')+'>'+c+'</option>';}).join('');
  var activityOptions=getActivities().map(function(a){return '<option value="'+a+'"'+(filter.activity===a?' selected':'')+'>'+a+'</option>';}).join('');
  var deptOptions=DEPTS.slice(1).map(function(d){return '<option value="'+d+'"'+(filter.dept===d?' selected':'')+'>'+d+'</option>';}).join('');
  var typeOptions=TYPES.map(function(t){return '<option value="'+t+'"'+(filter.type===t?' selected':'')+'>'+t+'</option>';}).join('');

  var html='<div class="fi">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'+
      '<div><h1 style="font:700 20px/1.2 var(--f);color:var(--c9);margin-bottom:4px">目标报表</h1><p style="font:400 13px/1 var(--f);color:var(--c5)">按员工 × 活动 × 目标查看当前有效目标数据</p></div>'+
      '<div style="display:flex;gap:8px"><button class="btn btn-s" onclick="handleExport()">'+I.download+' 导出</button></div>'+
    '</div>'+
    '<div class="fl-bar">'+
      '<div class="fl-search">'+I.search+'<input id="flSearch" placeholder="搜索姓名、工号或目标名称…" value="'+filter.search+'" oninput="onSearch(this.value)"></div>'+
      '<select class="fl-sel" onchange="onCycle(this.value)"><option value="">全部周期</option>'+cycleOptions+'</select>'+
      '<select class="fl-sel" onchange="onActivity(this.value)"><option value="">全部活动</option>'+activityOptions+'</select>'+
      '<select class="fl-sel" onchange="onDept(this.value)"><option value="">全部部门</option>'+deptOptions+'</select>'+
      '<select class="fl-sel" onchange="onType(this.value)">'+typeOptions+'</select>'+
      '<div class="fl-actions"><button class="btn btn-s" onclick="resetFilters()">'+I.x+' 重置</button></div>'+
    '</div>'+
    '<div class="tbl-card">'+
      '<div class="tbl-wrap"><table><thead><tr>'+
        '<th>姓名</th><th>工号</th><th>当前部门</th><th>全路径部门</th><th>二级部门</th><th>三级部门</th><th>四级部门</th><th>五级部门</th><th>六级部门</th><th>七级部门</th><th>八级部门</th><th>人员状态</th><th>用工形式</th><th>划分区域</th><th>岗位</th><th>职级</th><th>入职日期</th><th>周期</th><th>活动名称</th><th>目标名称</th><th>权重</th><th>类型</th><th>衡量标准</th><th>衡量标准-梯度值</th>'+
      '</tr></thead><tbody>';

  for(var i=0;i<page.length;i++){
    var d=page[i];
    html+='<tr>'+
      '<td style="font-weight:500;color:var(--c9)">'+d.name+'</td>'+
      '<td class="mono">'+d.empId+'</td>'+
      '<td>'+d.currentDept+'</td><td class="cell-long">'+d.fullDept+'</td>'+
      '<td>'+d.deptLevel2+'</td><td>'+d.deptLevel3+'</td><td>'+d.deptLevel4+'</td><td>'+d.deptLevel5+'</td><td>'+d.deptLevel6+'</td><td>'+d.deptLevel7+'</td><td>'+d.deptLevel8+'</td>'+
      '<td><span class="tag '+(d.personStatus==='在职'?'tag-em':'tag-c5')+'">'+d.personStatus+'</span></td><td>'+d.employment+'</td><td>'+d.region+'</td><td>'+d.job+'</td><td>'+d.level+'</td><td class="mono">'+d.hireDate+'</td>'+
      '<td>'+d.period+'</td>'+
      '<td class="cell-long">'+d.activity+'</td>'+
      '<td class="cell-long" style="font-weight:500;color:var(--c9)">'+d.goal+'</td>'+
      '<td>'+d.weight+'</td>'+
      '<td><span class="tag '+(d.type==='定量'?'tag-pr':'tag-ac')+'">'+d.type+'</span></td>'+
      '<td>'+d.standard+'</td>'+
      '<td>'+gradientCell(d)+'</td>'+
      '</tr>';
  }

  html+='</tbody></table></div>'+
    '<div class="pg-bar">'+
      '<div class="pg-info"><span>第 '+(total?start+1:0)+'-'+Math.min(start+pageSize,total)+' 条，共 '+total+' 条</span></div>'+
      '<div class="pg-nav">';
  for(var p=1;p<=totalPages;p++){
    html+='<button class="pg-btn'+(p===currentPage?' on':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  }
  html+='</div></div></div></div>';

  document.getElementById('app').innerHTML=html;
}

function onSearch(v){filter.search=v;currentPage=1;render();}
function onCycle(v){filter.cycle=v;currentPage=1;render();}
function onActivity(v){filter.activity=v;currentPage=1;render();}
function onDept(v){filter.dept=v;currentPage=1;render();}
function onType(v){filter.type=v;currentPage=1;render();}
function goPage(p){currentPage=p;render();}
function resetFilters(){filter={search:'',cycle:'',activity:'',dept:'',type:''};currentPage=1;render();}
function handleExport(){alert('导出功能（原型占位）');}

render();
</script>
</body>
</html>
