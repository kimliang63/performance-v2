<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 我的目标</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;--pr900:#1E3A8A;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --vi:#8B5CF6;--vi50:#F5F3FF;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#FAFAF9;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-card-hover:0 8px 20px -4px rgba(0,0,0,.08),0 2px 6px -2px rgba(0,0,0,.04);
  --shadow-dropdown:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);
  --shadow-modal:0 20px 60px -12px rgba(0,0,0,.18),0 4px 16px -4px rgba(0,0,0,.08);
  --r1:6px;--r2:8px;--r3:10px;--r4:14px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}






/* HEADER */
.hdr{height:52px;background:var(--sf);border-bottom:1px solid var(--dv);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:1100}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-i{width:28px;height:28px;border-radius:6px;background:var(--pr);display:flex;align-items:center;justify-content:center}
.logo-i svg{width:15px;height:15px;color:#FFF}
.logo-t{font-size:15px;font-weight:700;color:var(--c9);letter-spacing:-.3px}
.hdr-sep{width:1px;height:20px;background:var(--c2);margin:0 2px}
.breadcrumb{display:flex;align-items:center;gap:4px;font:500 13px/1 var(--f);color:var(--c5)}
.breadcrumb span{cursor:pointer;transition:color .12s}
.breadcrumb span:hover{color:var(--pr)}
.breadcrumb .sep{color:var(--c3);cursor:default}
.breadcrumb .cur{color:var(--c8);font-weight:600;cursor:default}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.flow-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r1);background:var(--pr50);border:1px solid var(--pr200);font:500 12px/1 var(--f);color:var(--pr)}
.flow-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--pr);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Detail card */
.detail-card{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);padding:20px 24px;margin-bottom:16px}
.detail-top{margin-bottom:14px}
.detail-title-row{display:flex;align-items:center;gap:10px}
.detail-title{font:700 20px/1.2 var(--f);color:var(--c9);letter-spacing:-.3px}
.detail-status{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r1);font:500 12px/1 var(--f);border:1px solid transparent;flex-shrink:0;white-space:nowrap}
.detail-status .dot{width:7px;height:7px;border-radius:50%}
.detail-status.submitted{background:var(--pr50);color:var(--pr);border-color:var(--pr200)}
.detail-status.submitted .dot{background:var(--pr);animation:pulse 2s ease-in-out infinite}
.detail-status.approved,.detail-status.effective{background:var(--em50);color:var(--em700);border-color:var(--em100)}
.detail-status.approved .dot,.detail-status.effective .dot{background:var(--em700)}
.detail-status.rejected{background:var(--ro50);color:var(--ro);border-color:var(--ro100)}
.detail-status.rejected .dot{background:var(--ro)}
.detail-title-actions{margin-left:auto;display:flex;align-items:center;gap:0;flex-shrink:0;white-space:nowrap}
.detail-title-actions .sum-item{font:500 13px/1 var(--f);color:var(--c6)}
.detail-title-actions .sum-val{font-family:var(--m);font-weight:700}
.detail-title-actions .sum-val.ok{color:var(--em700)}
.detail-title-actions .sum-val.zero{color:var(--c5)}
.detail-title-actions .sum-val.warn{color:var(--ro)}
.detail-title-actions .sum-goals{font-family:var(--m);font-weight:600;color:var(--c8)}
.detail-title-actions .act-sep{display:inline-block;width:1px;height:12px;background:var(--c3);margin:0 8px;flex-shrink:0;align-self:center}
.detail-title-actions .btn+.btn{margin-left:8px}
.detail-pills{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cycle-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c6);cursor:pointer;transition:all .12s;border:1px solid transparent;background:transparent;font-family:inherit}
.cycle-pill:hover{color:var(--pr);background:var(--pr50)}
.cycle-pill.active{color:var(--pr);background:var(--pr50);border-color:var(--pr);font-weight:500}

/* People split — 一张大卡片，中间竖线隔开人员栏与目标区 */
.goal-split{display:flex;align-items:stretch;gap:0;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r3);box-shadow:var(--shadow-card)}
.people-panel{width:220px;flex-shrink:0;align-self:flex-start;background:transparent;border:0;border-right:1px solid var(--dv);border-radius:0;box-shadow:none;padding:12px 0;position:sticky;top:72px;max-height:calc(100vh - 96px);overflow:auto}
.people-group{padding:4px 0 10px}
.people-group+.people-group{border-top:1px solid var(--dv);padding-top:10px}
.people-group-title{font:600 11px/1 var(--f);color:var(--c5);letter-spacing:.4px;text-transform:uppercase;padding:4px 14px 8px}
.people-item{display:flex;flex-direction:column;gap:3px;padding:8px 14px;cursor:pointer;transition:background .12s;border:0;background:transparent;width:100%;text-align:left;font-family:inherit}
.people-item:hover{background:var(--c0)}
.people-item.active{background:var(--pr50)}
.people-item .p-name{font:600 13px/1.2 var(--f);color:var(--c9)}
.people-item.active .p-name{color:var(--pr)}
.people-item .p-meta{font:400 12px/1.3 var(--f);color:var(--c5)}
.goal-main{flex:1;min-width:0;padding:12px 16px 16px}
.goal-split.panel-collapsed{gap:0}
.goal-split.panel-collapsed .people-panel{display:none;border-right:0}
.viewing-bar{display:flex;align-items:center;gap:8px;padding:4px 4px 12px;margin-bottom:0;background:transparent;border:0;border-radius:0;font:500 13px/1.3 var(--f);color:var(--c8)}
.viewing-bar .vb-text{font:500 13px/1.3 var(--f);color:var(--c8);min-width:0}
.vb-toggle{width:24px;height:24px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--r1);background:transparent;color:var(--c5);cursor:pointer;padding:0;transition:all .12s}
.vb-toggle:hover{background:var(--c1);color:var(--pr)}
.vb-toggle svg{width:14px;height:14px;display:block}
#moduleContainer > .mod-empty{background:transparent;border-radius:0;box-shadow:none;padding:48px 20px}
@media (max-width:900px){
  .detail-title-row{flex-wrap:wrap}
  .detail-title-actions{margin-left:0;width:100%;justify-content:flex-end}
  .goal-split{flex-direction:column}
  .people-panel{width:100%;position:static;max-height:none;display:flex;gap:8px;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--dv);align-self:stretch}
  .people-group{flex:1;border:0;padding:0}
  .people-group+.people-group{border-top:0;border-left:1px solid var(--dv);padding-left:8px}
  .mod-hd{flex-wrap:wrap}
  .mod-hd-title{min-width:120px}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}
.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}
.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}
.btn-o{background:var(--sf);color:var(--pr);border:1px solid var(--pr200)}
.btn-o:hover{background:var(--pr50);border-color:var(--pr)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-sm svg{width:12px;height:12px}

/* MODULE SECTION — 外层已是大卡片：模块不再套圆角边框，板块间用浅分隔线 */
.mod-section{background:transparent;border-radius:0;box-shadow:none;margin-bottom:0;overflow:visible;border:0}
.mod-section+.mod-section{border-top:1px solid var(--dv);margin-top:12px;padding-top:4px}
.mod-section.em{}
.mod-section.ac{}
.mod-section.vi{}
.mod-section.ro{}

.mod-hd{display:flex;align-items:center;padding:14px 4px;cursor:default;user-select:none;gap:12px;background:var(--c0);border-radius:0}
.mod-hd-icon{width:3px;height:14px;border-radius:2px;flex-shrink:0;display:block;padding:0}
.mod-hd-icon svg{display:none}
.mod-hd-title{font:600 16px/1.3 var(--f);color:var(--c5);flex:1;text-transform:uppercase;letter-spacing:.5px}
.mod-hd-stats{display:flex;align-items:center;gap:14px;color:var(--c6)}
.mod-hd-stat{font:600 14px/1 var(--f);color:var(--c8)}
.mod-hd-stat:first-child{font-family:var(--m)}
.mod-hd-sep{width:1px;height:14px;background:var(--c2)}
.mod-hd-add{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r1);font:500 12px/1 var(--f);color:var(--pr);background:transparent;border:1px solid var(--pr200);cursor:pointer;transition:all .12s;font-family:inherit}
.mod-hd-add:hover{background:var(--pr50);border-color:var(--pr)}
.mod-hd-add svg{width:12px;height:12px}

.mod-body{overflow:hidden}
.mod-body.open{max-height:none}

/* GOAL ROW */
.goal-row{border-top:1px solid var(--dv);transition:background .1s}
.goal-row:hover{background:var(--c0)}
.goal-row:last-child{border-bottom:none}

.goal-summary{display:flex;align-items:center;padding:14px 4px;gap:10px;cursor:default}
.goal-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.goal-name{flex:1;font:600 16px/1.3 var(--f);color:var(--c9)}
.goal-weight{font:700 14px/1 var(--m);color:var(--pr);background:var(--pr50);padding:3px 8px;border-radius:var(--r1);flex-shrink:0}
.goal-actions{display:flex;align-items:center;gap:4px}
.goal-act{width:26px;height:26px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c4);background:transparent;border:none;transition:all .12s}
.goal-act:hover{background:var(--c1);color:var(--c7)}
.goal-act.edit:hover{color:var(--pr);background:var(--pr50)}
.goal-act.del:hover{color:var(--ro);background:var(--ro50)}
.goal-act svg{width:14px;height:14px}

/* GOAL EDIT (read-only view) */
.goal-edit{padding:0 4px 16px 42px;display:none}
.goal-edit.open{display:block;animation:fadeIn .2s ease}
.ge-form{padding:12px 0}
.ge-sec{margin-bottom:14px}
.ge-sec:last-child{margin-bottom:0}
.ge-row{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.ge-row.f3{grid-template-columns:repeat(3,max-content) minmax(240px,1fr);align-items:start}
.ge-row .full{grid-column:1/-1}
.ge-fi{display:flex;flex-direction:column;gap:3px}
.ge-fi.inline{flex-direction:row;align-items:flex-start;gap:6px;min-width:0}
.ge-fi.inline .ge-fi-l{white-space:nowrap;flex-shrink:0;line-height:1.4}
.ge-fi.inline .ge-fi-val{line-height:1.4}
.ge-fi.inline .ge-unit{line-height:1.4;padding-top:1px}
.ge-fi-l{font:400 11px/1 var(--f);color:var(--c5)}
.ge-fi-l .req{color:var(--ro);margin-left:2px}
.ge-fi-val{font:500 13px/1.4 var(--f);color:var(--c8)}
.ge-fi.inline .ge-fi-val{padding:0}
.ge-unit{font:400 11px/1 var(--f);color:var(--c5);flex-shrink:0;margin-left:2px}
.ge-desc{white-space:pre-wrap;line-height:1.4}
.ge-fi.inline .ge-desc{padding-top:0}
.mod-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;text-align:center}
.mod-empty svg{width:72px;height:72px;color:var(--c3);flex-shrink:0}
.mod-empty-text{font:400 13px/1.3 var(--f);color:var(--c4)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease forwards}

.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-10px);padding:10px 20px;border-radius:var(--r2);font:500 13px/1 var(--f);background:var(--em);color:#FFF;box-shadow:0 8px 24px rgba(16,185,129,.3);z-index:3000;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Navigation will be injected by navigation.js -->

<div class="ct fade-in">
  <nav style="display:flex;align-items:center;gap:4px;font:500 12px/1 var(--f);color:var(--c5);margin-bottom:12px">
    <a href="../demo-index.html" style="color:var(--c5);text-decoration:none;transition:color .12s" onmouseover="this.style.color='var(--pr)'" onmouseout="this.style.color='var(--c5)'">绩效工作台</a>
    <span style="color:var(--c3)">/</span>
    <span style="color:var(--c8);font-weight:600">我的目标</span>
  </nav>

  <div class="detail-card">
    <div class="detail-top">
      <div class="detail-title-row">
        <span class="detail-title" id="detailTitle">我的目标</span>
        <span class="detail-status submitted" id="detailStatus"><span class="dot"></span>审批中</span>
        <div class="detail-title-actions">
          <span class="sum-val ok" id="sumWeight">100%</span>
          <span class="act-sep" aria-hidden="true"></span>
          <span class="sum-item">总目标数: <span class="sum-goals" id="sumGoals">7</span></span>
          <span class="act-sep" aria-hidden="true"></span>
          <button type="button" class="btn btn-s" onclick="showToast('已撤回')">撤回</button>
          <button type="button" class="btn btn-p" onclick="showToast('进入变更目标')">变更目标</button>
        </div>
      </div>
    </div>
    <div class="detail-pills">
      <select id="yearSelect" style="height:28px;padding:0 24px 0 8px;border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c7);background:var(--sf) url('data:image/svg+xml,%3Csvg width=%2710%27 height=%276%27 viewBox=%270 0 10 6%27 fill=%27none%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cpath d=%27M1 1L5 5L9 1%27 stroke=%27%23A1A1AA%27 stroke-width=%271.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E') no-repeat right 6px center;appearance:none;cursor:pointer;outline:none" onchange="switchYear(this.value)">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
      <span style="color:var(--c3);margin:0 6px">|</span>
      <span id="cyclePills"></span>
    </div>
  </div>

  <div class="goal-split">
    <aside class="people-panel" id="peoplePanel" aria-label="人员切换"></aside>
    <div class="goal-main">
      <div class="viewing-bar">
        <button type="button" class="vb-toggle" id="panelToggle" title="收起" aria-label="收起人员栏" onclick="togglePeoplePanel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="vb-text" id="viewingText">林晓｜产品部｜产品经理</span>
      </div>
      <div id="moduleContainer"></div>
      <div id="approvalLog"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const I={
  drag:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
};

const MODULES=[
  {name:'KPI',weight:30,icon:'target',color:'var(--pr)',accent:'',goals:[
    {id:'g1',name:'资源利用率（通用）',indicator:'资源利用率',type:'quant',weight:5,desc:'1.指标定义：人员的实际工作量饱和情况，数据来源：Devops\n2.计算逻辑：公式=当月实际任务工时（人天）/EHR实际出勤天数*100%',measure:'梯度评分',target:105,challenge:110,baseline:100,unit:'%',rule:'标准梯度计算',ruleFormula:'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))',msLevels:[{level:'优秀',color:'var(--em)',score:'120分',condition:'利用率 >= 110%'},{level:'良好',color:'var(--pr)',score:'100分',condition:'利用率 >= 105%'},{level:'合格',color:'var(--ac)',score:'80分',condition:'利用率 >= 100%'},{level:'不合格',color:'var(--ro)',score:'0分',condition:'利用率 < 100%'}]},
    {id:'g2',name:'HRASUAT用户验收首次通过率(产品)',indicator:'UAT首次通过率',type:'quant',weight:10,desc:'1.指标定义：需求首次业务验收通过的概率\n2.计算逻辑：公式=当月需求首次业务验收通过的迭代数量/当月业务验收的迭代总数*100%',measure:'梯度评分',target:98,challenge:100,baseline:95,unit:'%',rule:'标准梯度计算',ruleFormula:'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))',msLevels:[{level:'优秀',color:'var(--em)',score:'120分',condition:'通过率 >= 100%'},{level:'良好',color:'var(--pr)',score:'100分',condition:'通过率 >= 98%'},{level:'合格',color:'var(--ac)',score:'80分',condition:'通过率 >= 95%'},{level:'不合格',color:'var(--ro)',score:'0分',condition:'通过率 < 95%'}]},
    {id:'g3',name:'HRAS需求评审及时率(产品)',indicator:'需求评审及时率',type:'quant',weight:15,desc:'1.迭代版本评审的及时性情况\n2.计算逻辑：公式=统计周期内按时需求评审迭代数/计划评审迭代*100%\n备注：按需求个数的维度。',measure:'梯度评分',target:98,challenge:100,baseline:95,unit:'%',rule:'标准梯度计算',ruleFormula:'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))',msLevels:[{level:'优秀',color:'var(--em)',score:'120分',condition:'及时率 >= 100%'},{level:'良好',color:'var(--pr)',score:'100分',condition:'及时率 >= 98%'},{level:'合格',color:'var(--ac)',score:'80分',condition:'及时率 >= 95%'},{level:'不合格',color:'var(--ro)',score:'0分',condition:'及时率 < 95%'}]},
  ]},
  {name:'KPA',weight:70,icon:'users',color:'var(--em)',accent:'em',goals:[

const STATUS_CFG={active:{label:'审批中',cls:'submitted'},completed:{label:'已完成',cls:'approved'},rejected:{label:'已驳回',cls:'rejected'}};
const CURRENT_STATUS={status:'active',statusLabel:'审批中'};
/* 有目标可看时才有状态；上级刘VP 空态不塞「暂无」 */
const PERSON_STATUS={
  self:{status:'active'},
  sub1:{status:'active'},
  sub2:{status:'completed'},
  sub3:{status:'active'}
};

const APPROVAL_FLOW=[
  {node:'目标填写',handler:'张明',inTime:'2026-06-15 09:00',outTime:'2026-06-15 09:00',status:'completed',remark:'—'},
  {node:'直线上级审批',handler:'李经理（技术部）',inTime:'2026-06-15 09:00',outTime:'—',status:'active',remark:'当前节点'},
  {node:'间接上级审批',handler:'王总监（产品部）',inTime:'—',outTime:'—',status:'pending',remark:'—'},
  {node:'HR确认',handler:'赵敏',inTime:'—',outTime:'—',status:'pending',remark:'—'},
];

const SELF={id:'self',name:'林晓',dept:'产品部',title:'产品经理'};
const PEOPLE={
  superior:[
    {id:'sup1',name:'刘VP',dept:'产品中心',title:'产品副总裁'},
  ],
  subordinate:[
    {id:'sub1',name:'张明',dept:'产品部',title:'高级产品经理'},
    {id:'sub2',name:'李华',dept:'产品部',title:'产品经理'},
    {id:'sub3',name:'周杰',dept:'研发部',title:'高级工程师'},
  ]
};
let currentPersonId='self';
let peoplePanelOpen=true;
function isSelfView(){return currentPersonId==='self'}
function findPerson(id){
  if(id==='self')return {group:'self',person:SELF};
  for(const g of ['superior','subordinate']){
    const p=PEOPLE[g].find(x=>x.id===id);
    if(p)return {group:g,person:p};
  }
  return null;
}
function personLine(p){return p.name+'｜'+p.dept+'｜'+p.title}
function personMeta(p){return p.dept+'｜'+p.title}
function renderPeople(){
  const el=document.getElementById('peoplePanel');
  if(!el)return;
  let h='<div class="people-group"><button type="button" class="people-item'+(currentPersonId==='self'?' active':'')+'" onclick="selectPerson(\'self\')"><span class="p-name">我的目标</span></button></div>';
  const groups=[{key:'superior',title:'我的上级'},{key:'subordinate',title:'我的团队'}];
  groups.forEach(g=>{
    h+='<div class="people-group"><div class="people-group-title">'+g.title+'</div>';
    PEOPLE[g.key].forEach(p=>{
      h+='<button type="button" class="people-item'+(p.id===currentPersonId?' active':'')+'" onclick="selectPerson(\''+p.id+'\')"><span class="p-name">'+p.name+'</span><span class="p-meta">'+personMeta(p)+'</span></button>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function updateViewingBar(){
  const hit=findPerson(currentPersonId);
  if(!hit)return;
  const vt=document.getElementById('viewingText');
  if(vt)vt.textContent=personLine(hit.person);
}
function updateHeaderTitleStatus(){
  const self=isSelfView();
  const titleEl=document.getElementById('detailTitle');
  if(titleEl)titleEl.textContent=self?'我的目标':'TA人目标';
  const statusEl=document.getElementById('detailStatus');
  if(!statusEl)return;
  const hit=findPerson(currentPersonId);
  const empty=hit&&hit.group==='superior';
  const stKey=(PERSON_STATUS[currentPersonId]||(self?CURRENT_STATUS:null)||{}).status;
  const st=stKey?STATUS_CFG[stKey]:null;
  if(!empty&&st){
    statusEl.className='detail-status '+st.cls;
    statusEl.innerHTML='<span class="dot"></span>'+st.label;
    statusEl.style.display='';
  }else{
    statusEl.style.display='none';
    statusEl.innerHTML='';
  }
}
function selectPerson(id){
  if(!findPerson(id))return;
  currentPersonId=id;
  renderPeople();
  updateViewingBar();
  render();
}
function togglePeoplePanel(){
  peoplePanelOpen=!peoplePanelOpen;
  const split=document.querySelector('.goal-split');
  const btn=document.getElementById('panelToggle');
  if(split)split.classList.toggle('panel-collapsed',!peoplePanelOpen);
  if(btn){
    btn.title=peoplePanelOpen?'收起':'展开';
    btn.setAttribute('aria-label',peoplePanelOpen?'收起人员栏':'展开人员栏');
    btn.innerHTML=peoplePanelOpen
      ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  }
}

function render(){
  updateHeaderTitleStatus();

  const hit=findPerson(currentPersonId);
  const isEmptyView=hit&&hit.group==='superior';

  let count=0,weight=0;
  if(!isEmptyView){
    MODULES.forEach(m=>m.goals.forEach(g=>{count++;weight+=g.weight}));
  }
  const wEl=document.getElementById('sumWeight');
  if(wEl){
    wEl.textContent=weight+'%';
    wEl.className='sum-val '+(weight===100?'ok':weight===0?'zero':'warn');
  }
  const gEl=document.getElementById('sumGoals');
  if(gEl)gEl.textContent=count;

  if(isEmptyView){
    document.getElementById('moduleContainer').innerHTML=`<div class="mod-empty">
      <svg viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect x="18" y="14" width="36" height="46" rx="4" stroke="currentColor" stroke-width="2"/>
        <path d="M26 26h20M26 34h20M26 42h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="48" cy="50" r="12" fill="var(--sf)" stroke="currentColor" stroke-width="2"/>
        <circle cx="48" cy="50" r="7" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="48" cy="50" r="2.5" fill="currentColor"/>
      </svg>
      <div class="mod-empty-text">暂无目标</div>
    </div>`;
    document.getElementById('approvalLog').innerHTML='';
    return;
  }

  // Approval flow
  const statusBadge={
    active:'<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r1);font:500 11px/1 var(--f);background:var(--pr50);color:var(--pr)"><span style="width:6px;height:6px;border-radius:50%;background:var(--pr);animation:pulse 2s ease-in-out infinite"></span>处理中</span>',
    completed:'<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r1);font:500 11px/1 var(--f);background:var(--em50);color:var(--em700)"><span style="width:6px;height:6px;border-radius:50%;background:var(--em)"></span>已完成</span>',
    pending:'<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r1);font:500 11px/1 var(--f);background:var(--c1);color:var(--c5)">待处理</span>',
    rejected:'<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r1);font:500 11px/1 var(--f);background:var(--ro50);color:var(--ro)"><span style="width:6px;height:6px;border-radius:50%;background:var(--ro)"></span>已驳回</span>'
  };

  let approvalHtml=`<div style="background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);margin-bottom:24px;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--dv);display:flex;align-items:center;justify-content:space-between">
      <span style="font:600 15px/1 var(--f);color:var(--c9)">审批流程</span>
    </div>
    <div style="padding:0">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:var(--c0)">
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">节点</th>
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">处理人</th>
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">流入时间</th>
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">流出时间</th>
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">状态</th>
            <th style="padding:10px 16px;font:600 11px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv);text-transform:uppercase;letter-spacing:.5px">原因/备注</th>
          </tr>
        </thead>
        <tbody>`;

  APPROVAL_FLOW.forEach((f,i)=>{
    const isLast=i===APPROVAL_FLOW.length-1;
    const rowBg=f.status==='active'?'background:var(--pr50)':'';
    approvalHtml+=`<tr style="${rowBg}">
      <td style="padding:12px 16px;font:500 13px/1.4 var(--f);color:${f.status==='pending'?'var(--c6)':'var(--c8)'};border-bottom:${isLast?'none':'1px solid var(--dv)'}">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:${f.status==='active'?'var(--pr)':f.status==='pending'?'var(--c3)':f.status==='rejected'?'var(--ro)':'var(--em)'};flex-shrink:0"></span>
          ${f.node}
        </div>
      </td>
      <td style="padding:12px 16px;border-bottom:${isLast?'none':'1px solid var(--dv)'}">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="width:22px;height:22px;border-radius:50%;background:${f.status==='pending'?'var(--c1)':'var(--pr)'};display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--f);color:${f.status==='pending'?'var(--c5)':'#FFF'};flex-shrink:0">${f.handler.charAt(0)}</span>
          <span style="font:400 13px/1 var(--f);color:${f.status==='pending'?'var(--c6)':'var(--c8)'}">${f.handler}</span>
        </div>
      </td>
      <td style="padding:12px 16px;font:400 13px/1 var(--f);color:${f.inTime==='—'?'var(--c4)':'var(--c7)'};border-bottom:${isLast?'none':'1px solid var(--dv)'}">${f.inTime}</td>
      <td style="padding:12px 16px;font:400 13px/1 var(--f);color:${f.outTime==='—'?'var(--c4)':'var(--c7)'};border-bottom:${isLast?'none':'1px solid var(--dv)'}">${f.outTime}</td>
      <td style="padding:12px 16px;border-bottom:${isLast?'none':'1px solid var(--dv)'}">${statusBadge[f.status]||''}</td>
      <td style="padding:12px 16px;font:400 13px/1 var(--f);color:${f.remark==='—'?'var(--c4)':'var(--c5)'};border-bottom:${isLast?'none':'1px solid var(--dv)'}">${f.remark}</td>
    </tr>`;
  });
  approvalHtml+=`</tbody></table></div></div>`;
  document.getElementById('approvalLog').innerHTML=approvalHtml;

  // Module + goals（全部展开，不可收起）
  let h='';
  MODULES.forEach((m,mi)=>{
    const tw=m.goals.reduce((s,g)=>s+g.weight,0);
    h+=`<div class="mod-section ${m.accent}">
      <div class="mod-hd">
        <div class="mod-hd-icon" style="background:${m.color}" aria-hidden="true"></div>
        <div class="mod-hd-title">${m.name}</div>
        <div class="mod-hd-stats">
          <span class="mod-hd-stat">${tw}%</span>
          <span class="mod-hd-stat">${m.goals.length} 个目标</span>
        </div>
      </div>
      <div class="mod-body open">`;
    m.goals.forEach((g,gi)=>{
      const isQ=g.type==='quant';
      h+=`<div class="goal-row">
        <div class="goal-summary">
          <div class="goal-icon" style="background:var(--pr50);color:var(--pr);font:700 12px/1 var(--m)">${gi+1}</div>
          <span class="goal-name">${g.name}</span>
          <span class="goal-weight">${g.weight}%</span>
        </div>
        <div class="goal-edit open">
          <div class="ge-form">
            ${isQ?`
            <div class="ge-sec">
              <div class="ge-row f3">
                <div class="ge-fi inline"><span class="ge-fi-l">挑战值：</span><span class="ge-fi-val" style="font-family:var(--m)">${g.challenge}</span><span class="ge-unit">${g.unit||''}</span></div>
                <div class="ge-fi inline"><span class="ge-fi-l">目标值 <span class="req">*</span>：</span><span class="ge-fi-val" style="font-family:var(--m)">${g.target}</span><span class="ge-unit">${g.unit||''}</span></div>
                <div class="ge-fi inline"><span class="ge-fi-l">保底值：</span><span class="ge-fi-val" style="font-family:var(--m)">${g.baseline}</span><span class="ge-unit">${g.unit||''}</span></div>
                <div class="ge-fi inline"><span class="ge-fi-l">指标描述：</span><span class="ge-fi-val ge-desc">${g.desc||'—'}</span></div>
              </div>
            </div>
            `:`
            <div class="ge-sec">
              ${(g.msLevels&&g.msLevels.length?g.msLevels:[{level:'衡量标准',condition:g.desc||'—'}]).map(function(lv,li){
                return '<div class="ge-fi"'+(li?' style="margin-top:10px"':'')+'><span class="ge-fi-l">'+lv.level+(li===1?' <span class="req">*</span>':'')+'</span><span class="ge-fi-val ge-desc">'+(lv.condition||'—')+'</span></div>';
              }).join('')}
              ${g.desc?`<div class="ge-fi" style="margin-top:10px"><span class="ge-fi-l">指标描述：</span><span class="ge-fi-val ge-desc">${g.desc}</span></div>`:''}
            </div>
            `}
          </div>
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('moduleContainer').innerHTML=h;
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

renderPeople();
updateViewingBar();
render();

var currentYear='2026',currentCycle='2026-06';
var CYCLES_BY_YEAR={
  '2026':[{v:'2026-06',t:'6月'},{v:'2026-05',t:'5月'},{v:'2026-04',t:'4月'},{v:'2026-03',t:'3月'},{v:'2026-02',t:'2月'},{v:'2026-01',t:'1月'},{v:'2026-Q2',t:'Q2'},{v:'2026-Q1',t:'Q1'},{v:'2026-H1',t:'H1'},{v:'2026',t:'全年'}],
  '2025':[{v:'2025-12',t:'12月'},{v:'2025-11',t:'11月'},{v:'2025-10',t:'10月'},{v:'2025-09',t:'9月'},{v:'2025-08',t:'8月'},{v:'2025-07',t:'7月'},{v:'2025-06',t:'6月'},{v:'2025-05',t:'5月'},{v:'2025-04',t:'4月'},{v:'2025-03',t:'3月'},{v:'2025-02',t:'2月'},{v:'2025-01',t:'1月'},{v:'2025-Q4',t:'Q4'},{v:'2025-Q3',t:'Q3'},{v:'2025-Q2',t:'Q2'},{v:'2025-Q1',t:'Q1'},{v:'2025-H2',t:'H2'},{v:'2025-H1',t:'H1'},{v:'2025',t:'全年'}],
  '2024':[{v:'2024-12',t:'12月'},{v:'2024-11',t:'11月'},{v:'2024-10',t:'10月'},{v:'2024-Q4',t:'Q4'},{v:'2024-Q3',t:'Q3'},{v:'2024-Q2',t:'Q2'},{v:'2024-Q1',t:'Q1'},{v:'2024-H2',t:'H2'},{v:'2024-H1',t:'H1'},{v:'2024',t:'全年'}]
};
var CYCLE_LABELS={};
['2026','2025','2024'].forEach(function(yr){
  CYCLES_BY_YEAR[yr].forEach(function(c){CYCLE_LABELS[c.v]=yr+'年'+c.t;});
});
CYCLE_LABELS['2026-06']='2026年6月';CYCLE_LABELS['2026-05']='2026年5月';CYCLE_LABELS['2026-04']='2026年4月';
CYCLE_LABELS['2026-03']='2026年3月';CYCLE_LABELS['2026-02']='2026年2月';CYCLE_LABELS['2026-01']='2026年1月';
CYCLE_LABELS['2026-Q2']='2026年Q2';CYCLE_LABELS['2026-Q1']='2026年Q1';CYCLE_LABELS['2026-H1']='2026年H1';CYCLE_LABELS['2026']='2026年度';

function switchYear(yr){
  currentYear=yr;
  var cycles=CYCLES_BY_YEAR[yr]||[];
  currentCycle=cycles[0].v;
  switchCycle(currentCycle);
  renderPills();
}

function renderPills(){
  var cycles=CYCLES_BY_YEAR[currentYear]||[];
  var h='';
  for(var i=0;i<cycles.length;i++){
    var c=cycles[i];
    var active=c.v===currentCycle?' active':'';
    h+='<span class="cycle-pill'+active+'" onclick="switchCycle(\''+c.v+'\',this)">'+c.t+'</span>';
    if(i<cycles.length-1&&c.t.indexOf('月')>=0&&cycles[i+1]&&cycles[i+1].t.indexOf('月')<0)h+='<span style="color:var(--c3);margin:0 2px">|</span>';
  }
  document.getElementById('cyclePills').innerHTML=h;
}

function switchCycle(val,el){
  currentCycle=val;
  var pills=document.querySelectorAll('.cycle-pill');
  for(var i=0;i<pills.length;i++)pills[i].classList.remove('active');
  if(el)el.classList.add('active');
}

renderPills();
