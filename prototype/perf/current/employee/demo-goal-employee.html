<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 目标制定·填写</title>
<link rel="stylesheet" href="../shared/ai-form-assistant.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;--pr900:#1E3A8A;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --vi:#8B5CF6;--vi50:#F5F3FF;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#FAFAF9;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-card-hover:0 8px 20px -4px rgba(0,0,0,.08),0 2px 6px -2px rgba(0,0,0,.04);
  --shadow-dropdown:0 10px 40px -10px rgba(0,0,0,.12),0 2px 10px -2px rgba(0,0,0,.04);
  --shadow-modal:0 20px 60px -12px rgba(0,0,0,.18),0 4px 16px -4px rgba(0,0,0,.08);
  --r1:6px;--r2:8px;--r3:10px;--r4:14px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

/* ═══ HEADER ═══ */
.hdr{height:52px;background:var(--sf);border-bottom:1px solid var(--dv);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:1100}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-i{width:28px;height:28px;border-radius:6px;background:var(--pr);display:flex;align-items:center;justify-content:center}
.logo-i svg{width:15px;height:15px;color:#FFF}
.logo-t{font-size:15px;font-weight:700;color:var(--c9);letter-spacing:-.3px}
.hdr-sep{width:1px;height:20px;background:var(--c2);margin:0 2px}
.breadcrumb{display:flex;align-items:center;gap:4px;font:500 13px/1 var(--f);color:var(--c5)}
.breadcrumb span{cursor:pointer;transition:color .12s}
.breadcrumb span:hover{color:var(--pr)}
.breadcrumb .sep{color:var(--c3);cursor:default}
.breadcrumb .cur{color:var(--c8);font-weight:600;cursor:default}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.flow-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r1);background:var(--pr50);border:1px solid var(--pr200);font:500 12px/1 var(--f);color:var(--pr)}
.flow-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--pr);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Page header — aligned with demo-workbench-my-goal.html detail-card */
.detail-card{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);padding:20px 24px;margin-bottom:16px;position:sticky;top:-24px;z-index:900}
.detail-top{margin-bottom:14px}
.detail-title-row{display:flex;align-items:center;gap:10px}
.detail-title{font:700 20px/1.2 var(--f);color:var(--c9);letter-spacing:-.3px}
.detail-status{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r1);font:500 12px/1 var(--f);border:1px solid transparent;flex-shrink:0;white-space:nowrap}
.detail-status .dot{width:7px;height:7px;border-radius:50%}
.detail-status.submitted{background:var(--pr50);color:var(--pr);border-color:var(--pr200)}
.detail-status.submitted .dot{background:var(--pr);animation:pulse 2s ease-in-out infinite}
.detail-status.effective{background:var(--em50);color:var(--em700);border-color:var(--em100)}
.detail-status.effective .dot{background:var(--em700)}
.detail-title-actions{margin-left:auto;display:flex;align-items:center;gap:0;flex-shrink:0;white-space:nowrap}
.detail-title-actions .autosave-hint,
.detail-title-actions .sum-item{font:500 13px/1 var(--f);color:var(--c6)}
.autosave-hint{font:400 12px/1 var(--f);color:var(--c5);white-space:nowrap}
.detail-title-actions .autosave-hint{font:400 12px/1 var(--f);color:var(--c5)}
.detail-title-actions .sum-val{font-family:var(--m);font-weight:700}
.detail-title-actions .sum-val.ok{color:var(--em700)}
.detail-title-actions .sum-val.zero{color:var(--c5)}
.detail-title-actions .sum-val.warn{color:var(--ro)}
.detail-title-actions .sum-goals{font-family:var(--m);font-weight:600;color:var(--c8)}
.detail-title-actions .act-sep{display:inline-block;width:1px;height:12px;background:var(--c3);margin:0 8px;flex-shrink:0;align-self:center}
.detail-pills{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cycle-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c6);cursor:pointer;transition:all .12s;border:1px solid transparent;background:transparent;font-family:inherit}
.cycle-pill:hover{color:var(--pr);background:var(--pr50)}
.cycle-pill.active{color:var(--pr);background:var(--pr50);border-color:var(--pr);font-weight:500}
.page-crumb{display:flex;align-items:center;gap:4px;font:500 12px/1 var(--f);color:var(--c5);margin-bottom:12px}
.page-crumb a{color:var(--c5);text-decoration:none;transition:color .12s}
.page-crumb a:hover{color:var(--pr)}
.page-crumb .sep{color:var(--c3)}
.page-crumb .cur{color:var(--c8);font-weight:600}

/* People split — 一张大卡片，中间竖线隔开人员栏与目标区 */
.goal-split{display:flex;align-items:stretch;gap:0;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r3);box-shadow:var(--shadow-card)}
.people-panel{width:220px;flex-shrink:0;align-self:flex-start;background:transparent;border:0;border-right:1px solid var(--dv);border-radius:0;box-shadow:none;padding:12px 0;position:sticky;top:72px;max-height:calc(100vh - 96px);overflow:auto}
.people-group{padding:4px 0 10px}
.people-group+.people-group{border-top:1px solid var(--dv);padding-top:10px}
.people-group-title{font:600 11px/1 var(--f);color:var(--c5);letter-spacing:.4px;text-transform:uppercase;padding:4px 14px 8px}
.people-item{display:flex;flex-direction:column;gap:3px;padding:8px 14px;cursor:pointer;transition:background .12s;border:0;background:transparent;width:100%;text-align:left;font-family:inherit}
.people-item:hover{background:var(--c0)}
.people-item.active{background:var(--pr50)}
.people-item .p-name{font:600 13px/1.2 var(--f);color:var(--c9)}
.people-item.active .p-name{color:var(--pr)}
.people-item .p-meta{font:400 12px/1.3 var(--f);color:var(--c5)}
.goal-main{flex:1;min-width:0;padding:12px 16px 16px}
.goal-split.panel-collapsed{gap:0}
.goal-split.panel-collapsed .people-panel{display:none;border-right:0}
.viewing-bar{display:flex;align-items:center;gap:8px;padding:4px 4px 12px;margin-bottom:0;background:transparent;border:0;border-radius:0;font:500 13px/1.3 var(--f);color:var(--c8)}
.viewing-bar .vb-text{font:500 13px/1.3 var(--f);color:var(--c8);min-width:0}
.vb-toggle{width:24px;height:24px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--r1);background:transparent;color:var(--c5);cursor:pointer;padding:0;transition:all .12s}
.vb-toggle:hover{background:var(--c1);color:var(--pr)}
.vb-toggle svg{width:14px;height:14px;display:block}
#moduleContainer > .mod-empty{background:transparent;border-radius:0;box-shadow:none;padding:48px 20px}
.ge-unit{font:400 11px/1 var(--f);color:var(--c5);flex-shrink:0;margin-left:2px}
.ge-desc{white-space:pre-wrap;line-height:1.4}
.ge-fi.inline .ge-desc{padding-top:0}
.ge-fi.inline .ge-fi-val{padding:0;line-height:1.4}

/* ═══ MODULE SECTION ═══ */
/* 外层已是大卡片：模块不再套圆角边框，板块间用浅分隔线区分 */
.mod-section{background:transparent;border-radius:0;box-shadow:none;margin-bottom:0;overflow:visible;border:0}
.mod-section+.mod-section{border-top:1px solid var(--dv);margin-top:12px;padding-top:4px}
.mod-section.em{}
.mod-section.ac{}
.mod-section.vi{}
.mod-section.ro{}

.mod-hd{position:sticky;top:calc(var(--page-action-h,56px) - 16px);z-index:2;display:flex;align-items:center;padding:14px 4px;cursor:default;user-select:none;transition:box-shadow .12s;gap:12px;background:var(--c0);border-radius:0}
.mod-hd.is-stuck{box-shadow:0 4px 12px rgba(0,0,0,.08);border-bottom:1px solid var(--c2)}
.mod-hd-icon{width:3px;height:14px;border-radius:2px;flex-shrink:0;display:block;padding:0}
.mod-hd-icon svg{display:none}
.mod-hd-title{font:600 16px/1.3 var(--f);color:var(--c5);flex:1;text-transform:uppercase;letter-spacing:.5px}
.mod-hd-stats{display:flex;align-items:center;gap:14px;color:var(--c6)}
.mod-hd-stat{font:600 14px/1 var(--f);color:var(--c8)}
.mod-hd-stat:first-child{font-family:var(--m)}
.mod-hd-sep{width:1px;height:14px;background:var(--c2)}
.mod-hd-add{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r1);font:500 12px/1 var(--f);color:var(--pr);background:transparent;border:1px solid var(--pr200);cursor:pointer;transition:all .12s;font-family:inherit}
.mod-hd-add:hover{background:var(--pr50);border-color:var(--pr)}
.mod-hd-add svg{width:12px;height:12px}
.mod-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.mod-body.open{max-height:10000px}
.mod-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;text-align:center}
.mod-empty svg{width:72px;height:72px;color:var(--c3);flex-shrink:0}
.mod-empty-text{font:400 13px/1.3 var(--f);color:var(--c4)}

/* ═══ GOAL ROW ═══ */
.goal-row{position:relative;z-index:0;border-top:1px solid var(--dv);transition:background .1s}
.goal-row:hover{background:var(--c0)}
.goal-row:last-child{border-bottom:none}

.goal-summary{position:relative;z-index:0;display:flex;align-items:center;padding:14px 4px;gap:10px;cursor:default}
.goal-drag{color:var(--c3);cursor:grab;flex-shrink:0;display:flex;align-items:center;user-select:none}
.goal-drag:active{cursor:grabbing;color:var(--pr)}
.goal-drag svg{width:14px;height:14px}
.goal-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.goal-icon svg{width:14px;height:14px}
.goal-icon.pr{background:var(--pr50);color:var(--pr)}
.goal-icon.em{background:var(--em50);color:var(--em)}
.goal-icon.vi{background:var(--vi50);color:var(--vi)}
.goal-icon.ac{background:var(--ac50);color:var(--ac)}
.goal-icon.filled{background:var(--em50);color:var(--em)}
.goal-icon.pending{background:var(--ac50);color:var(--ac)}
.goal-name{flex:1;font:600 16px/1.3 var(--f);color:var(--c9)}
.goal-name-input{flex:1;padding:6px 10px;border:1px solid var(--pr);border-radius:var(--r1);font:600 16px/1.4 var(--f);color:var(--c9);background:var(--sf);outline:none;box-shadow:0 0 0 2px var(--pr50)}
.goal-name-input[readonly]{border-color:var(--c2);background:var(--c0);box-shadow:none;color:var(--c7);cursor:not-allowed}
.goal-name-input.inp-err{border-color:var(--ro);box-shadow:0 0 0 2px var(--ro50)}
.goal-meta{display:flex;align-items:center;gap:10px;flex-shrink:0}
.goal-type{font:500 11px/1 var(--f);padding:2px 7px;border-radius:3px;background:var(--c1);color:var(--c6)}
.goal-type.quant{background:var(--pr50);color:var(--pr)}
.goal-type.qual{background:var(--vi50);color:var(--vi)}
.goal-weight{font:700 14px/1 var(--m);color:var(--pr);background:var(--pr50);padding:3px 8px;border-radius:var(--r1);flex-shrink:0}
.goal-dir-icon{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.goal-dir-icon svg{width:16px;height:16px;display:block}
.goal-dir-icon.qual{color:var(--c5)}
.goal-dir-icon.pos{color:var(--em)}
.goal-dir-icon.neg{color:var(--ro)}
.goal-actions{display:flex;align-items:center;gap:4px}
.goal-act{width:26px;height:26px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c4);background:transparent;border:none;transition:all .12s}
.goal-act:hover{background:var(--c1);color:var(--c7)}
.goal-act.edit:hover{color:var(--pr);background:var(--pr50)}
.goal-act.del:hover{color:var(--ro);background:var(--ro50)}
.goal-act svg{width:14px;height:14px}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}
.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}
.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}
.btn-o{background:var(--sf);color:var(--pr);border:1px solid var(--pr200)}
.btn-o:hover{background:var(--pr50);border-color:var(--pr)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-sm svg{width:12px;height:12px}

/* ═══ ACTION BAR ═══ */
.action-bar{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--dv);box-shadow:0 -4px 12px rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:1000}
.action-bar-l{display:flex;align-items:center;gap:16px}
.action-bar-r{display:flex;align-items:center;gap:10px}
.weight-total{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--f);color:var(--c6)}
.weight-total .v{font-family:var(--m);font-weight:700;font-size:16px}
.weight-total .v.ok{color:var(--em700)}
.weight-total .v.err{color:var(--ro)}
.goal-total{font:400 13px/1 var(--f);color:var(--c5)}

/* ═══ INLINE EDIT FORM ═══ */
.goal-edit{padding:0 20px 16px 82px;display:none}
.goal-edit.open{display:block;animation:fadeIn .2s ease}
.goal-row.qual.is-open .goal-summary{padding-bottom:6px}
.goal-edit.qual .ge-form{padding-top:0}
.ge-form{padding:12px 0}
.ge-sec{margin-bottom:14px}
.ge-sec:last-child{margin-bottom:0}
.ge-sec-title{font:600 12px/1 var(--f);color:var(--c8);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ge-sec-title::before{content:'';width:3px;height:12px;background:var(--pr);border-radius:2px;flex-shrink:0}
.ge-sec-title svg{width:13px;height:13px;color:var(--pr)}
.ge-row{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.ge-row.f3{grid-template-columns:100px 100px 100px}
.ge-row .full{grid-column:1/-1}
.ge-fi{display:flex;flex-direction:column;gap:3px}
.ge-fi.inline{flex-direction:row;align-items:center;gap:6px;min-width:0}
.ge-fi.inline .ge-fi-l{white-space:nowrap;flex-shrink:0}
.ge-inline-control{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.ge-num-field .ge-inline-control{flex:0 0 auto}
.ge-num-field .inp{width:72px;flex:0 0 72px}
.ge-rule-field .ge-inline-control{min-width:180px}
.ge-rule-value{min-width:0;font:400 12px/1.4 var(--f);color:var(--c6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ge-fi-l{font:400 11px/1 var(--f);color:var(--c5);display:flex;align-items:center;gap:4px}
.ge-fi-l .req{color:var(--ro);margin-left:2px}
.ge-fi-val{font:500 13px/1.4 var(--f);color:var(--c8);padding:7px 0}
.ai-tag{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font:500 9px/1 var(--f);background:linear-gradient(135deg,#8B5CF6 0%,#6366F1 100%);color:#FFF;flex-shrink:0}
.ai-tag svg{width:8px;height:8px}
.inp{width:100%;padding:7px 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c9);background:var(--sf);transition:all .12s;outline:none}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr50)}
.inp.num{font-family:var(--m);text-align:right}
select.inp{-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;padding-right:22px;cursor:pointer}
textarea.inp{min-height:60px;resize:vertical;font-family:var(--f);line-height:1.5}
.ge-linked{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--pr50);border:1px solid var(--pr200);border-radius:var(--r1);font:500 12px/1 var(--f);color:var(--pr)}
.ge-linked svg{width:12px;height:12px;flex-shrink:0}
.ge-linked-btn{margin-left:auto;font:500 10px/1 var(--f);color:var(--c5);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;transition:all .12s}
.ge-linked-btn:hover{color:var(--ro);background:var(--ro50)}

/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--sf);border-radius:var(--r4);box-shadow:var(--shadow-modal);width:700px;max-height:80vh;display:flex;flex-direction:column;transform:scale(.96);transition:transform .2s ease}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--dv)}
.modal-title{font:600 16px/1 var(--f);color:var(--c9)}
.modal-close{width:28px;height:28px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c4);background:transparent;border:none;transition:all .12s}
.modal-close:hover{background:var(--c1);color:var(--c7)}
.modal-close svg{width:16px;height:16px}
.modal-body{flex:1;overflow-y:auto;padding:16px 24px}
.modal-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--dv)}
.modal-footer-l{font:400 12px/1 var(--f);color:var(--c5)}

.hist-tbl{width:100%;border-collapse:collapse}
.hist-tbl th{background:var(--c0);padding:8px 12px;font:500 12px/1 var(--f);color:var(--c5);text-align:left;border-bottom:1px solid var(--dv)}
.hist-tbl th:first-child{width:40px;text-align:center}
.hist-tbl td{padding:10px 12px;font:400 13px/1.4 var(--f);color:var(--c7);border-bottom:1px solid var(--dv)}
.hist-tbl td:first-child{text-align:center}
.hist-tbl tr:last-child td{border-bottom:none}
.hist-tbl tr:hover td{background:var(--pr50)}

.chk{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--c3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.chk.on{background:var(--pr);border-color:var(--pr)}
.chk svg{width:10px;height:10px;color:#FFF;display:none}
.chk.on svg{display:block}

/* Picker */
.picker-list{border:1px solid var(--c2);border-radius:var(--r2);max-height:360px;overflow-y:auto}
.picker-item{padding:10px 14px;border-bottom:1px solid var(--dv);cursor:pointer;transition:background .12s}
.picker-item:last-child{border-bottom:none}
.picker-item:hover{background:var(--pr50)}
.picker-item.selected{background:var(--pr50);border-left:3px solid var(--pr)}
.picker-item-name{font:500 13px/1.3 var(--f);color:var(--c8);margin-bottom:3px}
.picker-item-desc{font:400 11px/1.4 var(--f);color:var(--c5)}
.picker-item-preview{margin-top:6px;padding:6px 8px;background:var(--c0);border-radius:var(--r1);font:400 11px/1.4 var(--m);color:var(--c6);border:1px solid var(--c2)}

/* ═══ WEIGHT VALIDATION ═══ */
.wt-err{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--f);color:var(--ro);background:var(--ro50);padding:3px 8px;border-radius:3px;margin-left:8px;animation:fadeIn .2s ease}
.wt-err svg{width:12px;height:12px;flex-shrink:0}
.mod-hd-stats .wt-err{margin-left:0}
.sum-val.warn{color:var(--ro)}
.sum-err{display:flex;align-items:center;gap:6px;font:400 12px/1 var(--f);color:var(--ro);margin-top:8px;padding:8px 12px;background:var(--ro50);border-radius:var(--r1);border:1px solid var(--ro100)}
.sum-err svg{width:14px;height:14px;flex-shrink:0}
.validate-toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ro);color:#FFF;padding:10px 20px;border-radius:var(--r2);font:500 13px/1 var(--f);box-shadow:0 8px 24px rgba(244,63,94,.3);z-index:3000;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:center;gap:8px}
.validate-toast.show{opacity:1;pointer-events:all}
.validate-toast svg{width:16px;height:16px}
.validate-toast.success{background:var(--em);box-shadow:0 8px 24px rgba(16,185,129,.3)}
.validate-toast.warn{background:var(--ac);box-shadow:0 8px 24px rgba(245,158,11,.3)}
.inp-err{border-color:var(--ro)!important;box-shadow:0 0 0 2px var(--ro50)!important}

/* ═══ CONFIRM MODAL ═══ */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.open{opacity:1;pointer-events:all}
.confirm-box{background:var(--sf);border-radius:var(--r4);box-shadow:var(--shadow-modal);width:380px;padding:24px;transform:scale(.96);transition:transform .2s ease}
.confirm-overlay.open .confirm-box{transform:scale(1)}
.confirm-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.confirm-icon.warn{background:var(--ac50);color:var(--ac)}
.confirm-icon.danger{background:var(--ro50);color:var(--ro)}
.confirm-icon svg{width:20px;height:20px}
.confirm-title{font:600 15px/1.3 var(--f);color:var(--c9);margin-bottom:6px}
.confirm-desc{font:400 13px/1.5 var(--f);color:var(--c6);margin-bottom:20px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px}

/* ═══ CREATE GOAL ═══ */
.create-grid{display:grid;grid-template-columns:1fr 160px;gap:14px 16px}
.create-grid.three{grid-template-columns:repeat(3,1fr)}
.create-grid .full{grid-column:1/-1}
.create-field{display:flex;flex-direction:column;gap:6px}
.create-field label{font:500 12px/1 var(--f);color:var(--c6)}
.create-field label .req{color:var(--ro)}
.create-help{font:400 12px/1.5 var(--f);color:var(--c5);padding:10px 12px;background:var(--pr50);border:1px solid var(--pr100);border-radius:var(--r1);margin-bottom:14px}

@media (max-width:900px){
  .detail-title-row{flex-wrap:wrap}
  .detail-title-actions{margin-left:0;width:100%;justify-content:flex-end}
  .goal-split{flex-direction:column}
  .people-panel{width:100%;position:static;max-height:none;display:flex;gap:8px;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--dv);align-self:stretch}
  .people-group{flex:1;border:0;padding:0}
  .people-group+.people-group{border-top:0;border-left:1px solid var(--dv);padding-left:8px}
  .mod-hd{flex-wrap:wrap}
  .mod-hd-title{min-width:120px}
  .create-grid,.create-grid.three{grid-template-columns:1fr}
  .create-grid .full{grid-column:auto}
}

/* ═══ TOOLTIP ═══ */
.field-tip{position:relative;display:inline-flex;align-items:center;margin-left:4px;cursor:help}
.field-tip-icon{width:14px;height:14px;border-radius:50%;background:var(--c2);color:var(--c5);display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--f);flex-shrink:0;transition:all .12s}
.field-tip:hover .field-tip-icon{background:var(--pr200);color:var(--pr)}
.field-tip-text{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--c8);color:#FFF;font:400 11px/1.4 var(--f);padding:6px 10px;border-radius:var(--r1);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100}
.field-tip-text::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--c8)}
.field-tip:hover .field-tip-text{opacity:1}

/* ═══ GLOBE / LANG ═══ */
.field-with-lang{position:relative}
.field-with-lang .inp{padding-right:28px}
.field-with-lang .inp[readonly]{background:var(--c0);color:var(--c6);cursor:default}
.lang-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c4);background:transparent;border:1px solid transparent;transition:all .12s;padding:0}
.lang-btn:hover{color:var(--pr);background:var(--pr50);border-color:var(--pr200)}
.lang-btn.has{color:var(--pr);background:var(--pr50)}
.lang-btn svg{width:14px;height:14px}

/* ═══ KPI PICKER ═══ */
.kpi-cat-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.kpi-cat{padding:4px 10px;border-radius:var(--r1);font:500 12px/1 var(--f);color:var(--c6);background:var(--c1);cursor:pointer;border:1px solid transparent;transition:all .12s}
.kpi-cat.on{background:var(--pr50);color:var(--pr);border-color:var(--pr200)}
.kpi-card{padding:12px 14px;border:1px solid var(--c2);border-radius:var(--r2);cursor:pointer;transition:all .12s;margin-bottom:8px}
.kpi-card:hover{border-color:var(--pr200);background:var(--pr50)}
.kpi-card.selected{border-color:var(--pr);background:var(--pr50);box-shadow:0 0 0 2px var(--pr100)}
.kpi-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kpi-card-name{font:500 13px/1.3 var(--f);color:var(--c8)}
.kpi-card-cat{font:400 11px/1 var(--f);color:var(--c5);padding:1px 6px;background:var(--c1);border-radius:3px}
.kpi-card-desc{font:400 12px/1.4 var(--f);color:var(--c5);margin-bottom:8px}
.kpi-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.kpi-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font:400 10px/1 var(--f)}
.kpi-tag.type{background:var(--pr50);color:var(--pr)}
.kpi-tag.nature{background:var(--vi50);color:var(--vi)}
.kpi-tag.unit{background:var(--ac50);color:var(--ac700)}
.kpi-tag.rule{background:var(--c1);color:var(--c6)}
.kpi-card-dept{display:flex;align-items:center;gap:4px;font:400 11px/1 var(--f);color:var(--c5)}
.kpi-card-dept svg{width:12px;height:12px;color:var(--c4)}

/* KPI Detail Panel */
.kpi-detail{background:var(--c0);border:1px solid var(--c2);border-radius:var(--r2);padding:14px;margin-top:12px;animation:fadeIn .2s ease}
.kpi-detail-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-detail-name{font:600 14px/1.3 var(--f);color:var(--c9)}
.kpi-detail-close{width:24px;height:24px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c4);background:transparent;border:none;transition:all .12s}
.kpi-detail-close:hover{background:var(--c1);color:var(--c7)}
.kpi-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:10px}
.kpi-detail-item{display:flex;flex-direction:column;gap:2px}
.kpi-detail-label{font:400 10px/1 var(--f);color:var(--c4);text-transform:uppercase;letter-spacing:.5px}
.kpi-detail-value{font:400 12px/1.3 var(--f);color:var(--c7)}
.kpi-detail-desc{font:400 12px/1.5 var(--f);color:var(--c6);padding-top:8px;border-top:1px solid var(--dv)}
.kpi-cat-count{font:400 10px/1 var(--f);color:var(--c4);margin-left:2px}

/* Goal type popup */
.goal-type-popup{display:none;flex-direction:column;min-width:180px;padding:6px}
.goal-type-popup.show{display:flex}
.goal-type-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r1);cursor:pointer;transition:all .12s;border:1px solid transparent}
.goal-type-item:hover{background:var(--pr50);border-color:var(--pr200)}
.goal-type-item-icon{width:32px;height:32px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.goal-type-item-icon.quant{background:var(--pr50);color:var(--pr)}
.goal-type-item-icon.qual{background:var(--vi50);color:var(--vi)}
.goal-type-item-icon svg{width:16px;height:16px}
.goal-type-item-text{display:flex;flex-direction:column;gap:1px}
.goal-type-item-name{font:500 13px/1.2 var(--f);color:var(--c8)}
.goal-type-item-desc{font:400 11px/1.2 var(--f);color:var(--c5)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease forwards}

/* ═══ AI CHAT ═══ */
.ai-chat{position:fixed;top:52px;right:0;width:380px;height:calc(100vh - 52px);background:var(--sf);border-left:1px solid var(--dv);z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease}
body.chat-open .ai-chat{transform:translateX(0)}
.ai-chat-hd{padding:16px 20px;border-bottom:1px solid var(--dv);display:flex;align-items:center;gap:10px}
.ai-chat-hd-ic{width:32px;height:32px;border-radius:var(--r2);background:linear-gradient(135deg,var(--pr) 0%,var(--vi) 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-chat-hd-ic svg{width:16px;height:16px;color:#FFF}
.ai-chat-hd-t{font:600 14px/1.2 var(--f);color:var(--c9)}
.ai-chat-hd-s{font:400 11px/1 var(--f);color:var(--c5)}
.ai-chat-close{margin-left:auto;width:28px;height:28px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;color:var(--c5);transition:all .12s}
.ai-chat-close:hover{background:var(--c1);color:var(--c7)}
.ai-chat-bd{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.ai-msg{max-width:92%;animation:aiMsgIn .3s ease}
@keyframes aiMsgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ai-msg.bot{align-self:flex-start}
.ai-msg.user{align-self:flex-end}
.ai-msg-bd{padding:12px 16px;border-radius:var(--r3);font:400 13px/1.6 var(--f)}
.ai-msg.bot .ai-msg-bd{background:var(--c0);color:var(--c8);border-bottom-left-radius:4px}
.ai-msg.user .ai-msg-bd{background:var(--pr);color:#FFF;border-bottom-right-radius:4px}
.ai-msg-time{font:400 10px/1 var(--f);color:var(--c4);margin-top:4px}
.ai-msg.user .ai-msg-time{text-align:right}
.ai-msg-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ai-msg-btn{font:500 11px/1 var(--f);padding:5px 10px;border-radius:var(--r1);border:1px solid var(--c2);background:var(--sf);color:var(--c6);cursor:pointer;transition:all .12s}
.ai-msg-btn:hover{border-color:var(--pr);color:var(--pr);background:var(--pr50)}
.ai-msg-btn.primary{border-color:var(--pr);color:var(--pr);background:var(--pr50)}
.ai-msg-card{background:var(--sf);border:1px solid var(--c2);border-radius:var(--r2);padding:12px;margin-top:8px}
.ai-msg-card-t{font:600 12px/1.3 var(--f);color:var(--c8);margin-bottom:4px}
.ai-msg-card-d{font:400 12px/1.5 var(--f);color:var(--c5)}
.ai-msg-card-ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ai-msg-card-tag{display:inline-block;font:500 10px/1 var(--f);padding:2px 6px;border-radius:3px}
.ai-msg-card-tag.em{color:var(--em700);background:var(--em50)}
.ai-msg-card-tag.pr{color:var(--pr);background:var(--pr50)}
.ai-msg-card-tag.ac{color:var(--ac);background:var(--ac50)}
.ai-msg-card-apply{font:500 11px/1 var(--f);padding:4px 8px;border-radius:var(--r1);border:1px solid var(--pr200);background:var(--pr50);color:var(--pr);cursor:pointer;transition:all .12s}
.ai-msg-card-apply:hover{background:var(--pr);color:#FFF}
.ai-shortcuts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ai-shortcut{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r2);cursor:pointer;transition:all .12s}
.ai-shortcut:hover{border-color:var(--pr200);background:var(--pr50)}
.ai-shortcut-icon{font-size:18px;flex-shrink:0}
.ai-shortcut-text{flex:1;min-width:0}
.ai-shortcut-label{font:500 13px/1.2 var(--f);color:var(--c8)}
.ai-shortcut-desc{font:400 11px/1.3 var(--f);color:var(--c5);margin-top:2px}
.ai-indicators{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ai-indicator-card{background:var(--sf);border:1px solid var(--c2);border-radius:var(--r2);padding:12px;border-left:3px solid var(--pr)}
.ai-ind-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ai-ind-name{font:600 13px/1.2 var(--f);color:var(--c8)}
.ai-ind-cat{font:500 10px/1 var(--f);padding:2px 6px;border-radius:3px;background:var(--pr50);color:var(--pr)}
.ai-ind-meta{display:flex;gap:12px;font:400 11px/1 var(--f);color:var(--c5);margin-bottom:6px}
.ai-ind-meta strong{color:var(--pr);font-family:var(--m)}
.ai-ind-desc{font:400 12px/1.4 var(--f);color:var(--c6);margin-bottom:6px}
.ai-ind-tip{font:400 11px/1.4 var(--f);color:var(--em700);background:var(--em50);padding:6px 8px;border-radius:var(--r1)}
.ai-chat-ft{padding:12px 16px;border-top:1px solid var(--dv);display:flex;gap:8px;align-items:center}
.ai-chat-input{flex:1;height:36px;border:1px solid var(--c2);border-radius:var(--r2);padding:0 12px;font:400 13px/1 var(--f);color:var(--c8);outline:none;transition:border .15s}
.ai-chat-input:focus{border-color:var(--pr)}
.ai-chat-send{width:36px;height:36px;border-radius:var(--r2);background:var(--pr);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFF;transition:all .12s}
.ai-chat-send:hover{background:var(--pr700)}
.ai-chat-upload{width:36px;height:36px;border-radius:var(--r2);background:var(--sf);border:1px solid var(--c2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c5);transition:all .12s;position:relative}
.ai-chat-upload:hover{border-color:var(--pr);color:var(--pr);background:var(--pr50)}
.ai-chat-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ai-upload{border:2px dashed var(--c3);border-radius:var(--r2);padding:16px;text-align:center;cursor:pointer;transition:all .12s;margin-top:8px}
.ai-upload:hover{border-color:var(--pr);background:var(--pr50)}
.ai-upload.dragover{border-color:var(--pr);background:var(--pr50)}
.ai-upload-icon{font-size:24px;margin-bottom:6px}
.ai-upload-text{font:500 12px/1.3 var(--f);color:var(--c6)}
.ai-upload-hint{font:400 11px/1.3 var(--f);color:var(--c4);margin-top:4px}
.ai-upload-input{display:none}
.ai-file-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-file{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f)}
.ai-file-icon{font-size:14px}
.ai-file-name{flex:1;color:var(--c8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-file-size{color:var(--c4);font-family:var(--m);font-size:11px}
.ai-file-status{font:500 11px/1 var(--f);padding:2px 6px;border-radius:3px}
.ai-file-status.parsed{color:var(--em700);background:var(--em50)}
.ai-file-status.parsing{color:var(--pr);background:var(--pr50)}
.ai-toggle{position:fixed;bottom:80px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pr) 0%,var(--vi) 100%);border:none;box-shadow:0 4px 16px rgba(37,99,235,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:950;transition:all .2s}
.ai-toggle:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(37,99,235,.4)}
.ai-toggle svg{width:22px;height:22px;color:#FFF}
body.chat-open .ai-toggle{display:none}
</style>
</head>
<body>

<!-- Navigation will be injected by navigation.js -->

<!-- Main content -->
<div class="page-content fade-in">
  <!-- Breadcrumb -->
  <nav class="page-crumb">
    <a href="../demo-index.html">绩效工作台</a>
    <span class="sep">/</span>
    <span class="cur">员工制定</span>
  </nav>

  <!-- Page header (same structure as demo-workbench-my-goal.html) -->
  <div class="detail-card" id="pageHeaderCard">
    <div class="detail-top">
      <div class="detail-title-row">
        <span class="detail-title" id="detailTitle">我的目标</span>
        <span class="detail-status submitted" id="detailStatus"><span class="dot"></span>目标制定</span>
        <div class="detail-title-actions">
          <span class="sum-val ok" id="sumWeight">100%</span>
          <span class="act-sep" aria-hidden="true"></span>
          <span class="sum-item">总目标数: <span class="sum-goals" id="sumGoals">7</span></span>
          <span class="act-sep self-only" aria-hidden="true"></span>
          <span class="autosave-hint self-only">已实时保存</span>
          <span class="act-sep self-only" aria-hidden="true"></span>
          <button type="button" class="btn btn-p self-only" onclick="validateAndSubmit()">提交</button>
          <span class="act-sep approve-only" aria-hidden="true" style="display:none"></span>
          <button type="button" class="btn btn-s approve-only" style="display:none" onclick="rejectOthersGoals()">驳回</button>
          <button type="button" class="btn btn-p approve-only" style="display:none" onclick="approveOthersGoals()">通过</button>
        </div>
      </div>
    </div>
    <div class="detail-pills">
      <select id="yearSelect" style="height:28px;padding:0 24px 0 8px;border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c7);background:var(--sf) url('data:image/svg+xml,%3Csvg width=%2710%27 height=%276%27 viewBox=%270 0 10 6%27 fill=%27none%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cpath d=%27M1 1L5 5L9 1%27 stroke=%27%23A1A1AA%27 stroke-width=%271.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E') no-repeat right 6px center;appearance:none;cursor:pointer;outline:none" onchange="switchYear(this.value)">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
      <span style="color:var(--c3);margin:0 6px">|</span>
      <span id="cyclePills"></span>
    </div>
  </div>
  <div class="goal-split" id="goalSplit">
    <aside class="people-panel" id="peoplePanel" aria-label="人员切换"></aside>
    <div class="goal-main">
      <div class="viewing-bar">
        <button type="button" class="vb-toggle" id="panelToggle" title="收起" aria-label="收起人员栏" onclick="togglePeoplePanel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="vb-text" id="viewingText">林晓｜产品部｜产品经理</span>
      </div>
      <div id="moduleContainer"></div>
    </div>
  </div>
</div>


<!-- ═══ COPY MODAL ═══ -->
<div class="modal-overlay" id="copyModal">
  <div class="modal">

function findPerson(id){
  if(id==='self')return {group:'self',person:SELF};
  for(const g of ['superior','subordinate']){
    const p=PEOPLE[g].find(x=>x.id===id);
    if(p)return {group:g,person:p};
  }
  return null;
}
function isSelfView(){return currentPersonId==='self'}
function isViewableOtherGoal(g){return g.status==='effective'||g.status==='pending_my_approval'}
function getPersonModulesRaw(){
  if(isSelfView())return MODULES;
  return PERSON_MODULES[currentPersonId]||[];
}
function getVisibleModules(){
  const raw=getPersonModulesRaw();
  if(isSelfView())return raw;
  return raw.map(m=>({...m,goals:m.goals.filter(isViewableOtherGoal)}));
}
function hasPendingMyApproval(mods){
  return (mods||[]).some(m=>m.goals.some(g=>g.status==='pending_my_approval'));
}
function personLine(p){return p.name+'｜'+p.dept+'｜'+p.title}
function personMeta(p){return p.dept+'｜'+p.title}
function renderPeople(){
  const el=document.getElementById('peoplePanel');
  if(!el)return;
  let h='<div class="people-group"><button type="button" class="people-item'+(currentPersonId==='self'?' active':'')+'" onclick="selectPerson(\'self\')"><span class="p-name">我的目标</span></button></div>';
  const groups=[{key:'superior',title:'我的上级'},{key:'subordinate',title:'我的团队'}];
  groups.forEach(g=>{
    h+='<div class="people-group"><div class="people-group-title">'+g.title+'</div>';
    PEOPLE[g.key].forEach(p=>{
      h+='<button type="button" class="people-item'+(p.id===currentPersonId?' active':'')+'" onclick="selectPerson(\''+p.id+'\')"><span class="p-name">'+p.name+'</span><span class="p-meta">'+personMeta(p)+'</span></button>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}
function updateViewingBar(){
  const hit=findPerson(currentPersonId);
  if(!hit)return;
  const vt=document.getElementById('viewingText');
  if(vt)vt.textContent=personLine(hit.person);
}
function updateHeaderEditMode(){
  const self=isSelfView();
  const titleEl=document.getElementById('detailTitle');
  if(titleEl)titleEl.textContent=self?'我的目标':'TA人目标';
  document.querySelectorAll('.self-only').forEach(el=>{el.style.display=self?'':'none'});
  const mods=getVisibleModules();
  const showApprove=!self&&hasPendingMyApproval(mods);
  document.querySelectorAll('.approve-only').forEach(el=>{el.style.display=showApprove?'':'none'});
  const statusEl=document.getElementById('detailStatus');
  if(statusEl){
    let label='目标制定';
    let tone='submitted';
    let show=true;
    if(!self){
      const n=mods.reduce((s,m)=>s+m.goals.length,0);
      if(!n){
        show=false;
      }else if(hasPendingMyApproval(mods)){
        label='直线上级审批';
        tone='submitted';
      }else{
        label='已生效';
        tone='effective';
      }
    }
    if(show){
      statusEl.className='detail-status '+tone;
      statusEl.innerHTML='<span class="dot"></span>'+label;
      statusEl.style.display='';
    }else{
      statusEl.style.display='none';
      statusEl.innerHTML='';
    }
  }
}
function selectPerson(id){
  if(!findPerson(id))return;
  currentPersonId=id;
  renderPeople();
  updateViewingBar();
  render();
}
function approveOthersGoals(){
  if(isSelfView())return;
  const raw=PERSON_MODULES[currentPersonId];
  if(!raw)return;
  raw.forEach(m=>{m.goals.forEach(g=>{if(g.status==='pending_my_approval')g.status='effective'})});
  showToast('已通过','success');
  render();
}
function rejectOthersGoals(){
  if(isSelfView())return;
  const raw=PERSON_MODULES[currentPersonId];
  if(!raw)return;
  raw.forEach(m=>{m.goals.forEach(g=>{if(g.status==='pending_my_approval')g.status='rejected'})});
  showToast('已驳回','success');
  render();
}

function showConfirm({title='确认操作', desc='确定要执行此操作吗？', type='warn', okText='确认', onOk}) {
  const overlay = document.getElementById('confirmOverlay');
  const icon = document.getElementById('confirmIcon');
  const titleEl = document.getElementById('confirmTitle');
  const descEl = document.getElementById('confirmDesc');
  const okBtn = document.getElementById('confirmOk');
  const cancelBtn = document.getElementById('confirmCancel');

  icon.className = 'confirm-icon ' + type;
  titleEl.textContent = title;
  descEl.textContent = desc;
  okBtn.textContent = okText;

  // 更新图标
  const icons = {
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  };
  icon.innerHTML = icons[type] || icons.warn;

  return new Promise(resolve => {
    const cleanup = () => {
      overlay.classList.remove('open');
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      overlay.onclick = null;
    };
    okBtn.onclick = () => { cleanup(); resolve(true); onOk && onOk(); };
    cancelBtn.onclick = () => { cleanup(); resolve(false); };
    overlay.onclick = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
    overlay.classList.add('open');
  });
}

function setTotals(tw,n){
  const wEl=document.getElementById('sumWeight');
  if(wEl){
    wEl.textContent=tw+'%';

// ═══ AUTO-SYNC ═══
function syncGoalFromForm(id){
  if(!isSelfView())return;
  const d=findGoal(id);if(!d)return;
  const g=d.goal;
  const nameEl=document.getElementById('ge_name_'+id);
  const weightEl=document.getElementById('ge_weight_'+id);
  if(nameEl) g.name=nameEl.value;
  if(weightEl) g.weight=parseInt(weightEl.value)||0;
  if(g.type==='quant'){
    const targetEl=document.getElementById('ge_target_'+id);
    const challengeEl=document.getElementById('ge_challenge_'+id);
    const baselineEl=document.getElementById('ge_baseline_'+id);
    const ruleEl=document.getElementById('ge_rule_'+id);
    if(targetEl&&!targetEl.readOnly) g.target=parseFloat(targetEl.value)||0;
    if(challengeEl&&!challengeEl.readOnly) g.challenge=parseFloat(challengeEl.value)||0;
    if(baselineEl&&!baselineEl.readOnly) g.baseline=parseFloat(baselineEl.value)||0;
    if(ruleEl) g.ruleFormula=ruleEl.value;
  }else{
    const descEl=document.getElementById('ge_desc_'+id);
    if(descEl) g.desc=descEl.value;
  }
  // 更新标题行的权重显示
  const weightSpan=document.querySelector(`[data-goal-id="${id}"] .goal-weight`);
  if(weightSpan) weightSpan.textContent='权重: '+g.weight;
  updateTotals();
}

let createTargetModIdx=0;
function addGoal(mi){
  if(!isSelfView())return;
  const isQuant=mi===0;
  const id='g'+Date.now();
  const goal={
    id,name:'',indicator:'',type:isQuant?'quant':'qual',direction:isQuant?'positive':undefined,weight:10,desc:'',
    measure:isQuant?'梯度评分':'定性评分',measureText:'',
    target:isQuant?'':1,challenge:isQuant?'':1,baseline:isQuant?'':1,
    unit:isQuant?'%':'',rule:isQuant?'':'-',ruleFormula:'',msLevels:[],
    linkedIndicatorId:null,i18n:{},isNew:true
  };
  MODULES[mi].goals.push(goal);
  expandedMods.add(mi);
  expandedGoals.add(id);
  render();
  requestAnimationFrame(()=>{
    const row=document.querySelector(`[data-goal-id="${id}"]`);
    const nameInput=document.getElementById('ge_name_'+id);
    if(nameInput)nameInput.focus({preventScroll:true});
    if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
  });
  showToast(isQuant?'已在 KPI 末尾新增定量目标':'已在 KPA 末尾新增定性目标','success');
}
function confirmCreateGoal(){
  if(!isSelfView())return;
  const isQuant=createTargetModIdx===0;
  const name=document.getElementById('createGoalName').value.trim();
  const weight=Number(document.getElementById('createGoalWeight').value);
  const desc=document.getElementById('createGoalDesc').value.trim();
  if(!name){showToast('请输入目标名称');return}
  if(!Number.isFinite(weight)||weight<0||weight>100){showToast('权重需在 0% 到 100% 之间');return}
  if(!isQuant&&!desc){showToast('请输入衡量标准');return}
  const id='g'+Date.now();
  const goal={id,name,indicator:'',type:isQuant?'quant':'qual',direction:isQuant?'positive':undefined,weight,desc,measure:isQuant?'梯度评分':'定性评分',measureText:'',target:1,challenge:1,baseline:1,unit:isQuant?'%':'',rule:isQuant?'标准梯度计算':'-',ruleFormula:isQuant?'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))':'',msLevels:[],linkedIndicatorId:null,i18n:{}};
  if(isQuant){
    goal.challenge=Number(document.getElementById('createGoalChallenge').value)||0;
    goal.target=Number(document.getElementById('createGoalTarget').value)||0;
    goal.baseline=Number(document.getElementById('createGoalBaseline').value)||0;
    if(!goal.target){showToast('请输入目标值');return}
  }
  MODULES[createTargetModIdx].goals.push(goal);
  expandedMods.add(createTargetModIdx);
  expandedGoals.add(id);
  closeModal('createGoalModal');
  render();
  showToast(isQuant?'已新增定量目标':'已新增定性目标','success');
}
function closeGoalTypePopup(){document.getElementById('addGoalPopup').classList.remove('show')}

function deleteGoal(id,mi){
  if(!isSelfView())return;
  const goal=MODULES[mi].goals.find(g=>g.id===id);
  showConfirm({
    title:'删除目标',
    desc:`确定要删除「${goal?goal.name:'该目标'}」吗？此操作不可撤销。`,
    type:'danger',
    okText:'删除',
    onOk:()=>{
      MODULES[mi].goals=MODULES[mi].goals.filter(g=>g.id!==id);
      expandedGoals.delete(id);
      render();
    }
  });

function updateTotals(mods){
  const list=mods||(isSelfView()?MODULES:getVisibleModules());
  const tw=list.reduce((s,m)=>s+m.goals.reduce((gs,g)=>gs+g.weight,0),0);
  const n=list.reduce((s,m)=>s+m.goals.length,0);
  setTotals(tw,n);
}

// ═══ INLINE EDIT ═══
function editWeightInline(goalId){
  const d=findGoal(goalId);if(!d)return;
  const g=d.goal;
  const el=document.querySelector(`[data-goal-id="${goalId}"] .goal-weight`);
  if(!el)return;
  const input=document.createElement('input');
  input.className='goal-name-input';
  input.type='number';
  input.value=g.weight;
  input.min=0;input.max=100;
  input.style.width='60px';input.style.textAlign='center';
  input.style.fontFamily='var(--m)';
  input.style.fontWeight='700';
  input.style.fontSize='13px';
  el.replaceWith(input);
  input.focus();input.select();
  const save=()=>{
    const v=parseInt(input.value)||0;
    g.weight=Math.max(0,Math.min(100,v));
    render();
  };
  input.addEventListener('blur',save);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')render()});
}

function saveInlineEdit(id,mi){
  const d=findGoal(id);if(!d)return;
  const g=d.goal;
  const nameEl=document.getElementById('ge_name_'+id);
  const weightEl=document.getElementById('ge_weight_'+id);

  // 清除错误样式
  document.querySelectorAll('.goal-edit.open .inp-err, .goal-name-input.inp-err').forEach(el=>el.classList.remove('inp-err'));
  let firstErr=null;

  // 校验
  if(!nameEl||!nameEl.value.trim()){if(nameEl)nameEl.classList.add('inp-err');if(!firstErr)firstErr='请填写目标名称';}
  if(!weightEl||!weightEl.value||parseInt(weightEl.value)<=0){if(weightEl)weightEl.classList.add('inp-err');if(!firstErr)firstErr='请填写权重';}
  if(g.type==='quant'){
    if(!g.linkedIndicatorId){if(!firstErr)firstErr='请选择关联指标';}
    const targetEl=document.getElementById('ge_target_'+id);
    if(!targetEl||!targetEl.value){if(targetEl)targetEl.classList.add('inp-err');if(!firstErr)firstErr='请填写目标值';}
  }else{
    const descEl=document.getElementById('ge_desc_'+id);
    if(!descEl||!descEl.value.trim()){if(descEl)descEl.classList.add('inp-err');if(!firstErr)firstErr='请填写衡量标准';}
  }
  if(firstErr){showToast(firstErr);return}

  // 保存数据
  if(nameEl) g.name=nameEl.value;
  if(weightEl) g.weight=parseInt(weightEl.value)||0;
  if(g.type==='quant'){
    const targetEl=document.getElementById('ge_target_'+id);
    const challengeEl=document.getElementById('ge_challenge_'+id);
    const baselineEl=document.getElementById('ge_baseline_'+id);
    if(targetEl&&!targetEl.readOnly) g.target=parseFloat(targetEl.value)||0;
    if(challengeEl&&!challengeEl.readOnly) g.challenge=parseFloat(challengeEl.value)||0;
    if(baselineEl&&!baselineEl.readOnly) g.baseline=parseFloat(baselineEl.value)||0;
  }else{
    const descEl=document.getElementById('ge_desc_'+id);
    if(descEl) g.desc=descEl.value;
  }

  expandedGoals.delete(id);
  render();
  showToast('保存成功','success');
}

function unlinkIndicator(id){
  const d=findGoal(id);if(!d)return;
  d.goal.linkedIndicatorId=null;
  render();
  expandedGoals.add(id);
}

// ═══ COPY MODAL ═══
let copyTargetModIdx=0;
function requiredGoalType(mi){return mi===0?'quant':'qual'}
function eligibleHistoryGoals(period){
  const required=requiredGoalType(copyTargetModIdx);
  return (HISTORY[period]||[]).filter(g=>g.type===required);
}
function openCopyModal(mi){
  if(!isSelfView())return;
  copyTargetModIdx=mi;
  histSelected.clear();
  document.getElementById('histPeriod').value='2026年5月';
  const typeLabel=requiredGoalType(mi)==='quant'?'定量':'定性';
  document.getElementById('copyModalTitle').textContent='复制历史'+typeLabel+'目标';
  document.getElementById('copyModLabel').textContent='仅显示并复制'+typeLabel+'目标到「'+MODULES[mi].name+'」模块';
  renderHistTable();
  openModal('copyModal');
}

function renderHistTable(){
  const period=document.getElementById('histPeriod').value;
  const goals=eligibleHistoryGoals(period);
  let h=`<thead><tr><th><span class="chk ${histSelected.size===goals.length&&goals.length?'on':''}" onclick="toggleAllHist()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></th><th>目标名称</th><th>模块</th><th>类型</th><th>权重</th><th>目标值</th></tr></thead><tbody>`;
  goals.forEach((g,i)=>{
    h+=`<tr onclick="toggleHistItem(${i})"><td><span class="chk ${histSelected.has(i)?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></td><td style="font-weight:500;color:var(--c8)">${g.name}</td><td>${g.module}</td><td>${g.type==='quant'?'定量':'定性'}</td><td style="font-family:var(--m)">${g.weight}</td><td style="font-family:var(--m)">${g.target}</td></tr>`;
  });
  h+='</tbody>';
  document.getElementById('histTable').innerHTML=h;
  document.getElementById('histSelCount').textContent='已选 '+histSelected.size+' 项';
}

function toggleHistItem(i){histSelected.has(i)?histSelected.delete(i):histSelected.add(i);renderHistTable()}
function toggleAllHist(){
  const period=document.getElementById('histPeriod').value;
  const goals=eligibleHistoryGoals(period);
  if(histSelected.size===goals.length)histSelected.clear();
  else{histSelected.clear();goals.forEach((_,i)=>histSelected.add(i))}
  renderHistTable();
}

function confirmCopy(){
  if(!histSelected.size){showToast('请至少选择一个目标');return}
  const period=document.getElementById('histPeriod').value;
  const goals=eligibleHistoryGoals(period);
  const mod=MODULES[copyTargetModIdx];
  let count=0;
  histSelected.forEach(i=>{
    const src=goals[i];
    const id='g'+Date.now()+'_'+count;
    mod.goals.push({...src,id,msLevels:src.msLevels||[],linkedIndicatorId:null,i18n:{}});
    count++;
  });
  expandedMods.add(copyTargetModIdx);
  closeModal('copyModal');
  render();
}

}

function confirmRule(){

  closeModal('ruleModal');if(editGoalId)openEdit(editGoalId,editModIdx);
}

// ═══ INDICATOR PICKER ═══
let kpiPickerGoalId=null, kpiPickerModIdx=null;
function openIndicatorPicker(goalId,mi){
  if(!isSelfView())return;
  kpiPickerGoalId=goalId;kpiPickerModIdx=mi;
  const typeLabel=requiredGoalType(mi)==='quant'?'定量':'定性';
  document.getElementById('indicatorModalTitle').textContent=MODULES[mi].name+' · 选择'+typeLabel+'指标';
  document.getElementById('kpiSearch').value='';
  selectedKpiId=null;kpiFilterCat='全部';kpiFilterType=typeLabel;kpiFilterNature='全部';
  renderKpiList();
  openModal('indicatorModal');
}
function renderKpiList(){
  const q=(document.getElementById('kpiSearch')?.value||'').toLowerCase();
  const requiredType=requiredGoalType(kpiPickerModIdx)==='quant'?'定量':'定性';
  const candidates=MOCK_INDICATORS.filter(k=>k.type===requiredType);
  const allCats=candidates.map(k=>k.category);
  const cats=['全部',...new Set(allCats)];
  const natures=['全部','正向','负向'];

  // Filter bar
  let filterHtml='';
  filterHtml+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center">';
  filterHtml+='<span style="font:500 12px/1 var(--f);color:var(--c5);min-width:32px">分类:</span>';
  filterHtml+=cats.map(c=>{
    const count=c==='全部'?candidates.length:allCats.filter(x=>x===c).length;
    return `<span class="kpi-cat ${kpiFilterCat===c?'on':''}" onclick="kpiFilterCat='${c}';renderKpiList()">${c}<span class="kpi-cat-count">(${count})</span></span>`;
  }).join('');
  filterHtml+='</div>';
  filterHtml+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center">';
  filterHtml+='<span style="font:500 12px/1 var(--f);color:var(--c5);min-width:32px">类型:</span>';
  filterHtml+=`<span class="kpi-cat on" style="cursor:default">${requiredType}</span>`;
  filterHtml+='<span style="font:500 12px/1 var(--f);color:var(--c5);min-width:32px;margin-left:8px">性质:</span>';
  filterHtml+=natures.map(n=>{
    return `<span class="kpi-cat ${kpiFilterNature===n?'on':''}" onclick="kpiFilterNature='${n}';renderKpiList()">${n}</span>`;
  }).join('');
  filterHtml+='</div>';
  document.getElementById('kpiCatBar').innerHTML=filterHtml;

  const filtered=candidates.filter(k=>{
    if(kpiFilterCat!=='全部'&&k.category!==kpiFilterCat)return false;
    if(kpiFilterNature!=='全部'&&k.nature!==kpiFilterNature)return false;
    if(q&&!k.name.toLowerCase().includes(q))return false;
    return true;
  });

  // 显示详情面板
  const detailEl=document.getElementById('kpiDetail');
  if(selectedKpiId){
    const k=MOCK_INDICATORS.find(x=>x.id===selectedKpiId);
    if(k){
      detailEl.innerHTML=`<div class="kpi-detail">
        <div class="kpi-detail-hd">
          <span class="kpi-detail-name">${k.name}</span>
          <button class="kpi-detail-close" onclick="selectedKpiId=null;renderKpiList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="kpi-detail-grid">
          <div class="kpi-detail-item"><span class="kpi-detail-label">指标类型</span><span class="kpi-detail-value">${k.type}</span></div>
          <div class="kpi-detail-item"><span class="kpi-detail-label">指标性质</span><span class="kpi-detail-value">${k.nature}</span></div>
          <div class="kpi-detail-item"><span class="kpi-detail-label">指标分类</span><span class="kpi-detail-value">${k.category}</span></div>
          <div class="kpi-detail-item"><span class="kpi-detail-label">计量单位</span><span class="kpi-detail-value">${k.unit}</span></div>
        </div>
        <div class="kpi-detail-desc">${k.desc}</div>
      </div>`;
    }
  }else{
    detailEl.innerHTML='';
  }

  document.getElementById('kpiList').innerHTML=filtered.map(k=>`<div class="kpi-card ${selectedKpiId===k.id?'selected':''}" onclick="selectedKpiId='${k.id}';renderKpiList()">
    <div class="kpi-card-hd"><span class="kpi-card-name">${k.name}</span><span class="kpi-card-cat">${k.category}</span></div>
    <div class="kpi-card-tags">
      <span class="kpi-tag type">${k.type}</span>
      <span class="kpi-tag nature">${k.nature}</span>
      <span class="kpi-tag unit">单位: ${k.unit}</span>
    </div>
    <div class="kpi-card-desc">${k.desc}</div>
  </div>`).join('');
  document.getElementById('kpiSelLabel').textContent=selectedKpiId?'已选择 1 项':'未选择';
}
function filterKPI(){renderKpiList()}
function confirmIndicator(){
  if(!selectedKpiId){showToast('请选择一个指标');return}
  const kpi=MOCK_INDICATORS.find(k=>k.id===selectedKpiId);
  if(!kpi)return;
  const requiredType=requiredGoalType(kpiPickerModIdx)==='quant'?'定量':'定性';
  if(kpi.type!==requiredType){showToast(MODULES[kpiPickerModIdx].name+' 仅允许选择'+requiredType+'指标');return}
  if(kpiPickerGoalId){
    // 更新已有目标
    const d=findGoal(kpiPickerGoalId);if(!d)return;
    const g=d.goal;
    g.name=kpi.name;g.indicator=kpi.name;g.type=kpi.type==='定量'?'quant':'qual';
    g.direction=directionFromNature(kpi.nature,kpi.type==='定量');
    g.unit=kpi.unit;g.rule=kpi.type==='定量'?'标准梯度计算':'-';g.ruleFormula=kpi.type==='定量'?'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))':'';g.desc=kpi.desc;
    g.linkedIndicatorId=kpi.id;
    closeModal('indicatorModal');
    expandedGoals.add(kpiPickerGoalId);
  }else{
    // 新增目标（从模块头的指标库选择按钮）
    const mi=kpiPickerModIdx;
    const id='g'+Date.now();
    const isQuant=kpi.type==='定量';
    MODULES[mi].goals.push({
      id,name:kpi.name,indicator:kpi.name,type:isQuant?'quant':'qual',
      direction:directionFromNature(kpi.nature,isQuant),
      weight:10,desc:kpi.desc,measure:isQuant?'梯度评分':'定性评分',
      target:0,challenge:0,baseline:0,unit:kpi.unit,
      rule:isQuant?'标准梯度计算':'-',ruleFormula:isQuant?'IF(实际>=挑战,120,IF(实际>=目标,100,IF(实际>=保底,80,0)))':'',msLevels:[],linkedIndicatorId:kpi.id,aiFilled:false
    });
    expandedMods.add(mi);
    expandedGoals.add(id);
    closeModal('indicatorModal');
  }
  render();
}

function openLangModal(fieldKey){
  langFieldKey=fieldKey;
  const data=langStore[fieldKey]||{zh:'',en:''};
  const label=fieldKey.endsWith('_name')?'目标名称':'目标描述';
  document.getElementById('langFieldLabel').textContent=label+' — 多语言';

}
function saveLang(){

  closeModal('langModal');
  if(editGoalId)openEdit(editGoalId,editModIdx);
}

// ═══ VALIDATION ═══
function validateWeights(){
  const tw=MODULES.reduce((s,m)=>s+m.goals.reduce((gs,g)=>gs+g.weight,0),0);
  if(tw!==100)return[`总权重 ${tw}%，需等于 100%`];
  return [];
}

function validateAndSubmit(){
  if(!isSelfView())return;
  const totalGoals=MODULES.reduce((s,m)=>s+m.goals.length,0);
  if(totalGoals<2){showToast('至少需要填写2个目标');return}
  const errs=validateWeights();
  if(errs.length){showToast(errs[0]);return}
  showToast('提交成功','success');
}

function showToast(msg,type){
  const t=document.getElementById('validateToast');
  document.getElementById('toastMsg').textContent=msg;
  t.className='validate-toast show'+(type==='success'?' success':type==='warn'?' warn':'');
  setTimeout(()=>t.classList.remove('show'),3000);
}
function showMeasureDesc(id){
  const d=findGoal(id);if(!d)return;
  showToast((d.goal.desc||'暂无指标描述'),'info');
}

function reorderApprovalFlowCells(){
  const table=document.getElementById('approvalFlowTable');
  if(!table||table.dataset.reordered==='true')return;
  table.querySelectorAll('tbody tr').forEach(row=>{
    const cells=Array.from(row.children);
    [0,1,4,5,2,3].forEach(index=>row.appendChild(cells[index]));
  });
  table.dataset.reordered='true';
}

function setupStickyHeaders(){
  const scroller=document.getElementById('ct');
  const pageAction=document.getElementById('pageHeaderCard')||document.querySelector('.detail-card');
  if(!scroller||!pageAction)return;
  const syncOffset=()=>document.documentElement.style.setProperty('--page-action-h',pageAction.offsetHeight+'px');
  const syncState=()=>{
    const scrollerTop=scroller.getBoundingClientRect().top;
    const moduleTop=scrollerTop+pageAction.offsetHeight+8;
    document.querySelectorAll('.mod-hd').forEach(header=>{
      const section=header.closest('.mod-section');
      const rect=header.getBoundingClientRect();
      const sectionRect=section.getBoundingClientRect();
      header.classList.toggle('is-stuck',rect.top<=moduleTop+1&&sectionRect.bottom>moduleTop+header.offsetHeight);
    });
  };
  syncOffset();
  syncState();
  scroller.addEventListener('scroll',syncState,{passive:true});
  window.addEventListener('resize',()=>{syncOffset();syncState()},{passive:true});
  if(window.ResizeObserver)new ResizeObserver(()=>{syncOffset();syncState()}).observe(pageAction);
}

function getCycleLabel(){return CYCLE_LABELS[currentCycle]||currentCycle}
function switchYear(yr){
  currentYear=yr;
  var cycles=CYCLES_BY_YEAR[yr]||[];
  currentCycle=cycles[0]?cycles[0].v:currentCycle;
  renderCyclePills();
}
function renderCyclePills(){
  var cycles=CYCLES_BY_YEAR[currentYear]||[];
  var h='';
  for(var i=0;i<cycles.length;i++){
    var c=cycles[i];
    var active=c.v===currentCycle?' active':'';
    h+='<span class="cycle-pill'+active+'" onclick="switchCycle(\''+c.v+'\',this)">'+c.t+'</span>';
    if(i<cycles.length-1&&c.t.indexOf('月')>=0&&cycles[i+1]&&cycles[i+1].t.indexOf('月')<0)h+='<span style="color:var(--c3);margin:0 2px">|</span>';
  }
  var el=document.getElementById('cyclePills');
  if(el)el.innerHTML=h;
}
function switchCycle(val,el){
  currentCycle=val;
  var pills=document.querySelectorAll('#cyclePills .cycle-pill');
  for(var i=0;i<pills.length;i++)pills[i].classList.remove('active');
  if(el)el.classList.add('active');
  else renderCyclePills();
}
