<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 团队绩效工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;--pr900:#1E3A8A;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;--ac700:#B45309;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --vi:#8B5CF6;--vi50:#F5F3FF;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#F5F5F4;--dv:#F4F4F5;
  --r1:6px;--r2:8px;--r3:10px;--r4:14px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --fm:'JetBrains Mono','SF Mono',monospace;
  --sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:20px;--sp-2xl:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

.card{background:var(--sf);border-radius:var(--r3);box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:var(--sp-lg)}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-lg) var(--sp-xl);border-bottom:1px solid var(--dv)}
.card-t{font:600 15px/1 var(--f);color:var(--c9)}
.card-action{font:500 13px/1 var(--f);color:var(--pr);cursor:pointer;display:flex;align-items:center;gap:var(--sp-xs);text-decoration:none}
.card-action:hover{color:var(--pr700)}
.card-action svg{width:14px;height:14px}
.card-bd{padding:20px 24px}

.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;background:#F8FAFC;border-radius:6px;cursor:pointer;margin-bottom:10px}
.task:last-child{margin-bottom:0}
.task-avatar{width:24px;height:24px;border:2px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--f)}
.task-avatar.mint{color:#2DD4BF}.task-avatar.cyan{color:#0EA5E9}.task-avatar.orange{color:#F59E0B}
.task-main{min-width:0}
.task-name{font:400 13px/1.35 var(--f);color:var(--c8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{font:400 12px/1 var(--f);color:var(--c4);margin-top:8px}
.task-action{font:500 12px/1 var(--f);color:var(--pr);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px;white-space:nowrap}
.task-action svg{width:14px;height:14px}
.task-action:hover{color:var(--pr700)}

/* Month tabs */
.month-tabs{display:flex;gap:4px}
.month-tab{font:500 12px/1 var(--f);padding:3px 10px;border-radius:var(--r1);cursor:pointer;color:var(--c5);transition:all .12s}
.month-tab:hover{color:var(--pr);background:var(--pr50)}
.month-tab.on{background:var(--pr);color:#FFF}

.card-tools{display:flex;align-items:center;gap:var(--sp-md)}
.grade-rule-select{height:30px;min-width:140px;padding:0 28px 0 10px;border:1px solid var(--c3);border-radius:var(--r1);background:var(--sf);font:400 12px/1 var(--f);color:var(--c7);outline:none;cursor:pointer}
.grade-rule-select:hover,.grade-rule-select:focus{border-color:var(--pr)}

.toast{position:fixed;top:70px;right:24px;padding:12px 18px;border-radius:var(--r2);font:500 13px/1.3 var(--f);box-shadow:0 10px 40px -10px rgba(0,0,0,.12);z-index:3000;transform:translateX(120%);transition:transform .25s ease}
.toast.on{transform:translateX(0)}
.toast.success{background:var(--em);color:#FFF}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
</head>
<body>

<div style="padding:var(--sp-2xl)">

  <!-- 周期切换 -->
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:var(--sp-lg);flex-wrap:wrap">
    <span style="font:500 12px/1 var(--f);color:var(--c5);margin-right:4px">周期</span>
    <select id="yearSelect" style="height:28px;padding:0 24px 0 8px;border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c7);background:var(--sf) url('data:image/svg+xml,%3Csvg width=%2710%27 height=%276%27 viewBox=%270 0 10 6%27 fill=%27none%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cpath d=%27M1 1L5 5L9 1%27 stroke=%27%23A1A1AA%27 stroke-width=%271.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E') no-repeat right 6px center;appearance:none;cursor:pointer;outline:none" onchange="switchYear(this.value)">
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>
    <span style="color:var(--c3);margin:0 4px">|</span>
    <span id="cyclePills"></span>
  </div>
  <style>
    .cycle-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c6);cursor:pointer;transition:all .12s;border:1px solid transparent}
    .cycle-pill:hover{color:var(--pr);background:var(--pr50)}
    .cycle-pill.active{color:var(--pr);background:var(--pr50);border-color:var(--pr);font-weight:500}
  </style>

  <div style="display:grid;grid-template-columns:4fr 6fr;gap:var(--sp-lg);align-items:stretch">

    <!-- 待办任务 -->
    <div class="card" style="margin-bottom:0">
      <div class="card-hd">
        <span class="card-t" style="position:relative">待办<span style="position:absolute;top:-4px;right:-22px;min-width:16px;height:16px;border-radius:8px;background:var(--ro);color:#FFF;font:700 10px/16px var(--f);text-align:center;padding:0 4px">3</span></span>
        <span class="card-action" onclick="showToast('查看更多')">更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </div>
      <div class="card-bd">
        <div class="task" onclick="showToast('跳转至绩效面谈流程')">
          <span class="task-avatar mint">员</span>
          <div class="task-main">
            <div class="task-name">员工吴振兴 提交的 绩效面谈流程-徐德贵(zt22650)</div>
            <div class="task-meta">23小时前</div>
          </div>
          <span class="task-action"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 7.6A5.4 5.4 0 1 1 11.6 4"/><path d="M13.2 3.2v4.4H8.8"/></svg>去处理</span>
        </div>
        <div class="task" onclick="showToast('跳转至目标填写')">
          <span class="task-avatar cyan">员</span>
          <div class="task-main">
            <div class="task-name">员工吴振兴 提交的 目标制定-线上制定目标通用流程-徐德贵(zt22650)</div>
            <div class="task-meta">2026年08月11日 19:14</div>
          </div>
          <span class="task-action"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 7.6A5.4 5.4 0 1 1 11.6 4"/><path d="M13.2 3.2v4.4H8.8"/></svg>去处理</span>
        </div>
        <div class="task" onclick="showToast('跳转至目标填写')">
          <span class="task-avatar orange">员</span>
          <div class="task-main">
            <div class="task-name">员工吴振兴 提交的 目标制定-线上制定目标通用流程-徐德贵(zt22650)</div>
            <div class="task-meta">2026年08月11日 18:49</div>
          </div>
          <span class="task-action"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 7.6A5.4 5.4 0 1 1 11.6 4"/><path d="M13.2 3.2v4.4H8.8"/></svg>去处理</span>
        </div>
      </div>
    </div>

    <!-- 右侧：绩效等级分布 -->
    <div class="card" style="margin-bottom:0">
      <div class="card-hd">
        <span class="card-t">绩效等级分布</span>
        <div class="card-tools">
          <select class="grade-rule-select" id="gradeRuleSelect" aria-label="结果等级规则">
            <option value="seven">结果等级：七级制</option>
            <option value="five">结果等级：五级制</option>
          </select>
          <span class="card-action" onclick="showToast('查看更多')">更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
      </div>
      <div class="card-bd">
        <canvas id="chartDist" style="height:300px"></canvas>
      </div>
    </div>

  </div>

  <!-- 团队绩效趋势（全宽） -->
  <div class="card" style="margin-top:var(--sp-lg)">
    <div class="card-hd">
      <span class="card-t">团队绩效趋势</span>
      <span class="card-action" onclick="showToast('查看更多')">更多 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </div>
    <div class="card-bd">
      <canvas id="chartTrend" style="height:300px"></canvas>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  setTimeout(function() { t.classList.add('on'); }, 10);
  setTimeout(function() { t.classList.remove('on'); }, 2500);
}

// ===== 团队绩效图表 =====
var PERIOD_KEYS = ['2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
var PERIODS = ['2025年7月','2025年8月','2025年9月','2025年10月','2025年11月','2025年12月','2026年1月','2026年2月','2026年3月','2026年4月','2026年5月','2026年6月'];
var GRADE_RULES = {
  seven: {
    levels: ['远低预期','低于预期','符合预期-','符合预期','符合预期+','超出预期','远超预期'],
    colors: ['#E11D48','#F43F5E','#F59E0B','#A1A1AA','#2563EB','#10B981','#047857'],
    current: {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期','赵强':'符合预期'},
    history: [
      {'张明':'符合预期','李华':'符合预期+','王芳':'符合预期-','赵强':'符合预期'},
      {'张明':'符合预期-','李华':'符合预期+','王芳':'符合预期','赵强':'低于预期'},
      {'张明':'符合预期','李华':'超出预期','王芳':'符合预期','赵强':'符合预期-'},
      {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期','赵强':'符合预期'},
      {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期','赵强':'符合预期'},
      {'张明':'超出预期','李华':'超出预期','王芳':'符合预期+','赵强':'符合预期'},
      {'张明':'符合预期','李华':'超出预期','王芳':'符合预期+','赵强':'符合预期-'},
      {'张明':'符合预期','李华':'符合预期+','王芳':'符合预期','赵强':'符合预期-'},
      {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期','赵强':'符合预期-'},
      {'张明':'超出预期','李华':'超出预期','王芳':'符合预期+','赵强':'符合预期'},
      {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期+','赵强':'符合预期'},
      {'张明':'符合预期+','李华':'超出预期','王芳':'符合预期','赵强':'符合预期'}
    ]
  },
  five: {
    levels: ['D','C','B','A','S'],
    colors: ['#E11D48','#F59E0B','#A1A1AA','#2563EB','#10B981'],
    current: {'张明':'A','李华':'S','王芳':'B','赵强':'B'},
    history: [
      {'张明':'B','李华':'A','王芳':'C','赵强':'B'},
      {'张明':'C','李华':'A','王芳':'B','赵强':'C'},
      {'张明':'B','李华':'S','王芳':'B','赵强':'C'},
      {'张明':'A','李华':'S','王芳':'B','赵强':'B'},
      {'张明':'A','李华':'S','王芳':'B','赵强':'B'},
      {'张明':'S','李华':'S','王芳':'A','赵强':'B'},
      {'张明':'B','李华':'S','王芳':'A','赵强':'C'},
      {'张明':'B','李华':'A','王芳':'B','赵强':'C'},
      {'张明':'A','李华':'S','王芳':'B','赵强':'C'},
      {'张明':'S','李华':'S','王芳':'A','赵强':'B'},
      {'张明':'A','李华':'S','王芳':'A','赵强':'B'},
      {'张明':'A','李华':'S','王芳':'B','赵强':'B'}
    ]
  }
};
var distChart;
var trendChart;

function makeTrendDatasets(rule) {
  return rule.levels.map(function(level, levelIndex) {
    var members = rule.history.map(function(period) {
      return Object.keys(period).filter(function(name){ return period[name] === level; });
    });
    return {
      label: level,
      data: members.map(function(names, periodIndex){ return {x:PERIODS[periodIndex],y:names.length}; }),
      memberNames: members,
      backgroundColor: rule.colors[levelIndex],
      borderRadius: 3,
      borderSkipped: false,
      barPercentage: 0.9,
      categoryPercentage: 0.8
    };
  });
}

function renderTeamCharts(ruleKey) {
  var rule = GRADE_RULES[ruleKey];
  var cycleIndex = PERIOD_KEYS.indexOf(typeof currentCycle === 'undefined' ? '2026-06' : currentCycle);
  var currentResults = cycleIndex >= 0 ? rule.history[cycleIndex] : rule.current;
  var sortedMembers = Object.keys(currentResults).sort(function(a,b) {
    return rule.levels.indexOf(currentResults[a]) - rule.levels.indexOf(currentResults[b]);
  });
  var rankData = sortedMembers.map(function(name){ return {x:name,y:rule.levels.indexOf(currentResults[name])+1}; });
  var memberColors = sortedMembers.map(function(name){ return rule.colors[rule.levels.indexOf(currentResults[name])]; });

  if (distChart) distChart.destroy();
  distChart = new Chart(document.getElementById('chartDist'), {
    type: 'bar',
    data: {labels:sortedMembers,datasets:[{data:rankData,backgroundColor:memberColors,borderRadius:6,barPercentage:.46,categoryPercentage:.72}]},
    options: {
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{title:function(items){return items[0].label},label:function(ctx){return '绩效结果：'+rule.levels[ctx.raw.y-1]}}}},
      scales:{
        y:{min:0,max:rule.levels.length,ticks:{stepSize:1,callback:function(v){return v>0?rule.levels[v-1]:''},font:{family:'Inter, Noto Sans SC, sans-serif',size:10},color:'#71717A'},grid:{color:'#E4E4E7',drawTicks:false}},
        x:{ticks:{font:{family:'Inter, Noto Sans SC, sans-serif',size:11},color:'#71717A',maxRotation:0},grid:{display:false}}
      }
    }
  });

  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('chartTrend'), {
    type:'bar',
    data:{labels:PERIODS,datasets:makeTrendDatasets(rule)},
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:true},
      plugins:{
        legend:{display:true,position:'bottom',labels:{usePointStyle:true,pointStyle:'rectRounded',boxWidth:8,boxHeight:8,padding:10,font:{family:'Inter, Noto Sans SC, sans-serif',size:10},color:'#71717A'}},
        tooltip:{callbacks:{title:function(items){return items[0].label},label:function(ctx){var names=ctx.dataset.memberNames[ctx.dataIndex];return names.length?ctx.dataset.label+'（'+names.length+'人）：'+names.join('、'):''}},filter:function(item){return item.raw.y>0}}
      },
      scales:{
        y:{beginAtZero:true,max:4,stacked:false,ticks:{stepSize:1,callback:function(v){return v+'人'},font:{family:'JetBrains Mono, SF Mono, monospace',size:10},color:'#71717A'},grid:{color:'#E4E4E7',drawTicks:false}},
        x:{stacked:false,ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12,callback:function(v){return this.getLabelForValue(v).replace('年','/').replace('月','')},font:{family:'Inter, Noto Sans SC, sans-serif',size:10},color:'#71717A'},grid:{display:false}}
      }
    }
  });
}

document.getElementById('gradeRuleSelect').addEventListener('change',function(){renderTeamCharts(this.value)});
renderTeamCharts('seven');
</script>
<script src="../navigation.js"></script>
<script>
/* ═══ 周期切换 ═══ */
var currentYear='2026',currentCycle='2026-06';
var CYCLES_BY_YEAR={
  '2026':[{v:'2026-06',t:'6月'},{v:'2026-05',t:'5月'},{v:'2026-04',t:'4月'},{v:'2026-03',t:'3月'},{v:'2026-02',t:'2月'},{v:'2026-01',t:'1月'},{v:'2026-Q2',t:'Q2'},{v:'2026-Q1',t:'Q1'},{v:'2026-H1',t:'H1'},{v:'2026',t:'全年'}],
  '2025':[{v:'2025-12',t:'12月'},{v:'2025-11',t:'11月'},{v:'2025-10',t:'10月'},{v:'2025-09',t:'9月'},{v:'2025-08',t:'8月'},{v:'2025-07',t:'7月'},{v:'2025-06',t:'6月'},{v:'2025-05',t:'5月'},{v:'2025-04',t:'4月'},{v:'2025-03',t:'3月'},{v:'2025-02',t:'2月'},{v:'2025-01',t:'1月'},{v:'2025-Q4',t:'Q4'},{v:'2025-Q3',t:'Q3'},{v:'2025-Q2',t:'Q2'},{v:'2025-Q1',t:'Q1'},{v:'2025-H2',t:'H2'},{v:'2025-H1',t:'H1'},{v:'2025',t:'全年'}],
  '2024':[{v:'2024-12',t:'12月'},{v:'2024-11',t:'11月'},{v:'2024-10',t:'10月'},{v:'2024-Q4',t:'Q4'},{v:'2024-Q3',t:'Q3'},{v:'2024-Q2',t:'Q2'},{v:'2024-Q1',t:'Q1'},{v:'2024-H2',t:'H2'},{v:'2024-H1',t:'H1'},{v:'2024',t:'全年'}]
};

function switchYear(yr){
  currentYear=yr;
  var cycles=CYCLES_BY_YEAR[yr]||[];
  currentCycle=cycles[0].v;
  switchCycle(currentCycle);
  renderPills();
}

function renderPills(){
  var cycles=CYCLES_BY_YEAR[currentYear]||[];
  var h='';
  for(var i=0;i<cycles.length;i++){
    var c=cycles[i];
    var active=c.v===currentCycle?' active':'';
    h+='<span class="cycle-pill'+active+'" onclick="switchCycle(\''+c.v+'\',this)">'+c.t+'</span>';
    if(i<cycles.length-1&&c.t.indexOf('月')>=0&&cycles[i+1]&&cycles[i+1].t.indexOf('月')<0)h+='<span style="color:var(--c3);margin:0 2px">|</span>';
  }
  document.getElementById('cyclePills').innerHTML=h;
}

function switchCycle(val,el){
  currentCycle=val;
  var pills=document.querySelectorAll('.cycle-pill');
  for(var i=0;i<pills.length;i++)pills[i].classList.remove('active');
  if(el)el.classList.add('active');
  if(typeof renderTeamCharts==='function')renderTeamCharts(document.getElementById('gradeRuleSelect').value);
}
renderPills();
</script>
<script>GHR_NAV.init('perf', '团队绩效');</script>
</body>
</html>
