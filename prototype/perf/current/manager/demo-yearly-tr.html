function cellPeopleHtml(people,key){
  if(!people.length)return '';
  return people.map(personChip).join('')+'<button class="person-chip person-chip-more" type="button" style="display:none" data-cell-key="'+key+'" onclick="openBoxCellFullscreen(\''+key+'\')">+0</button>';
}

function peopleOverflow(el){
  return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1;
}

function fitBoxCellPeople(cell){
  var peopleEl=cell.querySelector('.box9-people');
  if(!peopleEl)return;
  var chips=Array.prototype.slice.call(peopleEl.querySelectorAll('.person-chip:not(.person-chip-more)'));
  var moreBtn=peopleEl.querySelector('.person-chip-more');
  chips.forEach(function(c){c.style.display='';});
  if(moreBtn)moreBtn.style.display='none';
  if(!chips.length)return;
  if(!peopleOverflow(peopleEl))return;
  var lo=0,hi=chips.length,best=0;
  while(lo<=hi){
    var mid=(lo+hi)>>1;
    chips.forEach(function(c,i){c.style.display=i<mid?'':'none';});
    if(moreBtn){
      var rest=chips.length-mid;
      if(rest>0){
        moreBtn.style.display='';
        moreBtn.textContent='+'+rest;
      }else{
        moreBtn.style.display='none';
      }
    }
    if(!peopleOverflow(peopleEl)){best=mid;lo=mid+1;}
    else hi=mid-1;
  }
  chips.forEach(function(c,i){c.style.display=i<best?'':'none';});
  if(moreBtn){
    var left=chips.length-best;
    if(left>0){moreBtn.style.display='';moreBtn.textContent='+'+left;}
    else moreBtn.style.display='none';
  }
  if(moreBtn&&moreBtn.style.display!=='none'&&peopleOverflow(peopleEl)&&best>0){
    best-=1;
    chips.forEach(function(c,i){c.style.display=i<best?'':'none';});
    left=chips.length-best;
    moreBtn.style.display='';
    moreBtn.textContent='+'+left;
  }
}

function fitAllBoxCells(){
  document.querySelectorAll('#boxGrid .box9-cell').forEach(fitBoxCellPeople);
}

function boxLvlSpan(v){
  var tone=v==='高'?'high':v==='中'?'mid':'low';
  return '<span class="box9-lvl '+tone+'">'+v+'</span>';
}

function memberBoxName(m){
  if(!m.reached||!m.capability)return '';
  return boxLabel(perfBand(m)+'-'+m.capability);
}

function formatAdjustHistory(m){
  if(m.adjustHistory&&m.adjustHistory.length)return m.adjustHistory.join(' · ');
  if(m.reached&&m.initCapability&&m.capability&&m.initCapability!==m.capability){
    var from=BOX_NAMES[perfBand(m)+'-'+m.initCapability];
    var to=BOX_NAMES[perfBand(m)+'-'+m.capability];
    if(from&&to)return from+'→'+to;
  }
  return '';
}

function setBoxView(mode){
  boxViewMode=mode==='list'?'list':'grid';
  var gridView=document.getElementById('boxGridView');
  var listView=document.getElementById('boxListView');
  if(gridView)gridView.style.display=boxViewMode==='grid'?'':'none';
  if(listView){
    listView.style.display=boxViewMode==='list'?'flex':'none';
    listView.setAttribute('aria-hidden',boxViewMode==='list'?'false':'true');
  }
  document.querySelectorAll('.box-view-btn').forEach(function(btn){
    btn.classList.toggle('on',btn.getAttribute('data-view')===boxViewMode);
  });
  syncBoxStatsPane();
  renderBox();
  if(boxViewMode==='list')renderDist();
  syncSplitPaneHeight();
}

function boxListRowHtml(m,compact){
  var idx=MEMBERS.indexOf(m);
  var grade=m.ratifyGrade||m.grade||'';
  var gradeHtml=grade
    ?('<span class="box9-grade-txt" style="color:'+(GRADE_COLORS[grade]||'var(--c7)')+'">'+grade+'</span>')
    :'<span style="color:var(--c4)">—</span>';
  var box=memberBoxName(m);
  var hist=formatAdjustHistory(m);
  var reason=m.adjustReason||'';
  var histTitle=[hist,reason].filter(Boolean).join('｜');
  var histHtml=(!hist&&!reason)
    ?'<div class="box9-hist-combo empty">—</div>'
    :('<div class="box9-hist-combo" title="'+histTitle.replace(/"/g,'&quot;')+'">'+
        (hist?'<div class="hist-line">'+hist+'</div>':'')+
        (reason?'<div class="reason-line">'+reason+'</div>':'')+
      '</div>');
  var abnType=m.abnormalType||'';
  var abnReason=m.abnormalReason||'';
  var abnHtml=abnType
    ?('<span class="box9-abn-tag">'+abnType+'</span>')
    :'<span class="box9-abn-ok">正常</span>';
  var canAdj=!APPROVE_MODE&&!!m.reached;
  var ICO_ADJ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICO_HIST='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>';
  var action='';
  if(!APPROVE_MODE){
    if(!canAdj)action='<span style="color:var(--c4)">—</span>';
    else{
      /* 收起/展开统一 icon，title 保留原文字 */
      action='<div class="action-stack icon-only">'+
        '<button class="action-icon-btn" type="button" title="调整" aria-label="调整" onclick="openManualAdj('+idx+')">'+ICO_ADJ+'</button>'+
        '<button class="action-icon-btn" type="button" title="调整记录" aria-label="调整记录" onclick="openAdjHistModal('+idx+')">'+ICO_HIST+'</button>'+
      '</div>';
    }
  }
  var nameTd='<td class="col-name"><span class="member-name" onmouseenter="onMemberEnter(event,'+idx+')" onmouseleave="hideChipTip()"><span style="font-weight:500;color:var(--c8)">'+m.name+'</span><div style="margin-top:3px;font:400 10px/1 var(--m);color:var(--c4)">'+m.employeeId+'</div></span></td>';
  var boxTd='<td class="col-box">'+(box||'<span style="color:var(--c4)">—</span>')+'</td>';
  var actTd=APPROVE_MODE?'':('<td class="col-action">'+action+'</td>');
  if(compact){
    return '<tr>'+nameTd+boxTd+actTd+'</tr>';
  }
  return '<tr>'+
    nameTd+
    '<td class="col-status">'+submitTagHtml(m)+'</td>'+
    '<td class="col-grade">'+gradeHtml+'</td>'+
    '<td class="col-cap">'+(m.capability?capTagHtml(m.capability):'<span style="color:var(--c4)">—</span>')+'</td>'+
    boxTd+
    '<td class="col-abn">'+abnHtml+'</td>'+
    '<td class="col-abn-reason"><div class="box9-abn-reason'+(abnReason?'':' empty')+'" title="'+abnReason.replace(/"/g,'&quot;')+'">'+(abnReason||'—')+'</div></td>'+
    '<td class="col-hist">'+histHtml+'</td>'+
    actTd+
  '</tr>';
}

function isBoxListCompact(){
  return currentStep===3&&boxViewMode==='list'&&!!statsGroupsExpanded;
}

function renderBoxListHead(compact){
  var head=document.getElementById('boxListHead');
  if(!head)return;
  if(compact){
    head.innerHTML='<tr><th class="col-name">被考核人</th><th class="col-box">格子</th>'+
      (APPROVE_MODE?'':'<th class="col-action">操作</th>')+'</tr>';
    return;
  }
  head.innerHTML='<tr>'+
    '<th class="col-name">被考核人</th>'+
    '<th class="col-status">提交状态</th>'+
    '<th class="col-grade">绩效等级</th>'+
    '<th class="col-cap">能力</th>'+
    '<th class="col-box">格子</th>'+
    '<th class="col-abn">异常状态</th>'+
    '<th class="col-abn-reason">异常原因</th>'+
    '<th class="col-hist">调整历史/原因</th>'+
    (APPROVE_MODE?'':'<th class="col-action">操作</th>')+
  '</tr>';
}

function renderBoxList(){
  var body=document.getElementById('boxListBody');
  var table=document.getElementById('boxListTable')||document.querySelector('#boxListView .box9-list-table');
  if(!body)return;
  var compact=isBoxListCompact();
  if(table)table.classList.toggle('box9-list-compact',compact);
  renderBoxListHead(compact);
  var rows=getFilteredMembers();
  var cols=compact?(APPROVE_MODE?2:3):(APPROVE_MODE?8:9);
  if(!rows.length){
    body.innerHTML='<tr><td colspan="'+cols+'" style="color:var(--c4);text-align:center;padding:24px">暂无人员</td></tr>';
    return;
  }
  body.innerHTML=rows.map(function(m){return boxListRowHtml(m,compact);}).join('');
}

function renderBox(){
  var gridView=document.getElementById('boxGridView');
  var listView=document.getElementById('boxListView');
  if(boxViewMode==='list'){
    if(gridView)gridView.style.display='none';
    if(listView){listView.style.display='flex';listView.setAttribute('aria-hidden','false');}
    renderBoxList();
  }else{
    if(gridView)gridView.style.display='';
    if(listView){listView.style.display='none';listView.setAttribute('aria-hidden','true');}
    renderBoxGrid();
  }
  document.querySelectorAll('.box-view-btn').forEach(function(btn){
    btn.classList.toggle('on',btn.getAttribute('data-view')===boxViewMode);
  });
}

function onChipDrag(event,idx){
  if(APPROVE_MODE){event.preventDefault();return;}
  dragging=true;
  hideChipTip();
  event.dataTransfer.setData('text/plain',String(idx));
  event.dataTransfer.effectAllowed='move';
}

document.addEventListener('dragend',function(){dragging=false;});

function onBoxOver(event){
  if(APPROVE_MODE)return;
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}

function gradesForBand(band){
  if(band==='高')return ['远超预期','超出预期'];
  if(band==='低')return ['低于预期','远低预期'];
  return ['符合预期+','符合预期','符合预期-'];
}
function defaultGradeForBand(band,prefer){
  var opts=gradesForBand(band);
  if(prefer&&opts.indexOf(prefer)>=0)return prefer;
  return opts[Math.floor((opts.length-1)/2)]||opts[0];
}

var pendingAdj=null;
var openBoxFsCellKey=null;
var BOX_KEYS_ORDER=['高-高','高-中','中-高','高-低','中-中','低-高','中-低','低-中','低-低'];

function closeAdjModal(){
  pendingAdj=null;
  var modal=document.getElementById('adjModal');
  if(!modal)return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  ['adjReasonField','adjGradeField','adjBoxField'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.classList.remove('invalid');
  });
}

function openTierReasonModal(opts){
  if(APPROVE_MODE||!opts)return;
  var m=MEMBERS[opts.idx];
  if(!m||!m.reached)return;
  pendingAdj={
    mode:opts.mode,
    idx:opts.idx,
    from:opts.from,
    to:opts.to,
    manual:false,
    needGrade:false
  };
  hideChipTip();
  closeChipPop();
  var title=document.getElementById('adjModalTitle');
  var meta=document.getElementById('adjModalMeta');
  var boxField=document.getElementById('adjBoxField');
  var gradeField=document.getElementById('adjGradeField');
  var reasonField=document.getElementById('adjReasonField');
  var reasonInput=document.getElementById('adjReasonInput');
  if(title)title.textContent=opts.title||'跨档调整';
  if(meta){
    var kindLabel=opts.mode==='tierCap'?'能力':'等级';
    meta.innerHTML='将 <b>'+m.name+'</b> 的'+kindLabel+'从「'+(opts.from||'—')+'」调整到「'+(opts.to||'—')+'」'+
      '<br>跨 2 档及以上须填写调整原因';
  }
  if(boxField){boxField.style.display='none';boxField.classList.remove('invalid');}
  if(gradeField){gradeField.style.display='none';gradeField.classList.remove('invalid');}
  if(reasonField){reasonField.style.display='';reasonField.classList.remove('invalid');}
  if(reasonInput)reasonInput.value='';
  var modal=document.getElementById('adjModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  setTimeout(function(){if(reasonInput)reasonInput.focus();},40);
}

function fillAdjBoxSelect(selectedKey,excludeKey){
  var sel=document.getElementById('adjBoxSelect');
  if(!sel)return;
  sel.innerHTML=BOX_KEYS_ORDER.map(function(k){
    var dis=excludeKey&&k===excludeKey?' disabled':'';
    return '<option value="'+k+'"'+(k===selectedKey?' selected':'')+dis+'>'+boxLabel(k)+'</option>';
  }).join('');
}

function syncAdjGradeField(){
  if(!pendingAdj)return;
  var gradeField=document.getElementById('adjGradeField');
  var gradeSelect=document.getElementById('adjGradeSelect');
  var needGrade=pendingAdj.fromPerf!==pendingAdj.perf;
  pendingAdj.needGrade=needGrade;
  gradeField.classList.remove('invalid');
  if(needGrade){
    gradeField.style.display='';
    var m=MEMBERS[pendingAdj.idx];
    var prefer=(m&&(m.ratifyGrade||m.grade))||'';
    var opts=gradesForBand(pendingAdj.perf);
    gradeSelect.innerHTML=GRADE_OPTIONS.map(function(g){
      var inBand=opts.indexOf(g)>=0;
      return '<option value="'+g+'"'+(inBand?'':' disabled')+'>'+g+(inBand?'':'（不在'+pendingAdj.perf+'档）')+'</option>';
    }).join('');
    gradeSelect.value=defaultGradeForBand(pendingAdj.perf,prefer);
  }else{
    gradeField.style.display='none';
    gradeSelect.innerHTML='';
  }
}

function refreshAdjMeta(){
  if(!pendingAdj)return;
  var m=MEMBERS[pendingAdj.idx];
  if(!m)return;
  var meta=document.getElementById('adjModalMeta');
  var targetName=BOX_NAMES[pendingAdj.perf+'-'+pendingAdj.cap]||(pendingAdj.perf+'·'+pendingAdj.cap);
  var fromName=pendingAdj.fromCap?BOX_NAMES[pendingAdj.fromPerf+'-'+pendingAdj.fromCap]:(pendingAdj.fromPerf+'·未校准');
  meta.innerHTML='将 <b>'+m.name+'</b> 从「'+fromName+'」调整到「'+targetName+'」'+
    '<br>绩效 '+(pendingAdj.fromPerf===pendingAdj.perf?pendingAdj.fromPerf:(pendingAdj.fromPerf+' → '+pendingAdj.perf))+' · 能力 '+(pendingAdj.fromCap||'—')+' → '+pendingAdj.cap;
}

function onAdjBoxChange(){
  if(!pendingAdj||!pendingAdj.manual)return;
  var key=document.getElementById('adjBoxSelect').value;
  var parts=String(key||'').split('-');
  if(parts.length<2)return;
  pendingAdj.perf=parts[0];
  pendingAdj.cap=parts[1];
  document.getElementById('adjBoxField').classList.remove('invalid');
  refreshAdjMeta();
  syncAdjGradeField();
}

function openAdjModal(idx,perf,cap,manual){
  if(APPROVE_MODE)return;
  var m=MEMBERS[idx];
  if(!m||!m.reached)return;
  var fromPerf=perfBand(m);
  var fromCap=m.capability||'';
  if(!manual&&fromPerf===perf&&fromCap===cap)return;
  pendingAdj={mode:'box',idx:idx,perf:perf,cap:cap,needGrade:fromPerf!==perf,fromPerf:fromPerf,fromCap:fromCap,manual:!!manual};
  hideChipTip();
  closeChipPop();
  var title=document.getElementById('adjModalTitle');
  if(title)title.textContent='校准调整';
  var boxField=document.getElementById('adjBoxField');
  var reasonField=document.getElementById('adjReasonField');
  var reasonInput=document.getElementById('adjReasonInput');
  reasonField.classList.remove('invalid');
  boxField.classList.remove('invalid');
  if(manual){
    boxField.style.display='';
    var curKey=fromCap?(fromPerf+'-'+fromCap):'';
    fillAdjBoxSelect(perf&&cap?(perf+'-'+cap):(BOX_KEYS_ORDER[0]),null);
    if(curKey)document.getElementById('adjBoxSelect').value=perf&&cap?(perf+'-'+cap):BOX_KEYS_ORDER.filter(function(k){return k!==curKey;})[0];
    onAdjBoxChange();
  }else{
    boxField.style.display='none';
    refreshAdjMeta();
    syncAdjGradeField();
  }
  reasonInput.value=m.adjustReason||'';
  var modal=document.getElementById('adjModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  setTimeout(function(){(manual?document.getElementById('adjBoxSelect'):reasonInput).focus();},40);
}

function openManualAdj(idx){
  if(APPROVE_MODE)return;
  var m=MEMBERS[idx];
  if(!m||!m.reached)return;
  var fromPerf=perfBand(m);
  var fromCap=m.capability||'中';
  var cur=fromPerf+'-'+fromCap;
  var next=BOX_KEYS_ORDER.filter(function(k){return k!==cur;})[0]||'中-中';
  var parts=next.split('-');
  openAdjModal(idx,parts[0],parts[1],true);
}

function getAdjHistList(m){
  if(!m)return [];
  return (m.adjHist||[]).slice().sort(function(a,b){
    return String(b.time||'').localeCompare(String(a.time||''));
  });
}

function closeAdjHistModal(){
  var modal=document.getElementById('adjHistModal');
  if(!modal)return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
}

function openAdjHistModal(idx){
  var m=MEMBERS[idx];
  if(!m)return;
  hideChipTip();
  closeChipPop();
  var title=document.getElementById('adjHistModalTitle');
  var body=document.getElementById('adjHistModalBody');
  var modal=document.getElementById('adjHistModal');
  if(!title||!body||!modal)return;
  title.textContent=m.name+' · 调整记录';
  var list=getAdjHistList(m);
  if(!list.length){
    body.innerHTML='<div class="adj-hist-empty">暂无调整记录</div>';
  }else{
    body.innerHTML='<table class="adj-hist-table"><thead><tr>'+
      '<th class="col-t">时间</th><th class="col-who">操作人</th><th class="col-type">调整类型</th>'+
      '<th class="col-chg">从 → 到</th><th class="col-why">原因</th>'+
      '</tr></thead><tbody>'+list.map(function(r){
        var why=r.reason||'';
        return '<tr>'+
          '<td class="col-t">'+((r.time||'—'))+'</td>'+
          '<td class="col-who">'+(r.who||'—')+'</td>'+
          '<td class="col-type"><span class="adj-hist-type">'+(r.type||'调整')+'</span></td>'+
          '<td class="col-chg adj-hist-chg">'+(r.from||'—')+' → '+(r.to||'—')+'</td>'+
          '<td class="col-why adj-hist-why'+(why?'':' empty')+'">'+(why||'—')+'</td>'+
        '</tr>';
      }).join('')+'</tbody></table>';
  }
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}

function confirmAdjModal(){
  if(!pendingAdj)return;
  var m=MEMBERS[pendingAdj.idx];
  if(!m){closeAdjModal();return;}

  if(pendingAdj.mode==='tierGrade'||pendingAdj.mode==='tierCap'){
    var tierReasonField=document.getElementById('adjReasonField');
    var tierReason=(document.getElementById('adjReasonInput').value||'').trim();
    tierReasonField.classList.remove('invalid');
    if(!tierReason){tierReasonField.classList.add('invalid');return;}
    if(pendingAdj.mode==='tierGrade'){
      applyGradeChange(m,pendingAdj.to,tierReason);
      closeAdjModal();
      renderDist();
      updateStats(getFilteredMembers());
      renderMembers();
      showToast('已调整'+m.name+'等级为「'+m.ratifyGrade+'」');
    }else{
      applyCapChange(m,pendingAdj.to,tierReason);
      closeAdjModal();
      if(currentStep===3){renderBox();renderDist();updateStats(getFilteredMembers());}
      else renderMembers();
      showToast('已校准'+m.name+'能力为「'+m.capability+'」');
    }
    return;
  }

  if(pendingAdj.manual){
    var boxKey=document.getElementById('adjBoxSelect').value;
    var parts=String(boxKey||'').split('-');
    if(parts.length<2){document.getElementById('adjBoxField').classList.add('invalid');return;}
    pendingAdj.perf=parts[0];
    pendingAdj.cap=parts[1];
    pendingAdj.needGrade=pendingAdj.fromPerf!==pendingAdj.perf;
  }
  if(pendingAdj.fromPerf===pendingAdj.perf&&pendingAdj.fromCap===pendingAdj.cap){
    document.getElementById('adjBoxField').classList.add('invalid');
    showToast('请选择与当前不同的格子');
    return;
  }
  var reasonField=document.getElementById('adjReasonField');
  var gradeField=document.getElementById('adjGradeField');
  var reason=(document.getElementById('adjReasonInput').value||'').trim();
  var ok=true;
  reasonField.classList.remove('invalid');
  gradeField.classList.remove('invalid');
  if(!reason){reasonField.classList.add('invalid');ok=false;}
  var grade='';
  if(pendingAdj.needGrade){
    grade=document.getElementById('adjGradeSelect').value;
    if(!grade||gradesForBand(pendingAdj.perf).indexOf(grade)<0){gradeField.classList.add('invalid');ok=false;}
  }
  if(!ok)return;
  var fromBox=pendingAdj.fromCap?BOX_NAMES[pendingAdj.fromPerf+'-'+pendingAdj.fromCap]:(pendingAdj.fromPerf+'·未校准');
  var fromGrade=m.ratifyGrade||m.grade||'';
  ensureNodeOrig(m);
  m.capability=pendingAdj.cap;
  m.adjustReason=reason;
  if(pendingAdj.needGrade)m.ratifyGrade=grade;
  var targetName=BOX_NAMES[perfBand(m)+'-'+m.capability];
  if(!m.adjustHistory)m.adjustHistory=[];
  m.adjustHistory.push(fromBox+'→'+targetName);
  if(!m.adjHist)m.adjHist=[];
  var ts=adjTimestamp();
  m.adjHist.push({
    time:ts,
    who:'当前用户',
    type:'格子',
    from:fromBox,
    to:targetName,
    reason:reason
  });
  if(pendingAdj.needGrade&&grade){
    m.adjHist.push({
      time:ts,
      who:'当前用户',
      type:'等级',
      from:fromGrade||'—',
      to:grade,
      reason:reason
    });
  }
  markNodeAdjusted(m,fromBox+'→'+targetName);
  var stayKey=openBoxFsCellKey;
  closeAdjModal();
  renderBox();
  renderDist();
  updateStats(getFilteredMembers());
  if(currentStep!==3)renderMembers();
  if(stayKey){
    var overlay=document.getElementById('boxFsOverlay');
    if(overlay&&overlay.classList.contains('open'))openBoxCellFullscreen(stayKey);
  }
  showToast('已调整'+m.name+'至「'+targetName+'」');
}

function onBoxDrop(event,perf,cap){
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if(APPROVE_MODE)return;
  var idx=parseInt(event.dataTransfer.getData('text/plain'),10);
  var m=MEMBERS[idx];
  if(!m||!m.reached)return;
  openAdjModal(idx,perf,cap,false);
}

function closeChipPop(){
  var pop=document.getElementById('chipPop');
  if(pop)pop.classList.remove('open');
}

var chipTipTimer=null;
function chipTipRows(m,idx){
  var box=m.capability?boxLabel(perfBand(m)+'-'+m.capability):'—';
  var prevNum=m.prevBox?boxNumOf(m.prevBox):0;
  var rows=[
    ['姓名',m.name],
    ['工号',m.employeeId],
    ['部门',m.dept],
    ['职位',m.role],
    ['审定绩效',(m.ratifyGrade||m.grade||'—')+'（'+perfBand(m)+'）'],
    ['能力',m.capability||'—'],
    ['九宫格',box],
    ['上年盘点结果',prevNum||'—']
  ];
  var html=rows.map(function(r){return '<div class="chip-tip-row"><span class="chip-tip-k">'+r[0]+'</span><span class="chip-tip-v">'+r[1]+'</span></div>';}).join('');
  if(m.abnormalType){
    html+='<div class="chip-tip-abn"><b>异常 · '+m.abnormalType+'</b>'+(m.abnormalReason?'<br>'+m.abnormalReason:'')+'</div>';
  }
  if(!APPROVE_MODE&&currentStep===3&&m.reached){
    html+='<div class="chip-tip-act"><button class="btn btn-s btn-sm" type="button" onclick="event.stopPropagation();hideChipTip();openManualAdj('+idx+')">调整格子…</button></div>';
  }
  return html;
}
function memberTipRows(m){
  var rows=[
    ['姓名',m.name],
    ['工号',m.employeeId],
    ['部门',m.dept],
    ['职位',m.role],
    ['职级',m.level],
    ['累计司龄(年)',m.tenure],
    ['考核组',m.group],
    ['划分区域',m.region]
  ];
  return rows.map(function(r){return '<div class="chip-tip-row"><span class="chip-tip-k">'+r[0]+'</span><span class="chip-tip-v">'+r[1]+'</span></div>';}).join('');
}
function placeNearChip(el,panel,gap){
  if(panel.parentNode!==document.body)document.body.appendChild(panel);
  var r=el.getBoundingClientRect();
  var tw=panel.offsetWidth||248;
  var th=panel.offsetHeight||1;
  var x=r.right+(gap||8);
  if(x+tw>window.innerWidth-8)x=r.left-tw-8;
  x=Math.max(8, Math.min(x, window.innerWidth-tw-8));
  var y=Math.max(8, Math.min(r.top, window.innerHeight-th-8));
  panel.style.left=x+'px';
  panel.style.top=y+'px';
}
function onMemberEnter(event,idx){
  var el=event.currentTarget;
  clearTimeout(chipTipTimer);
  chipTipTimer=setTimeout(function(){
    var m=MEMBERS[idx];
    if(!m||!el)return;
    var tip=document.getElementById('chipTip');
    if(tip.parentNode!==document.body)document.body.appendChild(tip);
    tip.classList.remove('interactive');
    tip.innerHTML=memberTipRows(m);
    tip.classList.add('open');
    placeNearChip(el,tip,8);
  },80);
}
function onChipEnter(event,idx){
  if(dragging)return;
  clearTimeout(chipTipTimer);
  var el=event.currentTarget;
  chipTipTimer=setTimeout(function(){
    if(dragging)return;
    var m=MEMBERS[idx];
    if(!m||!el)return;
    var tip=document.getElementById('chipTip');
    if(tip.parentNode!==document.body)document.body.appendChild(tip);
    tip.classList.toggle('interactive',!APPROVE_MODE&&currentStep===3);
    tip.innerHTML=chipTipRows(m,idx);
    tip.classList.add('open');
    placeNearChip(el,tip,8);
  },80);
}
function scheduleHideChipTip(){
  clearTimeout(chipTipTimer);
  chipTipTimer=setTimeout(hideChipTip,160);
}
function hideChipTip(){
  clearTimeout(chipTipTimer);
  var tip=document.getElementById('chipTip');
  if(tip){
    tip.classList.remove('open');
    tip.classList.remove('interactive');
  }
}

(function bindChipTipHover(){
  var tip=document.getElementById('chipTip');
  if(!tip)return;
  tip.addEventListener('mouseenter',function(){clearTimeout(chipTipTimer);});
  tip.addEventListener('mouseleave',scheduleHideChipTip);
})();

applyApproveMode();
if(APPROVE_MODE)goStep(3);
else renderAll();

</script>
