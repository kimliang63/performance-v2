<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR ONE - 绩效方案配置</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pr:#2563EB;--pr50:#F0F5FF;--pr100:#E0EAFF;--pr200:#C7D7FE;--pr700:#1D4ED8;--pr900:#1E3A8A;
  --em:#10B981;--em50:#ECFDF5;--em100:#D1FAE5;--em700:#047857;
  --ac:#F59E0B;--ac50:#FFFBEB;--ac100:#FDE68A;
  --ro:#F43F5E;--ro50:#FFF1F2;--ro100:#FFE4E6;
  --vi:#8B5CF6;--vi50:#F5F3FF;
  --c9:#18181B;--c8:#27272A;--c7:#3F3F46;--c6:#52525B;--c5:#71717A;--c4:#A1A1AA;--c3:#D4D4D8;--c2:#E4E4E7;--c1:#F4F4F5;--c0:#FAFAFA;
  --sf:#FFF;--bg:#FAFAF9;--dv:#F4F4F5;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-card-hover:0 8px 20px -4px rgba(0,0,0,.08),0 2px 6px -2px rgba(0,0,0,.04);
  --r1:6px;--r2:8px;--r3:10px;--r4:14px;
  --f:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --m:'JetBrains Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--c7);-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--c3);border-radius:3px}

/* ═══ HEADER ═══ */
.hdr{height:52px;background:var(--sf);border-bottom:1px solid var(--dv);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px}
.logo-i{width:28px;height:28px;border-radius:6px;background:var(--pr);display:flex;align-items:center;justify-content:center}
.logo-i svg{width:15px;height:15px;color:#FFF}
.logo-t{font-size:15px;font-weight:700;color:var(--c9);letter-spacing:-.3px}
.hdr-title{font:600 14px/1 var(--f);color:var(--c9)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;gap:5px;padding:0 14px;height:32px;border-radius:var(--r1);font:500 13px/1 var(--f);cursor:pointer;transition:all .12s;border:none;font-family:inherit}
.btn svg{width:13px;height:13px}
.btn-p{background:var(--pr);color:#FFF}.btn-p:hover{background:var(--pr700)}
.btn-s{background:var(--sf);color:var(--c6);border:1px solid var(--c2)}.btn-s:hover{border-color:var(--c3);color:var(--c8);background:var(--c0)}
.btn-d{background:var(--ro50);color:var(--ro);border:1px solid var(--ro100)}.btn-d:hover{background:var(--ro100)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}

/* ═══ LAYOUT ═══ */
.wiz{display:flex;height:calc(100vh - 52px)}

/* ═══ SIDEBAR ═══ */
.wiz-sb{width:220px;background:var(--sf);border-right:1px solid var(--dv);display:flex;flex-direction:column;flex-shrink:0}
.wiz-sb-hd{padding:16px;border-bottom:1px solid var(--dv);display:flex;align-items:center;justify-content:space-between}
.wiz-sb-t{font:600 13px/1 var(--f);color:var(--c9)}
.wiz-sb-icons{display:flex;gap:4px}
.wiz-sb-icons button{width:24px;height:24px;border-radius:var(--r1);border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c4);transition:all .12s}
.wiz-sb-icons button:hover{background:var(--c1);color:var(--c7)}
.wiz-sb-icons button svg{width:14px;height:14px}
.wiz-sb-bd{flex:1;overflow-y:auto;padding:8px}
.wiz-sb-ft{padding:14px 16px;border-top:1px solid var(--dv)}
.wiz-sb-ft-t{font:500 12px/1 var(--f);color:var(--c6);margin-bottom:8px}
.wiz-sb-ft-bar{height:6px;background:var(--c1);border-radius:3px;overflow:hidden}
.wiz-sb-ft-fill{height:100%;background:var(--pr);border-radius:3px;transition:width .3s}
.wiz-sb-ft-pct{font:600 12px/1 var(--f);color:var(--pr);margin-top:6px;text-align:right}

/* Sidebar items */
.sb-group{margin-bottom:2px}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:var(--r1);cursor:pointer;
  transition:all .12s;font:400 13px/1.3 var(--f);color:var(--c6);
}
.sb-item:hover{background:var(--c0);color:var(--c8)}
.sb-item.on{background:var(--pr50);color:var(--pr);font-weight:600}
.sb-item.on::before{
  content:'';position:absolute;left:0;top:5px;bottom:5px;
  width:3px;background:var(--pr);border-radius:0 2px 2px 0;
}
.sb-item{position:relative}
.sb-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-icon svg{width:11px;height:11px}
.sb-icon.done{background:var(--em50);color:var(--em)}
.sb-icon.done svg{color:var(--em)}
.sb-icon.warn{background:var(--ac50);color:var(--ac)}
.sb-icon.warn svg{color:var(--ac)}
.sb-icon.pending{background:var(--c1);color:var(--c4)}
.sb-icon.pending svg{color:var(--c4)}
.sb-icon.active{background:var(--pr50);color:var(--pr)}
.sb-icon.active svg{color:var(--pr)}
.sb-sub{padding-left:28px}
.sb-sub .sb-item{font-size:13px;padding:6px 12px}

/* ═══ CONTENT ═══ */
.wiz-ct{flex:1;overflow-y:auto;padding:24px}

/* ═══ FORM ═══ */
.form-sec{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);margin-bottom:16px;overflow:hidden}
.form-sec-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--dv);cursor:pointer;transition:background .12s}
.form-sec-hd:hover{background:var(--c0)}
.form-sec-hd-l{display:flex;align-items:center;gap:8px}
.form-sec-t{font:600 14px/1.3 var(--f);color:var(--c9)}
.form-sec-hd svg{width:14px;height:14px;color:var(--c4);transition:transform .2s}
.form-sec.open .form-sec-hd svg{transform:rotate(180deg)}
.form-sec-bd{padding:16px 20px}
.form-sec.open .form-sec-bd{display:block}
.form-sec-bd{display:none}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.form-row.tri{grid-template-columns:repeat(3,1fr)}
.form-row.quad{grid-template-columns:repeat(4,1fr)}
.form-grp{display:flex;flex-direction:column;gap:5px}
.form-lb{font:500 12px/1 var(--f);color:var(--c6)}
.form-lb .req{color:var(--ro);margin-left:2px}
.form-input{height:34px;padding:0 10px;border:1px solid var(--c2);border-radius:var(--r1);font:400 13px/1 var(--f);color:var(--c9);background:var(--sf);transition:border-color .12s;outline:none}
.form-input:focus{border-color:var(--pr)}
select.form-input{cursor:pointer;padding-right:24px;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center}
textarea.form-input{height:auto;padding:8px 10px;resize:vertical;min-height:60px}
.form-hint{font:400 11px/1 var(--f);color:var(--c4)}

/* ═══ 盘点强制分布（主行三列 + 下方规则表） ═══ */
.fd-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--dv)}
.fd-block-t{font:600 13px/1 var(--f);color:var(--c9);margin-bottom:12px}
.fd-side{margin-bottom:16px}
.fd-side:last-child{margin-bottom:0}
.fd-side-lb{font:600 12px/1 var(--f);color:var(--c8);margin-bottom:8px}
.fd-side .form-row.fd-main{margin-bottom:0}
.fd-rule-pick{display:inline-block;min-width:0}
.fd-rule-sel{
  width:132px;min-width:132px;max-width:132px;
  text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
}
.fd-rule-detail{
  font:400 12px/1.45 var(--f);color:var(--c7);
  white-space:pre-line;min-width:0;
}
.fd-group-panel{
  margin-top:8px;padding:8px 12px 10px;background:var(--c0);
  border-left:3px solid var(--pr);border-radius:0 var(--r1) var(--r1) 0;
  animation:fdFadeIn .16s ease;
}
.fd-group-panel .tbl th,.fd-group-panel .tbl td{padding:6px 8px;vertical-align:middle}
.fd-group-panel .tbl th{background:transparent}
@keyframes fdFadeIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}

/* ═══ RADIO ═══ */
.radio-group{display:flex;gap:16px}
.radio{display:flex;align-items:center;gap:6px;cursor:pointer;font:400 13px/1 var(--f);color:var(--c7)}
.radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--c3);display:flex;align-items:center;justify-content:center;transition:all .12s}
.radio.on .radio-dot{border-color:var(--pr)}
.radio.on .radio-dot::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--pr)}

/* ═══ TABLE ═══ */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 12px/1 var(--f);color:var(--c5);text-align:left;padding:8px 10px;border-bottom:1px solid var(--dv);background:var(--c0);position:sticky;top:0}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--dv);font:400 13px/1.3 var(--f);color:var(--c7)}
.tbl tr:hover td{background:var(--c0)}
.tbl .act{display:flex;gap:4px}
.tbl .act button{width:28px;height:28px;border-radius:var(--r1);border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c5);transition:all .12s}
.tbl .act button:hover{background:var(--c1);color:var(--c7)}
.tbl .act button.del:hover{background:var(--ro50);color:var(--ro)}
.tbl .act button svg{width:14px;height:14px}

/* ═══ 九宫格看板（对齐 demo-yearly-tr：绩效纵×能力横） ═══ */
.wiz-box9-board{padding:14px;background:var(--c0);border:1px solid var(--dv);border-radius:var(--r2)}
.wiz-box9-grid{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));grid-template-rows:22px repeat(3,minmax(128px,1fr));gap:6px;min-height:420px}
.wiz-box9-x,.wiz-box9-y{font:600 11px/1 var(--f);color:var(--c6);display:flex;align-items:center;justify-content:center;gap:2px}
.wiz-box9-y{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em}
.wiz-box9-lvl.high{color:var(--em)}
.wiz-box9-lvl.mid{color:var(--ac)}
.wiz-box9-lvl.low{color:var(--ro)}
.wiz-box9-cell{border-radius:var(--r2);padding:8px;min-height:0;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;overflow:visible}
.wiz-box9-cell[data-cell="高-高"],
.wiz-box9-cell[data-cell="高-中"],
.wiz-box9-cell[data-cell="中-高"]{background:var(--em50);border:1px solid #A7F3D0}
.wiz-box9-cell[data-cell="中-中"],
.wiz-box9-cell[data-cell="高-低"],
.wiz-box9-cell[data-cell="低-高"]{background:var(--pr50);border:1px solid var(--pr200)}
.wiz-box9-cell[data-cell="中-低"],
.wiz-box9-cell[data-cell="低-中"],
.wiz-box9-cell[data-cell="低-低"]{background:var(--ro50);border:1px solid #FECDD3}
.wiz-box9-name-row{display:flex;align-items:center;gap:6px;min-width:0}
.wiz-box9-seq{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 var(--f);color:var(--c6);background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.06);user-select:none;pointer-events:none}
.wiz-box9-name{height:30px;padding:0 8px;border:1px solid rgba(255,255,255,.7);border-radius:var(--r1);font:600 13px/1 var(--f);color:var(--c8);background:rgba(255,255,255,.85);outline:none;width:100%;min-width:0;flex:1}
.wiz-box9-name:focus{border-color:var(--pr);background:#FFF}
.wiz-box9-binds{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.wiz-box9-bind{display:grid;grid-template-columns:36px 1fr;align-items:start;gap:4px}
.wiz-box9-bind-lb{font:500 10px/1 var(--f);color:var(--c5);padding-top:9px}
.wiz-box9-bind select{height:28px;padding:0 22px 0 6px;border:1px solid rgba(255,255,255,.7);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c8);background:rgba(255,255,255,.85);outline:none;width:100%;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23A1A1AA' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;background-color:rgba(255,255,255,.85)}
.wiz-box9-bind select:focus{border-color:var(--pr);background-color:#FFF}
.wiz-box9-bind .leave-ms{min-width:0;width:100%;flex:none}
.wiz-box9-bind .leave-ms-trigger{min-height:28px;padding:3px 22px 3px 6px;border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.85);font-size:11px;gap:3px}
.wiz-box9-bind .leave-ms.open .leave-ms-trigger{border-color:var(--pr);background:#FFF}
.wiz-box9-bind .leave-ms-tag{height:18px;padding:0 5px;font:500 10px/18px var(--f);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-box9-bind .leave-ms-menu{z-index:40;max-height:180px}
.wiz-box9-bind .leave-ms-opt{font-size:11px;padding:5px 8px}
@media (max-width:640px){
  .wiz-box9-grid{grid-template-columns:1fr;grid-template-rows:none;min-height:0}
  .wiz-box9-y{writing-mode:horizontal-tb;letter-spacing:0;justify-content:flex-start;padding:4px 0 0}
  .wiz-box9-x{display:none}
  .wiz-box9-x.corner{display:none}
}

/* ═══ TOGGLE ═══ */
.tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.tog-track{width:36px;height:20px;background:var(--c3);border-radius:10px;position:relative;transition:background .15s}
.tog.on .tog-track{background:var(--pr)}
.tog-knob{width:16px;height:16px;background:#FFF;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog.on .tog-knob{transform:translateX(16px)}
.tog-lb{font:400 13px/1 var(--f);color:var(--c7)}

/* ═══ STAGE TOGGLES ═══ */
.stage-list{display:flex;flex-direction:column;gap:8px}
.stage-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--dv);border-radius:var(--r1);transition:all .12s}
.stage-item:hover{border-color:var(--c3);background:var(--c0)}
.stage-item.off{opacity:.5}
.stage-name{font:500 13px/1 var(--f);color:var(--c8)}
.stage-desc{font:400 11px/1 var(--f);color:var(--c4);margin-top:2px}
.stage-pending{font:500 10px/1 var(--f);padding:2px 6px;border-radius:3px;background:var(--c1);color:var(--c5)}

/* ═══ RULE BUILDER ═══ */
.rule-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rule-row select,.rule-row input{height:32px;padding:0 8px;border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c7);background:var(--sf);outline:none}
.rule-row select:focus,.rule-row input:focus{border-color:var(--pr)}

/* ═══ AUTO REMOVE RULES ═══ */
.ar-panel{transition:opacity .15s}
.ar-panel.is-off{opacity:.5;pointer-events:none}
.ar-list{display:flex;flex-direction:column;gap:8px}
.ar-rule{padding:8px 10px;border:1px solid var(--dv);border-radius:var(--r1);background:var(--c0)}
.ar-rule-hd{display:flex;align-items:center;gap:8px;cursor:pointer;font:500 13px/1 var(--f);color:var(--c8);user-select:none}
.ar-rule-hd input{accent-color:var(--pr)}
.ar-rule-cfg{margin-top:8px;padding-left:24px;display:flex;flex-direction:column;gap:8px}
.ar-days{display:flex;align-items:center;gap:6px;font:400 12px/1 var(--f);color:var(--c6);flex-wrap:wrap}
.ar-days input{width:64px;height:28px;padding:0 8px;border:1px solid var(--c2);border-radius:var(--r1);font:400 12px/1 var(--f);color:var(--c9);background:var(--sf);outline:none;text-align:center}
.ar-days input:focus{border-color:var(--pr)}
.ar-leave{display:flex;align-items:flex-start;gap:8px}
.ar-leave-lb{font:400 12px/28px var(--f);color:var(--c6);flex-shrink:0}
.leave-ms{position:relative;flex:1;min-width:180px}
.leave-ms-trigger{width:100%;min-height:28px;padding:3px 28px 3px 8px;border:1px solid var(--c2);border-radius:var(--r1);background:var(--sf);cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px;text-align:left;font:400 12px/1 var(--f);color:var(--c7);position:relative;font-family:inherit}
.leave-ms-trigger:hover{border-color:var(--c3)}
.leave-ms.open .leave-ms-trigger{border-color:var(--pr)}
.leave-ms-trigger::after{content:'';position:absolute;right:10px;top:50%;margin-top:-2px;border:4px solid transparent;border-top-color:var(--c4)}
.leave-ms-ph{color:var(--c4)}
.leave-ms-tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;background:var(--pr50);color:var(--pr);font:500 11px/20px var(--f)}
.leave-ms-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--sf);border:1px solid var(--c2);border-radius:var(--r1);box-shadow:var(--shadow-card-hover);padding:6px 0;max-height:220px;overflow-y:auto}
.leave-ms.open .leave-ms-menu{display:block}
.leave-ms-opt{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font:400 12px/1 var(--f);color:var(--c7)}
.leave-ms-opt:hover{background:var(--c0)}
.leave-ms-opt input{accent-color:var(--pr)}

/* ═══ GROUP PANEL ═══ */
.grp-panel{display:flex;gap:16px}
.grp-list{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.grp-item{padding:10px 12px;border:1px solid var(--dv);border-radius:var(--r1);cursor:pointer;transition:all .12s}
.grp-item:hover{border-color:var(--c3);background:var(--c0)}
.grp-item.on{border-color:var(--pr);background:var(--pr50)}
.grp-item-n{font:500 13px/1 var(--f);color:var(--c8)}
.grp-item-s{font:400 11px/1 var(--f);color:var(--c4);margin-top:3px}
.grp-config{flex:1;min-width:0}

/* ═══ STAGE CONFIG ═══ */
.stage-cfg{background:var(--sf);border-radius:var(--r3);box-shadow:var(--shadow-card);margin-bottom:16px;overflow:hidden}
.stage-cfg-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--dv);cursor:pointer;transition:background .12s}
.stage-cfg-hd:hover{background:var(--c0)}
.stage-cfg-hd-l{display:flex;align-items:center;gap:10px}
.stage-cfg-hd-t{font:600 14px/1.3 var(--f);color:var(--c9)}
.stage-cfg-hd-s{font:400 12px/1 var(--f);color:var(--c5)}
.stage-cfg-hd svg{width:14px;height:14px;color:var(--c4);transition:transform .2s}
.stage-cfg.open .stage-cfg-hd svg{transform:rotate(180deg)}
.stage-cfg-bd{padding:16px 20px;display:none}
.stage-cfg.open .stage-cfg-bd{display:block}

/* ═══ WEIGHT TABLE ═══ */
.wt-sum{display:flex;align-items:center;gap:8px;margin-top:8px;font:500 12px/1 var(--f);color:var(--c5)}
.wt-sum .ok{color:var(--em)}
.wt-sum .err{color:var(--ro)}

/* ═══ ANIMATION ═══ */
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .2s ease forwards}
</style>

function applyTemplate(tplKey){
  const tpl=TEMPLATES[tplKey];

  curTemplate=tplKey;

    s.enabled=tpl.stages.includes(s.id);

  const cur=form.stages.find(s=>s.id===activeSection);
  if(cur&&!cur.enabled) activeSection='stages';
  renderSettingsModal();
}

/** 结果审定 ↔ 绩效盘点：不可同时启用 */
function enforceRatifyInventoryMutex(turnedOnId){
  if(turnedOnId!=='ratify'&&turnedOnId!=='inventory') return;
  const otherId=turnedOnId==='ratify'?'inventory':'ratify';
  const other=form.stages.find(s=>s.id===otherId);
  if(!other||!other.enabled) return;
  other.enabled=false;
  if(activeSection===otherId) activeSection='stages';
  const tip=turnedOnId==='inventory'
    ?'已开启绩效盘点，结果审定已关闭（二者不可同时启用）'
    :'已开启结果审定，绩效盘点已关闭（二者不可同时启用）';
  if(typeof GHR_NAV!=='undefined'&&GHR_NAV.showToast) GHR_NAV.showToast(tip);
}

function toggleStage(i){
  const stage=form.stages[i];
  const turningOn=!stage.enabled;
  stage.enabled=turningOn;
  if(turningOn) enforceRatifyInventoryMutex(stage.id);
  if(!stage.enabled&&activeSection===stage.id) activeSection='stages';
  renderSettingsModal();
}

  return GRADE_RULES.find(r=>r.name===form.gradeRule)||GRADE_RULES[0];
}
function getSelectedCapabilityRule(){
  return CAPABILITY_RULES.find(r=>r.name===form.capabilityRule)||CAPABILITY_RULES[0];
}
function isInventoryEnabled(){
  const s=form.stages.find(x=>x.id==='inventory');
  return !!(s&&s.enabled);
}

function openSettings(){
  const modal=document.getElementById('settingsModal');
  modal.style.display='flex';
  renderSettingsModal();
}

function closeSettings(){
  document.getElementById('settingsModal').style.display='none';
  render(); // 刷新主界面
}

function renderSettingsModal(){
  const body=document.getElementById('settingsBody');
  if(!body)return;
  const tpl=TEMPLATES[curTemplate];
  const tplKeys=Object.keys(TEMPLATES);
  body.innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font:500 12px/1 var(--f);color:var(--c7);margin-bottom:8px">选择模板</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${tplKeys.map(k=>`<button onclick="applyTemplate('${k}')" style="padding:6px 14px;border-radius:var(--r1);font:500 12px/1 var(--f);cursor:pointer;transition:all .12s;font-family:inherit;border:1px solid ${curTemplate===k?'var(--pr)':'var(--c2)'};background:${curTemplate===k?'var(--pr50)':'var(--sf)'};color:${curTemplate===k?'var(--pr)':'var(--c6)'}">${TEMPLATES[k].label}</button>`).join('')}
      </div>
    </div>
    <div style="margin-bottom:12px;padding:8px 12px;background:var(--c0);border-radius:var(--r1);font:400 12px/1.4 var(--f);color:var(--c5)">
      当前：<span style="font-weight:600;color:var(--c8)">${tpl?tpl.label+'模板':'自定义配置'}</span>
      ${tpl?' · '+tpl.stages.length+'个考核环节':''}
    </div>
    <div class="stage-list">
      ${form.stages.map((s,i)=>`
        <div class="stage-item ${s.enabled?'':'off'}">
          <div><div class="stage-name">${s.name}</div><div class="stage-desc">${s.desc}</div></div>
          ${s.pending?`<span class="stage-pending">待定</span>`:
            `<div class="tog ${s.enabled?'on':''}" onclick="toggleStage(${i})"><div class="tog-track"><div class="tog-knob"></div></div></div>`}

    </div>`;
}

// 给设置按钮绑定事件
document.querySelector('.wiz-sb-icons button[title="设置"]').onclick=openSettings;

// ═══ 渲染 ═══
function render(){renderSidebar();renderContent();updateProgress()}

// ═══ 导航顺序 ═══
function getNavList(){
  const list=['basic','groups'];
  form.stages.filter(s=>s.enabled).forEach(s=>list.push(s.id));
  return list;
}
function renderNavButtons(){
  const nav=getNavList();
  const idx=nav.indexOf(activeSection);
  const prev=idx>0?nav[idx-1]:null;
  const next=idx<nav.length-1?nav[idx+1]:null;
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--dv)">
    <div>${prev?`<button class="btn btn-s" onclick="selSection('${prev}')">上一步</button>`:'<span></span>'}</div>
    <div>${next?`<button class="btn btn-p" onclick="goNextSection('${next}')">下一步</button>`:'<span></span>'}</div>
  </div>`;
}

function renderSidebar(){
  const sections=[
    {id:'basic',t:'基本信息',icon:'check',type:'done'},
    {id:'groups',t:'考核组',icon:'clock',type:'pending'},
    {id:'stages',t:'考核环节',icon:'settings',type:'parent',children:
      form.stages.filter(s=>s.enabled).map(s=>({id:s.id,t:s.name,icon:s.status==='done'?'check':s.status==='warn'?'warn':'clock',type:s.status}))
    },
  ];
  document.getElementById('sidebar').innerHTML=sections.map(s=>{
    if(s.children){
      return `<div class="sb-group">
        <div class="sb-item ${activeSection===s.id?'on':''}" onclick="selSection('${s.id}')">
          <div class="sb-icon ${s.type==='done'?'done':'pending'}">${I[s.icon]}</div>${s.t}
        </div>
        <div class="sb-sub">${s.children.map(c=>`
          <div class="sb-item ${activeSection===c.id?'on':''}" onclick="selSection('${c.id}')">
            <div class="sb-icon ${c.type}">${I[c.icon]}</div>${c.t}
          </div>`).join('')}
        </div>
      </div>`;
    }
    return `<div class="sb-item ${activeSection===s.id?'on':''}" onclick="selSection('${s.id}')">
      <div class="sb-icon ${s.type}">${I[s.icon]}</div>${s.t}
    </div>`;
  }).join('');
}

function updateProgress(){
  const total=form.stages.filter(s=>s.enabled).length+3;
  const done=form.stages.filter(s=>s.status==='done').length+(form.name?1:0)+(form.autoCreate.enabled?1:0)+(form.groups.length>0?1:0);
  const pct=Math.min(100,Math.round(done/total*100));
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+'%';
}

function renderContent(){
  const ct=document.getElementById('content');
  if(activeSection==='basic') renderBasicInfo(ct);
  else if(activeSection==='groups') renderGroups(ct);
  else if(activeSection==='stages') renderStagesOverview(ct);
  else renderStageDetail(ct);
}

  const id='g'+(form.groups.length+1);
  form.groups.push({id,name:'新考核组',rules:[{field:'部门',op:'等于',val:''}],evalRule:'通用评价规则',autoRemove:emptyAutoRemove()});
  render();
}

/** 绩效轴高/中/低 → 当前等级规则下的具体等级名组（对齐 demo-yearly-tr gradesForBand） */
function gradesForPerfBand(band, gradeNames){
  const n=gradeNames.length;
  if(!n) return [];
  if(n===1) return gradeNames.slice();
  const highCount=Math.max(1, Math.floor(n/3));
  const lowCount=Math.max(1, Math.floor(n/3));
  if(band==='高') return gradeNames.slice(0, highCount);
  if(band==='低') return gradeNames.slice(n-lowCount);
  return gradeNames.slice(highCount, n-lowCount);
}

/** 按格子坐标（绩效轴×能力）挑默认具体等级：同轴内能力高取更好档、低取更差档 */
function defaultPerfGradeForCell(band, capability, gradeNames){
  const opts=gradesForPerfBand(band, gradeNames);
  if(!opts.length) return '';
  if(opts.length===1) return opts[0];
  if(capability==='高') return opts[0];
  if(capability==='低') return opts[opts.length-1];
  return opts[Math.floor(opts.length/2)]||opts[0];
}

function bandOfPerfGrade(perfGrade, gradeNames){
  const g=Array.isArray(perfGrade)?perfGrade[0]:perfGrade;
  if(gradesForPerfBand('高', gradeNames).includes(g)) return '高';
  if(gradesForPerfBand('低', gradeNames).includes(g)) return '低';
  return '中';
}

function nineBoxNameFor(perfGrade, capability, gradeNames){
  const band=bandOfPerfGrade(perfGrade, gradeNames);
  return BOX_NAMES[band+'-'+capability]||'';
}

/** 绩效绑定归一为等级名数组；兼容旧单值 string */
function normalizePerfGradeList(raw, gradeNames, fallbackSingle){
  let list;
  if(Array.isArray(raw)) list=raw.slice();
  else if(typeof raw==='string'&&raw) list=[raw];
  else list=[];
  const seen={};
  list=list.filter(g=>{
    if(!gradeNames.includes(g)||seen[g]) return false;
    seen[g]=true;
    return true;
  });
  if(!list.length&&fallbackSingle&&gradeNames.includes(fallbackSingle)) list=[fallbackSingle];
  return list;
}

function nineBoxCellKey(perfGrades, capability){
  return [...perfGrades].slice().sort().join('|')+'-'+capability;
}

function getGradeNames(){
  return getSelectedRule().grades.map(g=>g.name);
}

function defaultNineBoxCells(){
  const gradeNames=getGradeNames();
  return BOX_KEYS_ORDER.map(bandKey=>{
    const [band,capability]=bandKey.split('-');
    const perfGrade=defaultPerfGradeForCell(band, capability, gradeNames);
    const perfGrades=perfGrade?[perfGrade]:[];
    return {
      key:nineBoxCellKey(perfGrades, capability),
      name:BOX_NAMES[bandKey],
      perfGrade:perfGrades,
      capability,
      bandKey
    };
  });
}

function onGradeRuleChange(value){
  form.gradeRule=value;
  const s=form.stages.find(x=>x.id==='inventory');
  if(s) s.nineBox=defaultNineBoxCells(); // 等级规则切换后按新包含等级重建默认九格
  render();
}

/** 盘点强制分布用的考核组列表（方案为空时用示意组） */
function getDistSchemeGroups(){
  if(Array.isArray(form.groups)&&form.groups.length){
    return form.groups.map(g=>({id:g.id,name:g.name||g.id}));
  }
  return DEMO_DIST_GROUPS.slice();
}

/** 按当前考核组 normalize 各组规则绑定 */
function normalizeForcedDistGroups(list,ruleNames,fallbackRuleId){
  const groups=getDistSchemeGroups();
  const prev=Array.isArray(list)?list:[];
  const byId={};
  prev.forEach(row=>{
    if(row&&row.groupId) byId[row.groupId]=row.ruleId;
  });
  const def=ruleNames.includes(fallbackRuleId)?fallbackRuleId:(ruleNames[0]||'');
  return groups.map(g=>{
    let ruleId=byId[g.id];
    if(!ruleNames.includes(ruleId)) ruleId=def;
    return {groupId:g.id,ruleId};
  });
}

function ensureInventoryCfg(s){
  if(typeof s.calcInitialCapability!=='boolean') s.calcInitialCapability=false;

    s.forcedDistRule=s.perfForcedDistRule||s.forcedDistPerfRule;
  }
  if(!s.capForcedDistRule&&s.forcedDistCapRule) s.capForcedDistRule=s.forcedDistCapRule;
  if(!s.nineBox&&s.box9) s.nineBox=s.box9;
  delete s.perfForcedDistRule;
  delete s.forcedDistPerfRule;
  delete s.forcedDistCapRule;
  if(!s.forcedDistRule||!FORCED_DIST_RULES.some(r=>r.name===s.forcedDistRule)){
    s.forcedDistRule=FORCED_DIST_RULES[0].name;

  if(s.forcedDistControl!=='强控'&&s.forcedDistControl!=='弱控') s.forcedDistControl='强控';
  if(typeof s.inventorySubmitMode!=='string') s.inventorySubmitMode='';
  if(s.inventoryCtrlScope!=='全部'&&s.inventoryCtrlScope!=='考核组') s.inventoryCtrlScope='考核组';
  if(!s.capForcedDistRule||!CAP_FORCED_DIST_RULES.some(r=>r.name===s.capForcedDistRule)){
    s.capForcedDistRule=CAP_FORCED_DIST_RULES[0].name;
  }
  if(s.capForcedDistControl!=='强控'&&s.capForcedDistControl!=='弱控') s.capForcedDistControl='强控';
  s.capForcedDistSubmit='全部提交';
  if(s.capCtrlScope!=='全部'&&s.capCtrlScope!=='考核组') s.capCtrlScope='考核组';
  const perfRuleNames=FORCED_DIST_RULES.map(r=>r.name);
  const capRuleNames=CAP_FORCED_DIST_RULES.map(r=>r.name);
  s.forcedDistGroups=normalizeForcedDistGroups(s.forcedDistGroups,perfRuleNames,s.forcedDistRule);
  s.capForcedDistGroups=normalizeForcedDistGroups(s.capForcedDistGroups,capRuleNames,s.capForcedDistRule);
  const gradeNames=getGradeNames();
  if(!Array.isArray(s.nineBox)||s.nineBox.length!==9){
    s.nineBox=defaultNineBoxCells();
  }else{
    s.nineBox=s.nineBox.map((cell,i)=>{
      const fallback=defaultNineBoxCells()[i];
      // 兼容旧字段 perf（高/中/低档）→ perfGrade；单值 string → 数组
      let raw=cell.perfGrade;
      if((raw==null||raw==='')&&cell.perf){
        if(gradeNames.includes(cell.perf)) raw=cell.perf;
        else if(CAP_AXIS.includes(cell.perf)) raw=defaultPerfGradeForCell(cell.perf, cell.capability||fallback.capability, gradeNames);
      }
      const perfGrade=normalizePerfGradeList(raw, gradeNames, fallback.perfGrade[0]);
      const capability=CAP_AXIS.includes(cell.capability)?cell.capability:fallback.capability;
      const key=nineBoxCellKey(perfGrade, capability);
      const bandKey=fallback.bandKey;
      const defaultName=nineBoxNameFor(perfGrade, capability, gradeNames)||BOX_NAMES[bandKey]||fallback.name;
      const name=(typeof cell.name==='string'&&cell.name.trim())?cell.name.trim():defaultName;
      return {key,name,perfGrade,capability,bandKey};
    });
  }
  return s;
}

/** 规则名缩略（下拉 option 展示） */
function fdRuleShortLabel(name){
  const n=String(name||'');
  return n.replace(/强制分布$/,'')||n;
}

/** 窄 select（绩效/能力：全部单行表与按组表共用；详情见右侧列） */
function renderFdRulePick(rules,selectedName,onchangeAttr){
  const cur=(rules.find(r=>r.name===selectedName)||rules[0]||{name:''}).name;
  const opts=rules.map(r=>`<option value="${escHtml(r.name)}" ${r.name===cur?'selected':''}>${escHtml(fdRuleShortLabel(r.name))}</option>`).join('');
  return `<div class="fd-rule-pick">
    <select class="form-input fd-rule-sel" title="${escHtml(cur)}" onchange="${onchangeAttr}">${opts}</select>
  </div>`;
}

/** 规则详情：紧凑多行纯文本（等级：名称 · 规则 上限%；能力：名称 · 介于 min–max%） */
function renderFdRuleDetail(rule,isCap){
  if(!rule) return '<span class="form-hint">—</span>';
  const lines=(isCap?(rule.levels||[]):(rule.grades||[])).map(it=>{
    if(isCap) return `${escHtml(it.name)} · ${escHtml(it.op)} ${it.min}–${it.max}%`;
    return `${escHtml(it.name)} · ${escHtml(it.op)} ${it.pct}%`;
  });
  if(!lines.length) return '<span class="form-hint">—</span>';
  return `<div class="fd-rule-detail">${lines.join('\n')}</div>`;
}

/** 紧贴主行的规则表（左线浅底）：全部=单行「全部」；考核组=多行真实组名 */
function renderGroupForcedDistPanel(side,s){
  const isCap=side==='cap';
  const rules=isCap?CAP_FORCED_DIST_RULES:FORCED_DIST_RULES;
  const scope=isCap?s.capCtrlScope:s.inventoryCtrlScope;
  let rows='';
  let usingDemo=false;
  if(scope==='全部'){
    const ruleField=isCap?'capForcedDistRule':'forcedDistRule';
    const ruleId=s[ruleField]||(rules[0]&&rules[0].name)||'';
    const rule=rules.find(r=>r.name===ruleId)||rules[0];
    rows=`<tr>
      <td style="font:500 13px/1 var(--f);color:var(--c9);width:18%">全部</td>
      <td style="width:160px">${renderFdRulePick(rules,ruleId,`setInventoryDistField('${ruleField}',this.value)`)}</td>
      <td>${renderFdRuleDetail(rule,isCap)}</td>
    </tr>`;
  }else{
    const bindings=isCap?s.capForcedDistGroups:s.forcedDistGroups;
    const groups=getDistSchemeGroups();
    usingDemo=!form.groups||!form.groups.length;
    rows=groups.map(g=>{
      const bind=bindings.find(b=>b.groupId===g.id);
      const ruleId=(bind&&bind.ruleId)||(rules[0]&&rules[0].name)||'';
      const rule=rules.find(r=>r.name===ruleId)||rules[0];
      const gidEsc=String(g.id).replace(/'/g,"\\'");
      return `<tr>
        <td style="font:500 13px/1 var(--f);color:var(--c9);width:18%">${escHtml(g.name)}</td>
        <td style="width:160px">${renderFdRulePick(rules,ruleId,`setInvGroupDistRule('${side}','${gidEsc}',this.value)`)}</td>
        <td>${renderFdRuleDetail(rule,isCap)}</td>
      </tr>`;
    }).join('');
  }
  return `<div class="fd-group-panel">
    ${usingDemo?'<div class="form-hint" style="margin-bottom:6px">暂无考核组，以下为示意</div>':''}
    <table class="tbl" style="margin:0"><thead><tr><th style="width:18%">考核组</th><th style="width:160px">强制分布规则</th><th>规则详情</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function setNineBoxCell(i,field,value){
  const s=form.stages.find(x=>x.id==='inventory');
  if(!s)return;
  ensureInventoryCfg(s);
  const cell=s.nineBox[i];
  if(!cell)return;
  if(field==='name'){
    cell.name=value;
    return; // 输入中不重绘，避免失焦
  }
  const gradeNames=getGradeNames();
  if(field==='capability'&&CAP_AXIS.includes(value)){
    cell.capability=value;
    // 同能力下等级不可重复：从其他格剥走冲突等级
    cell.perfGrade.forEach(g=>{
      s.nineBox.forEach((other,j)=>{
        if(j===i||other.capability!==value) return;
        if(other.perfGrade.includes(g)){
          other.perfGrade=other.perfGrade.filter(x=>x!==g);
          if(!other.perfGrade.length){
            const [band]=other.bandKey.split('-');
            const fb=defaultPerfGradeForCell(band, other.capability, gradeNames);
            other.perfGrade=fb?[fb]:[];
          }
          other.key=nineBoxCellKey(other.perfGrade, other.capability);
          if(!other.name||Object.values(BOX_NAMES).includes(other.name)){
            other.name=nineBoxNameFor(other.perfGrade, other.capability, gradeNames)||BOX_NAMES[other.bandKey]||other.name;
          }
        }
      });
    });
    cell.key=nineBoxCellKey(cell.perfGrade, cell.capability);
    if(!cell.name||Object.values(BOX_NAMES).includes(cell.name)){
      cell.name=nineBoxNameFor(cell.perfGrade, cell.capability, gradeNames)||BOX_NAMES[cell.bandKey]||cell.name;
    }
    render();
    return;
  }
}

function toggleNineBoxPerfGrade(i,grade,checked){
  const s=form.stages.find(x=>x.id==='inventory');
  if(!s)return;
  ensureInventoryCfg(s);
  const cell=s.nineBox[i];
  if(!cell)return;
  const gradeNames=getGradeNames();
  if(!gradeNames.includes(grade)) return;
  let list=cell.perfGrade.slice();
  if(checked){
    if(list.indexOf(grade)<0) list.push(grade);
    // 同能力下其他格若已绑该等级则移除
    s.nineBox.forEach((other,j)=>{
      if(j===i||other.capability!==cell.capability) return;
      if(other.perfGrade.includes(grade)){
        other.perfGrade=other.perfGrade.filter(x=>x!==grade);
        if(!other.perfGrade.length){
          const [band]=other.bandKey.split('-');
          const fb=defaultPerfGradeForCell(band, other.capability, gradeNames);
          other.perfGrade=fb?[fb]:[];
        }
        other.key=nineBoxCellKey(other.perfGrade, other.capability);
        if(!other.name||Object.values(BOX_NAMES).includes(other.name)){
          other.name=nineBoxNameFor(other.perfGrade, other.capability, gradeNames)||BOX_NAMES[other.bandKey]||other.name;
        }
      }
    });
  }else{
    list=list.filter(x=>x!==grade);
    if(!list.length){
      // 至少保留一个：回滚勾选状态
      document.querySelectorAll('#nineBoxPerfMs-'+i+' .leave-ms-opt').forEach(function(lb){
        var c=lb.querySelector('input');
        if(c&&lb.textContent.trim()===grade) c.checked=true;
      });
      return;
    }
  }
  cell.perfGrade=normalizePerfGradeList(list, gradeNames, list[0]);
  cell.key=nineBoxCellKey(cell.perfGrade, cell.capability);
  if(!cell.name||Object.values(BOX_NAMES).includes(cell.name)){
    cell.name=nineBoxNameFor(cell.perfGrade, cell.capability, gradeNames)||BOX_NAMES[cell.bandKey]||cell.name;
  }
  // 勾选时只刷新 trigger，避免菜单关闭；取消勾选同理；冲突清理后需整板重绘
  const needFull=checked; // 可能改了其他格
  if(needFull){
    render();
    // 重绘后保持本格菜单打开
    requestAnimationFrame(function(){
      var wrap=document.querySelector('.leave-ms[data-ninebox-i="'+i+'"]');
      if(wrap) wrap.classList.add('open');
    });
  }else{
    var trigger=document.querySelector('.leave-ms[data-ninebox-i="'+i+'"] .leave-ms-trigger');
    if(trigger) trigger.innerHTML=renderNineBoxPerfMsTriggerInner(cell.perfGrade);
  }
}

function getMonthlyPreview(day){
  const now=new Date();
  const previews=[];
  for(let i=1;i<=3;i++){
    const targetMonth=new Date(now.getFullYear(),now.getMonth()+i,1);
    const lastDayOfPrev=new Date(targetMonth.getFullYear(),targetMonth.getMonth(),0).getDate();
    const d=Math.min(day,lastDayOfPrev);
    const createDate=new Date(targetMonth.getFullYear(),targetMonth.getMonth()-1,d);
    previews.push({
      period:`${targetMonth.getFullYear()}-${String(targetMonth.getMonth()+1).padStart(2,'0')}`,
      create:`${createDate.getFullYear()}-${String(createDate.getMonth()+1).padStart(2,'0')}-${String(createDate.getDate()).padStart(2,'0')}`
    });
  }
  return previews;
}

}

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function clampAutoRemoveDays(v){
  var n=parseInt(v,10);
  if(isNaN(n)) return 7;
  if(n<1) return 1;
  if(n>365) return 365;
  return n;
}
function filterLeaveTypes(list){
  if(!Array.isArray(list)) return [];
  return LEAVE_TYPES.filter(function(t){return list.indexOf(t)>=0;});
}
function emptyAutoRemove(){
  return {enabled:false,resignation:{enabled:false,days:7},leaveStart:{enabled:false,leaveTypes:[],days:7},leaveEnd:{enabled:false,leaveTypes:[],days:7},conditions:[]};
}
function syncAutoRemoveConditions(ar){
  ar.conditions=[];
  if(ar.resignation&&ar.resignation.enabled) ar.conditions.push('resignation');
  if(ar.leaveStart&&ar.leaveStart.enabled) ar.conditions.push('leaveStart');
  if(ar.leaveEnd&&ar.leaveEnd.enabled) ar.conditions.push('leaveEnd');
  return ar;
}
function ensureAutoRemove(grp){
  var ar=grp.autoRemove;
  if(!ar||typeof ar!=='object') ar={enabled:false};
  var hasStructured=!!(ar.resignation||ar.leaveStart||ar.leaveEnd);
  grp.autoRemove=syncAutoRemoveConditions({
    enabled:!!ar.enabled,
    resignation:{
      enabled:hasStructured?!!(ar.resignation&&ar.resignation.enabled):!!(ar.conditions&&ar.conditions.indexOf('resignation')>=0),
      days:clampAutoRemoveDays(ar.resignation&&ar.resignation.days)
    },
    leaveStart:{
      enabled:!!(ar.leaveStart&&ar.leaveStart.enabled),
      leaveTypes:filterLeaveTypes(ar.leaveStart&&ar.leaveStart.leaveTypes),
      days:clampAutoRemoveDays(ar.leaveStart&&ar.leaveStart.days)
    },
    leaveEnd:{
      enabled:!!(ar.leaveEnd&&ar.leaveEnd.enabled),
      leaveTypes:filterLeaveTypes(ar.leaveEnd&&ar.leaveEnd.leaveTypes),
      days:clampAutoRemoveDays(ar.leaveEnd&&ar.leaveEnd.days)
    }
  });
  return grp.autoRemove;
}
function renderLeaveMsTriggerInner(types){
  if(!types||!types.length) return '<span class="leave-ms-ph">请选择假种</span>';
  return types.map(function(t){return '<span class="leave-ms-tag">'+escHtml(t)+'</span>';}).join('');
}
function renderLeaveMs(gi,key,types){
  return '<div class="leave-ms" data-gi="'+gi+'" data-rule="'+key+'">'+
    '<button type="button" class="leave-ms-trigger" onclick="event.stopPropagation();toggleLeaveMs(event,'+gi+',\''+key+'\')">'+renderLeaveMsTriggerInner(types)+'</button>'+
    '<div class="leave-ms-menu" id="leaveMs-'+gi+'-'+key+'">'+
      LEAVE_TYPES.map(function(t){
        var on=types.indexOf(t)>=0;
        return '<label class="leave-ms-opt" onclick="event.stopPropagation()"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleLeaveType('+gi+',\''+key+'\',\''+t+'\',this.checked)">'+escHtml(t)+'</label>';
      }).join('')+
    '</div></div>';
}
function renderDaysRow(gi,key,prefix,days){
  return '<div class="ar-days"><span>'+prefix+'</span>'+
    '<input type="number" min="1" max="365" value="'+escHtml(days)+'" oninput="setAutoRemoveDays('+gi+',\''+key+'\',this)" onblur="normalizeAutoRemoveDaysInput('+gi+',\''+key+'\',this)">'+
    '<span>天内有效</span></div>';
}
function renderAutoRemoveRule(gi,key,label,ar){
  var rule=ar[key];
  var cfg='';
  if(rule.enabled){
    var parts=[];
    if(key==='leaveStart'||key==='leaveEnd'){
      parts.push('<div class="ar-leave"><span class="ar-leave-lb">假种</span>'+renderLeaveMs(gi,key,rule.leaveTypes)+'</div>');
    }
    parts.push(renderDaysRow(gi,key,key==='leaveEnd'?'周期结束前':'周期开始后',rule.days));
    cfg='<div class="ar-rule-cfg">'+parts.join('')+'</div>';
  }
  return '<div class="ar-rule"><label class="ar-rule-hd"><input type="checkbox" '+(rule.enabled?'checked':'')+' onchange="toggleAutoRemoveRule('+gi+',\''+key+'\',this.checked)">'+label+'</label>'+cfg+'</div>';
}
function renderAutoRemovePanel(grp,gi){
  var ar=ensureAutoRemove(grp);
  return '<div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<span style="font:600 12px/1 var(--f);color:var(--c6)">三、移除人员规则</span>'+
      '<div class="tog '+(ar.enabled?'on':'')+'" onclick="toggleAutoRemove('+gi+')"><div class="tog-track"><div class="tog-knob"></div></div></div>'+
    '</div>'+
    '<div id="autoRemovePanel-'+gi+'" class="ar-panel'+(ar.enabled?'':' is-off')+'">'+
      '<div class="ar-list">'+
        renderAutoRemoveRule(gi,'resignation','员工离职',ar)+
        renderAutoRemoveRule(gi,'leaveStart','开始休假',ar)+
        renderAutoRemoveRule(gi,'leaveEnd','结束休假',ar)+
      '</div></div></div>';
}
function toggleAutoRemove(gi){
  var grp=form.groups[gi];
  var ar=ensureAutoRemove(grp);
  ar.enabled=!ar.enabled;
  render();
}
function toggleAutoRemoveRule(gi,key,checked){
  var grp=form.groups[gi];
  var ar=ensureAutoRemove(grp);
  ar[key].enabled=!!checked;
  syncAutoRemoveConditions(ar);
  render();
}
function setAutoRemoveDays(gi,key,el){
  var raw=el.value;
  if(raw===''||raw==='-') return;
  var n=parseInt(raw,10);
  if(isNaN(n)) return;
  if(n<1){n=1;el.value=n;}
  if(n>365){n=365;el.value=n;}
  ensureAutoRemove(form.groups[gi])[key].days=n;
}
function normalizeAutoRemoveDaysInput(gi,key,el){
  var n=clampAutoRemoveDays(el.value);
  ensureAutoRemove(form.groups[gi])[key].days=n;
  el.value=n;
}
function toggleLeaveType(gi,key,type,checked){
  var ar=ensureAutoRemove(form.groups[gi]);
  var list=ar[key].leaveTypes.slice();
  if(checked){ if(list.indexOf(type)<0) list.push(type); }
  else list=list.filter(function(t){return t!==type;});
  ar[key].leaveTypes=filterLeaveTypes(list);
  var trigger=document.querySelector('.leave-ms[data-gi="'+gi+'"][data-rule="'+key+'"] .leave-ms-trigger');
  if(trigger) trigger.innerHTML=renderLeaveMsTriggerInner(ar[key].leaveTypes);
}

  document.querySelectorAll('.leave-ms.open').forEach(function(el){el.classList.remove('open');});
}
function toggleLeaveMs(ev,gi,key){
  if(ev) ev.stopPropagation();
  var wrap=document.querySelector('.leave-ms[data-gi="'+gi+'"][data-rule="'+key+'"]');
  var wasOpen=wrap&&wrap.classList.contains('open');
  closeAllLeaveMs();
  if(wrap&&!wasOpen) wrap.classList.add('open');
}

// ═══ 环节自动开启/结束（与自动创建活动同一套周期相对控件） ═══
function getCycleDayLimit(){
  var ct=form.cycleType||'月度';
  if(ct==='月度') return 15;
  if(ct==='季度') return 90;
  if(ct==='半年度') return 180;
  return 365;
}
function getCycleDayDefault(){
  var ct=form.cycleType||'月度';
  if(ct==='半年度') return 14;
  if(ct==='年度') return 30;
  return 7;
}
function normalizeStageTiming(a){
  if(!a) return {enabled:false,direction:'前',days:getCycleDayDefault()};
  if(a.direction!=='前'&&a.direction!=='后'){
    if(typeof a.offsetDays==='number') a.direction=a.offsetDays<0?'前':'后';
    else a.direction='前';
  }
  var max=getCycleDayLimit();
  var def=getCycleDayDefault();
  var d=parseInt(a.days,10);
  if((!d||d<1)&&typeof a.offsetDays==='number') d=Math.abs(a.offsetDays)||def;
  if(!d||d<1) d=def;
  if(d>max) d=max;
  a.days=d;
  delete a.mode; delete a.ref; delete a.offsetDays; delete a.fixedRule; delete a.fixedOffset;
  return a;
}
function ensureStageAuto(stage,type){
  var key=type==='start'?'autoStart':'autoEnd';
  if(!stage[key]) stage[key]={enabled:false,direction:type==='start'?'前':'后',days:getCycleDayDefault()};
  return normalizeStageTiming(stage[key]);
}
function clampAllStageTimingDays(){
  (form.stages||[]).forEach(function(s){
    if(s.autoStart) normalizeStageTiming(s.autoStart);
    if(s.autoEnd) normalizeStageTiming(s.autoEnd);
  });
}
function calcStageDate(a){
  var refDate=new Date('2026-07-01');
  var days=parseInt(a&&a.days,10)||getCycleDayDefault();
  var sign=(a&&a.direction==='后')?1:-1;
  return new Date(refDate.getTime()+sign*days*86400000);
}
function formatStageTimingDesc(a){
  a=normalizeStageTiming(a||{});
  return '周期开始'+a.direction+' '+a.days+' 天';
}
function checkStageConflict(stage,type){
  if(type!=='start') return null;
  var stages=form.stages.filter(function(s){return s.enabled;});
  var idx=-1;
  for(var i=0;i<stages.length;i++){ if(stages[i].id===stage.id){ idx=i; break; } }
  if(idx<=0) return null;
  var prevStage=stages[idx-1];
  if(!prevStage.autoEnd||!prevStage.autoEnd.enabled) return null;
  var startDate=calcStageDate(ensureStageAuto(stage,'start'));
  var prevEndDate=calcStageDate(ensureStageAuto(prevStage,'end'));
  if(startDate<prevEndDate){
    return {prevStageName:prevStage.name,prevEndDate:prevEndDate,startDate:startDate};
  }
  return null;
}
function formatStageConflict(conflict,pad){
  if(!conflict) return '';
  return '⚠ 上一环节「'+conflict.prevStageName+'」自动结束于 '+conflict.prevEndDate.getFullYear()+'-'+pad(conflict.prevEndDate.getMonth()+1)+'-'+pad(conflict.prevEndDate.getDate())+'<br>'+
    '&nbsp;&nbsp;&nbsp;&nbsp;当前环节开启时间早于上一环节结束时间，请检查';
}
function renderStageTimingPanel(type,stage){
  var a=ensureStageAuto(stage,type);
  var label=type==='start'?'开启':'结束';
  var max=getCycleDayLimit();
  var previewId='timeRulePreview-'+type+'-'+stage.id;
  var pad=function(n){return String(n).padStart(2,'0');};
  var resultDate=calcStageDate(a);
  var conflict=checkStageConflict(stage,type);
  var desc=formatStageTimingDesc(a);
  return '<div style="font:500 12px/1 var(--f);color:var(--c6);margin-bottom:10px">自动'+label+'时间</div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+
      '<span style="font:400 13px/1 var(--f);color:var(--c7)">周期开始</span>'+
      '<select class="form-input" style="width:80px" onchange="setStageTimingField(\''+stage.id+'\',\''+type+'\',\'direction\',this.value)">'+
        '<option value="前" '+(a.direction==='前'?'selected':'')+'>前</option>'+
        '<option value="后" '+(a.direction==='后'?'selected':'')+'>后</option>'+
      '</select>'+
      '<input class="form-input" type="number" value="'+a.days+'" min="1" max="'+max+'" style="width:60px" oninput="setStageTimingDays(\''+stage.id+'\',\''+type+'\',this.value,this)">'+
      '<span style="font:400 13px/1 var(--f);color:var(--c7)">天</span>'+
    '</div>'+
    '<div id="'+previewId+'" style="margin-top:10px;padding:8px 12px;background:var(--pr50);border:1px solid var(--pr100);border-radius:var(--r1);font:400 12px/1.3 var(--f);color:var(--pr700)">'+
      '📅 预览：预计自动'+label+'日期 '+resultDate.getFullYear()+'-'+pad(resultDate.getMonth()+1)+'-'+pad(resultDate.getDate())+'（'+desc+'）'+
    '</div>'+
    '<div id="timeRuleConflict-'+type+'-'+stage.id+'" style="margin-top:8px;padding:8px 12px;background:var(--ro50);border:1px solid var(--ro100);border-radius:var(--r1);font:400 12px/1.3 var(--f);color:var(--ro);display:'+(conflict?'block':'none')+'">'+
      formatStageConflict(conflict,pad)+
    '</div>';
}
function setStageTimingField(stageId,type,field,value){
  var stage=form.stages.find(function(s){return s.id===stageId;});
  if(!stage) return;
  var a=ensureStageAuto(stage,type);
  a[field]=value;
  updateStageTimingPreview(type,stageId);
}
function setStageTimingDays(stageId,type,raw,inputEl){
  var stage=form.stages.find(function(s){return s.id===stageId;});
  if(!stage) return;
  var a=ensureStageAuto(stage,type);
  var max=getCycleDayLimit();
  var def=getCycleDayDefault();
  var d=parseInt(raw,10);
  if(!d||d<1) d=def;
  if(d>max) d=max;
  a.days=d;
  if(inputEl) inputEl.value=d;
  updateStageTimingPreview(type,stageId);
}
function updateStageTimingPreview(type,stageId){
  var el=document.getElementById('timeRulePreview-'+type+'-'+stageId);
  if(!el) return;
  var stage=form.stages.find(function(s){return s.id===stageId;});
  if(!stage) return;
  var a=ensureStageAuto(stage,type);
  var pad=function(n){return String(n).padStart(2,'0');};
  var label=type==='start'?'开启':'结束';
  var resultDate=calcStageDate(a);
  var desc=formatStageTimingDesc(a);
  var conflict=checkStageConflict(stage,type);
  el.innerHTML='📅 预览：预计自动'+label+'日期 '+resultDate.getFullYear()+'-'+pad(resultDate.getMonth()+1)+'-'+pad(resultDate.getDate())+'（'+desc+'）';
  var conflictEl=document.getElementById('timeRuleConflict-'+type+'-'+stageId);
  if(conflictEl){
    conflictEl.style.display=conflict?'block':'none';
    conflictEl.innerHTML=formatStageConflict(conflict,pad);
  }
}
function updateStageAuto(stageId,type,enabled){
  var stage=form.stages.find(function(s){return s.id===stageId;});
  if(!stage) return;
  var a=ensureStageAuto(stage,type);
  a.enabled=enabled;
}

// ═══ 导航 ═══
function selSection(id){activeSection=id;render()}
function setRatifySubmitMode(value){form.ratifySubmitMode=value}
function validateRatifySubmitMode(){
  const ratifyStage=form.stages.find(s=>s.id==='ratify');
  if(ratifyStage&&ratifyStage.enabled&&!form.ratifySubmitMode){
    alert('请选择提交方式');
    activeSection='ratify';
    render();
    return false;
  }
  return true;
}
function validateInventorySubmitMode(){
  const inv=form.stages.find(s=>s.id==='inventory');
  if(inv&&inv.enabled){
    ensureInventoryCfg(inv);
    if(!inv.inventorySubmitMode){
      alert('请选择提交方式');
      activeSection='inventory';
      render();
      return false;
    }
  }
  return true;
}
function goNextSection(id){
  if(activeSection==='ratify'&&!validateRatifySubmitMode())return;
  if(activeSection==='inventory'&&!validateInventorySubmitMode())return;
  selSection(id);
}
function validateScheme(){
  if(!form.name){alert('请填写方案名称');activeSection='basic';render();return false}
  if(!validateRatifySubmitMode())return false;
  return validateInventorySubmitMode();
}
function toggleSec(el){el.closest('.form-sec').classList.toggle('open')}
function submit(){if(!validateScheme())return;alert('方案已提交：'+form.name)}

function cancelEdit(){
  if(confirm('确定要取消编辑吗？未保存的更改将丢失。')){
    window.location.href='perf-scheme-list.html';
  }
}

function saveScheme(){
  if(!validateScheme())return;
  alert('方案「'+form.name+'」保存成功');
  window.location.href='perf-scheme-list.html';
}

document.addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.closest&&t.closest('.leave-ms')) return;
  closeAllLeaveMs();
});

GHR_NAV.init('perf', '绩效方案');
applyTemplate(curTemplate); // 默认年度：面谈→盘点→确认（审定默认关，列表可见可单独开启）
render();
</script>
